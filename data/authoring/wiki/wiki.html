ns</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>◐ extends</td><td>The Himalayas are the 'Water Tower of Asia' whose rivers supply drinking, farming and industrial water to hundreds of millions, while in the water-scarce Thar people conserve rain with traditional taanka or kund rainwater-harvesting systems.</td><td>Section: The Himalayas as a Water Tower / Section: The Great Indian Desert — Thar Desert</td></tr>\n<tr><td>[[oceans-and-water-bodies</td><td>Oceans and water bodies]]</td><td>○ uses</td><td>The Arabian Sea, Indian Ocean and Bay of Bengal bound the subcontinent and hold its two island groups, and India's inland water bodies range from Ladakh's saltwater Pangong Tso to the east-coast Chilika Lake and Pulicat lagoon.</td><td>Section: Introduction: India as a Subcontinent / Section: The Cold Desert of India — Ladakh / Section: India's Amazing Coastlines / Section: Indian Islands</td></tr>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>○ uses</td><td>Rainfall varies from extremely scarce in the cold desert of Ladakh to among the highest in the world in the Garo, Khasi and Jaintia Hills of Meghalaya.</td><td>Section: The Cold Desert of India — Ladakh / Section: The Hills of the Northeast</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/social_sciences/vii/summaries/ch_01_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "social_sciences-vii-ch02": {"title": "Understanding the Weather", "crumb": "chapter · Social Sciences · Class 7", "html": "<h1>Understanding the Weather</h1>\n<p><strong>Social Sciences · Class 7 · Chapter 2</strong></p>\n<p><em>Defines weather and its five elements — temperature, precipitation, pressure, wind and humidity — explains how each is measured, and shows how weather stations and the IMD turn those readings into forecasts and warnings.</em></p>\n<blockquote>Weather is defined as the state of the Earth's atmosphere at a particular time and place. The atmosphere is the layer of gases surrounding the Earth, commonly referred to as air, and it is structured in multiple layers like a cake. The layer closest to the Earth's surface is called the troposphere, which extends from 6 to 18 kilometres above the ground — thinner at the poles where cold air contracts, and thicker in the tropical zone where warmer air expands. Almost all weather phenomena occur within the …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>● introduces</td><td>Precipitation (rain, snow, sleet or hail) is measured with a rain gauge whose scale reads rainfall in millimetres, humidity — the water vapour in the air — is measured by a hygrometer as relative humidity from dry (20–40%) to humid (60–80%), and these readings, alongside traditional signs such as ants moving eggs or frogs croaking, feed forecasts of rain, of the monsoon's arrival and IMD colour-coded heavy-rain warnings.</td><td>Section: Weather and its Elements / Section: Weather Instruments b) Precipitation / e) Humidity / Section: Predicting the Weather</td></tr>\n<tr><td>[[water-cycle</td><td>The water cycle]]</td><td>○ uses</td><td>The IMD's motto 'From the sun arises rain', taken from the Manusmṛiti's 'from the sun arises rain, from rain comes food, and from food, living beings originate', is presented as the ancient understanding of the sun's role in the water cycle.</td><td>Section: Weather Instruments a) Temperature (IMD motto)</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/social_sciences/vii/summaries/ch_02_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "social_sciences-vii-ch03": {"title": "Climates of India", "crumb": "chapter · Social Sciences · Class 7", "html": "<h1>Climates of India</h1>\n<p><strong>Social Sciences · Class 7 · Chapter 3</strong></p>\n<p><em>Distinguishes weather, seasons and climate, surveys India's climate types and the factors behind them, explains the monsoon's mechanism and its hold on culture and economy, and covers climate-linked disasters and climate change.</em></p>\n<blockquote>Weather refers to what we experience from day to day — rain, sunshine, wind, heat — and it keeps changing. Climate, by contrast, is the long-term pattern of weather that a region experiences over several decades, and this pattern varies from region to region. Seasons occur as the Earth revolves around the Sun, recurring every year, and the weather of a place differs in each season.</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-and-heat</td><td>Water and heat]]</td><td>● introduces</td><td>Because the sea absorbs and releases heat more slowly than land, coastal Mumbai has a yearly temperature range of about 14°C against inland Nagpur's 34°C, and this same land–ocean heating difference creates the pressure contrasts that drive the monsoon winds.</td><td>Section: Factors Determining the Climate — Proximity to the Sea / Section: The Monsoons</td></tr>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>◐ extends</td><td>The monsoon is a seasonal wind reversal — in summer the heated Asian landmass forms a low that draws moisture-laden ocean winds inland to drop heavy rain (the south-west monsoon advancing from early June to cover India by mid-July, the Western Ghats leaving the Deccan in a rain shadow, Mawsynram receiving about 11,000 mm a year), while in winter dry winds blow from land to sea except where the north-east monsoon gathers Bay of Bengal moisture for the east and south — and a failed monsoon means scarcity, higher food prices and migration.</td><td>Section: The Monsoons / Section: Factors Determining the Climate — Winds, Topography / Section: Types of Climates in India / Section: Climate and our Lives</td></tr>\n<tr><td>[[water-cycle</td><td>The water cycle]]</td><td>○ uses</td><td>Cooler, moisture-laden winds drawn in from the ocean condense their moisture over the heated land and drop it as heavy monsoon rain, and winds crossing the Bay of Bengal collect moisture again for east and south India — the ocean-to-rain leg of the water cycle.</td><td>Section: Factors Determining the Climate — Winds / Section: The Monsoons</td></tr>\n<tr><td>[[rivers-and-landforms</td><td>Rivers and landforms]]</td><td>○ uses</td><td>Floods occur when heavy rain, river-bank breaches or bursting glacial lakes send water over normally dry land — as in the 2013 Kedarnath disaster — and urban flooding is worsened by poor drainage, encroached waterways and impermeable concrete.</td><td>Section: Climates and Disasters — Floods</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>○ uses</td><td>The arid Thar demands unique water conservation practices, and a failed monsoon brings water scarcity that hurts farming and the industries that depend on predictable water availability.</td><td>Section: Types of Climates in India / Section: Climate and our Lives</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/social_sciences/vii/summaries/ch_03_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-viii-ch02": {"title": "The Invisible Living World: Beyond Our Naked Eye", "crumb": "chapter · Science · Class 8", "html": "<h1>The Invisible Living World: Beyond Our Naked Eye</h1>\n<p><strong>Science · Class 8 · Chapter 2</strong></p>\n<p><em>Cells, levels of organisation and microorganisms are introduced through the microscope, with microbes' roles in decomposition, food and water.</em></p>\n<blockquote>The chapter opens by explaining that the human eye cannot see objects below a certain size, and that the invention of the lens — shaped like a lentil seed — and subsequently the microscope, revealed a hidden world of tiny living creatures. Robert Hooke (1665) used a microscope to observe cork slices, naming the compartments he saw \"cells.\" Around the same time Antonie van Leeuwenhoek built improved microscopes and became the first to clearly see and describe bacteria and blood cells, earning him the title Father …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<p><em>None recorded.</em> Water appears only as a sampling medium (pond or stagnant water observed under the microscope, a water-filled flask used as a lens) and as the habitat of microalgae; the chapter teaches cells and microorganisms, not any water concept.</p>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“inside the human gut (helping with digestion, as introduced in Grade 7)”</li>\n<li>“sub-cellular components that will be studied in higher classes”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/viii/summaries/ch_02_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-viii-ch06": {"title": "Pressure, Winds, Storms, and Cyclones", "crumb": "chapter · Science · Class 8", "html": "<h1>Pressure, Winds, Storms, and Cyclones</h1>\n<p><strong>Science · Class 8 · Chapter 6</strong></p>\n<p><em>Pressure — in solids, liquids and the atmosphere — explains winds, sea and land breezes, storms, lightning and cyclones.</em></p>\n<blockquote>This section introduces the concept of pressure as force per unit area, motivated by a relatable scenario of two children carrying bags with narrow and broad straps. The key term introduced is pressure, defined as Pressure = Force / Area. The section establishes that when the same force is distributed over a smaller area, the resulting pressure is higher — which is why narrow-strap bags feel more uncomfortable than broad-strap bags. The SI unit of pressure is newton per metre squared (N/m²), also called pascal …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-and-heat</td><td>Water and heat]]</td><td>◐ extends</td><td>Sea and land breezes are re-explained through pressure: by day the faster-heating land warms the air above it into a low-pressure area that cooler sea air flows into, and at night the warmer sea reverses the flow.</td><td>6.3 Formation of Wind</td></tr>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>◐ extends</td><td>Storms form when warm moist air rises, expands and cools so its water vapour condenses into clouds and the droplets merge to fall as rain, hail or snow; ice particles and droplets rubbing inside the cloud build the charges that discharge as lightning in a thunderstorm (Kalboishakhi, Bordoisila and mango showers are pre-monsoon examples), and cyclones bring intense winds and heavy rainfall around a calm eye.</td><td>6.5 Storms, Thunderstorms, and Lightning / 6.6 Cyclone</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>○ uses</td><td>Overhead water tanks are placed high to supply good pressure and dam bases are built broader than their tops to withstand the large sideways water pressure near the bottom, because liquid pressure depends on the height of the water column and acts in all directions (liquid pressure itself has no id; placed under the nearest).</td><td>6.1 Pressure (Activities 6.1, 6.2; 'Ever heard of…' on dams)</td></tr>\n<tr><td>[[oceans-and-water-bodies</td><td>Oceans and water bodies]]</td><td>○ uses</td><td>A cyclone is powered by warm ocean water — rising moist air condenses and releases latent heat that deepens the low pressure — weakens once it reaches land and loses its moist air, and drives storm surges of 3–12 metres that flood coasts and contaminate drinking water with seawater.</td><td>6.6 Cyclone</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/viii/summaries/ch_06_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-viii-ch07": {"title": "Particulate Nature of Matter", "crumb": "chapter · Science · Class 8", "html": "<h1>Particulate Nature of Matter</h1>\n<p><strong>Science · Class 8 · Chapter 7</strong></p>\n<p><em>All matter is made of tiny constituent particles whose spacing, attraction and motion explain the solid, liquid and gaseous states and the changes between them.</em></p>\n<blockquote>Section 7.1 introduces the central question of what matter is made up of. Through Activity 7.1 (breaking and grinding chalk), students explore whether matter can be subdivided indefinitely. The activity establishes that even after grinding chalk to fine powder, each speck remains chalk — a physical change only. The key term introduced is constituent particle: the basic indivisible unit that makes up a larger piece of a substance. Activity 7.2 (dissolving sugar in water) reinforces this idea. After stirring, sugar …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[states-of-water</td><td>States of water]]</td><td>◐ extends</td><td>Ice, water and vapour are explained by particles: in ice they only vibrate in fixed positions, at the melting point (0 °C) they break free to move within a limited space, at the boiling point they escape as vapour with bubbles forming throughout the bulk, whereas evaporation happens only at the surface at any temperature — and water, unlike air, is practically incompressible.</td><td>7.2.1 Solid state / 7.2.2 Liquid state (Activity 7.4) / 7.3 (Activity 7.6)</td></tr>\n<tr><td>[[water-as-solvent</td><td>Water as a solvent]]</td><td>◐ extends</td><td>Sugar dissolved in water turns invisible but is still there (its taste proves it) because its particles slip into the spaces between water particles, so the solution's volume is less than the sum of the two, whereas insoluble sand settles and adds volume; a grain of potassium permanganate spreading through water — faster in hot water — shows that water particles are always moving.</td><td>7.1 (Activity 7.2) / 7.3 (Activity 7.7) / 7.4 (Activity 7.8, 'Think Like a Scientist')</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/viii/summaries/ch_07_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-viii-ch08": {"title": "Nature of Matter: Elements, Compounds, and Mixtures", "crumb": "chapter · Science · Class 8", "html": "<h1>Nature of Matter: Elements, Compounds, and Mixtures</h1>\n<p><strong>Science · Class 8 · Chapter 8</strong></p>\n<p><em>Matter is classified into mixtures and pure substances — elements and compounds — with minerals as naturally occurring elements and compounds.</em></p>\n<blockquote>This chapter explores how all matter around us is composed of substances that can be classified as mixtures, pure substances (elements or compounds), and minerals. Beginning from familiar everyday objects, the chapter builds a hierarchical understanding of the classification of matter.</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-as-solvent</td><td>Water as a solvent]]</td><td>○ uses</td><td>Sugar dissolved in water is the model uniform mixture (components indistinguishable even under a microscope), sand-in-water and seawater are solid–liquid mixtures and oxygen-in-water a gas–liquid one, while water itself is shown by passing electricity through it to be a compound of hydrogen and oxygen in a fixed 2:1 ratio — a fact about water's own make-up with no id of its own, placed here as nearest.</td><td>8.1 What Are Mixtures? / 8.1.2 Types of mixtures (Table 8.1) / 8.3 What Are the Types of Pure Substances? (Activity 8.3) / 8.3.2 Compounds</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“revisits the composition of air, confirmed from earlier learning”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/viii/summaries/ch_08_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-viii-ch09": {"title": "The Amazing World of Solutes, Solvents, and Solutions", "crumb": "chapter · Science · Class 8", "html": "<h1>The Amazing World of Solutes, Solvents, and Solutions</h1>\n<p><strong>Science · Class 8 · Chapter 9</strong></p>\n<p><em>Solutions are defined through solute, solvent, saturation, concentration and solubility (of solids and gases with temperature); then density and its measurement explain floating and sinking.</em></p>\n<blockquote>This section introduces the distinction between uniform and non-uniform mixtures, using everyday examples such as salt-in-water versus sand-in-water. A uniform mixture of two or more substances is defined as a solution. When a solid dissolves in a liquid to form a solution, the solid component is called the solute and the liquid is called the solvent. For solutions formed by mixing two liquids, the component present in smaller amount is the solute and the one in larger amount is the solvent. The section notes that …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-as-solvent</td><td>Water as a solvent]]</td><td>◐ extends</td><td>In a salt–water solution the dissolved solid is the solute and water the solvent; a fixed volume of water dissolves only so much salt before the solution is saturated, solubility of most solids rises with temperature (baking soda at 20, 50 and 70 °C) while that of gases falls, and concentration separates dilute from concentrated solutions.</td><td>9.1 What Are Solute, Solvent, and Solution? / 9.2 (Activity 9.1) / 9.2.1 (Activity 9.2) / 9.3 Solubility of Gases</td></tr>\n<tr><td>[[measuring-water</td><td>Measuring water]]</td><td>◐ extends</td><td>Water volume is read on a measuring cylinder (5 mL to 500 mL sizes) at its least count with the eye level to the meniscus — Activity 9.5 measures out exactly 50 mL — and the rise in water level when an irregular object is submerged gives that object's volume, while a digital balance with tare gives mass in grams.</td><td>9.5.1 Determination of density (Activities 9.3, 9.4, 9.5, 9.7)</td></tr>\n<tr><td>[[states-of-water</td><td>States of water]]</td><td>◐ extends</td><td>Water is densest at 4 °C and expands as it freezes into ice at 0 °C, so ice is less dense than liquid water and floats — the anomalous behaviour of water.</td><td>9.5.2 Effect of temperature on density</td></tr>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>○ uses</td><td>Colder water holds more dissolved oxygen, so warming water leaves fish short of oxygen, and because ice is less dense than water it floats and insulates the water beneath, keeping aquatic life alive in cold climates.</td><td>9.3 Solubility of Gases / 9.5.2 Effect of temperature on density</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/viii/summaries/ch_09_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-viii-ch13": {"title": "Our Home: Earth, a Unique Life Sustaining Planet", "crumb": "chapter · Science · Class 8", "html": "<h1>Our Home: Earth, a Unique Life Sustaining Planet</h1>\n<p><strong>Science · Class 8 · Chapter 13</strong></p>\n<p><em>Earth's position, size, atmosphere and magnetic field keep water liquid and life possible, sustained by the interplay of hydrosphere, geosphere, biosphere and atmosphere and now threatened by the triple planetary crisis.</em></p>\n<blockquote>This section introduces Earth as the only known planet that supports life in all its forms, situating it as the focus of the concluding chapter of the middle-stage science journey. It establishes that all life exists within a remarkably thin layer on Earth's surface—the crust—which, if Earth were the size of an apple, would be no thicker than the apple's skin. This razor-thin, life-supporting layer is presented as the defining feature that makes Earth extraordinary. The section contains Activity 13.1, a student …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[oceans-and-water-bodies</td><td>Oceans and water bodies]]</td><td>◐ extends</td><td>Water covering about 70 per cent of Earth's surface — ponds, rivers, seas, oceans and groundwater — forms the hydrosphere, which is why Earth looks like the Blue Planet from space, and melting ice caps now raise sea levels that flood coastal areas.</td><td>13.4.1 Air, water, and sunlight / 13.3.1 Position of the Earth / 13.6 What Are the Threats to Life on Earth?</td></tr>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>◐ extends</td><td>Liquid water is essential for life to evolve and be sustained: it acts as a solvent, transports nutrients in plants, regulates body temperature in animals, aids digestion and supports aquatic life from plankton to whales, while water pollution from industrial, agricultural and plastic waste harms that life.</td><td>13.4.1 Air, water, and sunlight / 13.6 What Are the Threats to Life on Earth?</td></tr>\n<tr><td>[[states-of-water</td><td>States of water]]</td><td>○ uses</td><td>Earth sits in the habitable (Goldilocks) zone where temperatures keep water liquid — closer to the Sun it would evaporate, farther away it would freeze — and the atmosphere's mild greenhouse effect is what holds that liquid range.</td><td>13.3.1 Position of the Earth / 13.2 What Do the Planets of Our Solar System Look Like?</td></tr>\n<tr><td>[[water-cycle</td><td>The water cycle]]</td><td>○ uses</td><td>Water vapour forms clouds that bring rain and snow, refilling rivers and lakes and deciding which plants and animals can live in a region — and cutting down a forest can change the rainfall.</td><td>13.4.1 Air, water, and sunlight / 13.4.4 The importance of balance</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“revisits the solar system from prior learning”</li>\n<li>“echoing content from Chapter 12 on ecology”</li>\n<li>“the concluding chapter of the middle-stage science journey”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/viii/summaries/ch_13_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "social_sciences-viii-ch01": {"title": "Natural Resources and Their Use", "crumb": "chapter · Social Sciences · Class 8", "html": "<h1>Natural Resources and Their Use</h1>\n<p><strong>Social Sciences · Class 8 · Chapter 1</strong></p>\n<p><em>Explains when Nature becomes a resource, categorises resources by use and renewability, shows how uneven distribution shapes settlement and conflict, and argues for stewardship through cases of groundwater over-extraction, cement and organic farming.</em></p>\n<blockquote>The chapter distinguishes between Nature and natural resources. Nature comprises life and non-life forms in our environment not created by humans; elements of Nature become 'resources' when humans use them for sustenance or to create goods — a tree becomes a resource when its wood is made into furniture. For any entity to qualify as a resource, three conditions must be met: it must be technologically accessible, economically feasible to exploit, and culturally acceptable. Examples such as inaccessible deep-sea …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>◐ extends</td><td>Water is a renewable resource only while Nature's rhythm of restoration is not disturbed: farmers across India pump groundwater for irrigation faster than it recharges so water tables fall, Punjab's Green Revolution crops and free electricity have left almost 80 per cent of its area 'overexploited' with groundwater beyond about 30 metres, Himalayan glaciers melt faster than precipitation replaces them, and the remedies are water harvesting, pond rejuvenation and reduced consumption.</td><td>Section: Resources essential for life / Section: Renewable resources / Section: Restoration and regeneration of renewable resources / Section: Overexploitation of groundwater: a caselet from Punjab</td></tr>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>○ uses</td><td>Water resources that cross political boundaries generate inter-state and international tensions, as with the Kaveri River shared among Karnataka, Tamil Nadu, Kerala and Puducherry.</td><td>Section: Distribution of Natural Resources and its Implications</td></tr>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>○ uses</td><td>Water, with air and food, is a resource life cannot exist without and humans cannot manufacture, yet chemical contamination of over-pumped groundwater in Punjab and cement-industry pollution now pose health hazards, and access to water is inequitably distributed with the poor bearing the burden.</td><td>Section: Resources essential for life / Section: Overexploitation of groundwater: a caselet from Punjab / Section: The case of cement / Section: The International Solar Alliance (closing paragraph)</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/social_sciences/viii/summaries/ch_01_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "social_sciences-viii-ch08": {"title": "World Geography: Some Glimpses", "crumb": "chapter · Social Sciences · Class 8", "html": "<h1>World Geography: Some Glimpses</h1>\n<p><strong>Social Sciences · Class 8 · Chapter 8</strong></p>\n<p><em>A guided tour of the Earth's physical features — from map projections to the oceans, currents, trenches and reefs, then continent by continent through plateaus, deserts, steppes, mountains, plains and rivers — and the human activities and environmental pressures tied to each.</em></p>\n<blockquote>This chapter takes students on a guided tour of the Earth's major physical features, moving from the challenge of representing the planet on paper, to the oceans, and then continent by continent across the world's landforms. It opens by noting that the Earth has long been revered as a mother by indigenous communities and personified in India as Bhūdevī or Vasudhā, and that human lives are deeply connected to its features — the distant Southern Indian Ocean, for instance, influences the monsoon in the Gangetic …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[oceans-and-water-bodies</td><td>Oceans and water bodies]]</td><td>◐ extends</td><td>The ocean covers about 71 per cent of the Earth and holds 97 per cent of its water over a floor of mountains, valleys and trenches (the Mariana's Challenger Deep over 11,000 m down); the five oceans are revisited with their distinct features, ocean currents run like giant rivers carrying warm water poleward and cold water toward the equator, seas, gulfs, bays, straits and canals are classified by shape and trade role, and the Great Lakes are a chain of five massive freshwater lakes.</td><td>Section: The Blue of the Blue Planet, the Oceans / Section: The oceans / Section: Ocean currents / Section: Ocean trenches / Section: Smaller water bodies and waterways / Section: North America (The Great Lakes)</td></tr>\n<tr><td>[[water-and-heat</td><td>Water and heat]]</td><td>◐ extends</td><td>Oceans regulate climate by absorbing heat and releasing it slowly, and warm currents such as the Gulf Stream carry equatorial heat north through the Atlantic so that the United Kingdom is warmer than other places at the same latitude.</td><td>Section: The Blue of the Blue Planet, the Oceans / Section: Ocean currents</td></tr>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>◐ extends</td><td>Oceans support life from plankton to the blue whale and supply almost half the oxygen we breathe, trench organisms live in total darkness on chemical energy instead of photosynthesis, and coral reefs — 'rainforests of the sea' sheltering a quarter of all ocean species — are bleaching as human actions change ocean chemistry.</td><td>Section: The Blue of the Blue Planet, the Oceans (plankton activity) / Section: Ocean trenches / Section: The Great Barrier Reef</td></tr>\n<tr><td>[[water-cycle</td><td>The water cycle]]</td><td>○ uses</td><td>Oceans add moisture to the air that forms clouds and rainfall, which is how the distant Southern Indian Ocean influences the monsoon in the Gangetic Plains.</td><td>Section: Introduction / Section: The Blue of the Blue Planet, the Oceans</td></tr>\n<tr><td>[[rivers-and-landforms</td><td>Rivers and landforms]]</td><td>○ uses</td><td>Mountains act as 'water towers' — the Tibetan 'Third Pole' sources the Indus, Brahmaputra and Yangtze and its snow-melt is now expanding lakes, the Alps feed the Rhine and Danube, the Andes feed the Amazon (the largest river by volume) — while plains such as the European Plain are built by sediment deposition and the Colorado Plateau's Grand Canyon is cut by erosion.</td><td>Section: Asia (Roof of the world; The Urals) / Section: Europe (The European Plain; the Alps) / Section: South America / Section: North America (Colorado Plateau)</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>○ uses</td><td>Rivers, mountains and lakes are freshwater suppliers — the Nile's irrigation, drinking water and hydropower, the Alps' drinking water, irrigation and hydroelectricity, the Andes as a source for millions, the Great Lakes' city water now facing chemical contamination — while desert life clusters at Sahara oases and Gobi pastures fed by underground water.</td><td>Section: Africa (the Nile; the Sahara) / Section: Europe (the Alps) / Section: South America (the Andes) / Section: North America (The Great Lakes) / Section: Asia (Gobi Desert)</td></tr>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>○ uses</td><td>River valleys nurtured some of the world's earliest civilisations — the Nile was the cradle of ancient Egypt — and waterways carry trade: the Persian Gulf linked India and Europe for millennia, bays shelter ports and dockyards, and the Suez Canal (1869) made the shortest sea route from India to Europe.</td><td>Section: Europe (The European Plain) / Section: Africa (the Nile) / Section: Smaller water bodies and waterways</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“professionals use the more precise latitude and longitude coordinates introduced in Grade 6”</li>\n<li>“Building on Grade 6, this section revisits the five oceans”</li>\n<li>“recalling from Grade 6 the definitions of mountains, plateaus, and plains”</li>\n<li>“Because Part 1 of the textbook covered India's major landforms, the tour deliberately focuses on other parts of the world”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/social_sciences/viii/summaries/ch_08_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "social_sciences-viii-ch10": {"title": "A Journey Through Indian Architecture", "crumb": "chapter · Social Sciences · Class 8", "html": "<h1>A Journey Through Indian Architecture</h1>\n<p><strong>Social Sciences · Class 8 · Chapter 10</strong></p>\n<p><em>A guided journey through representative Indian structures — Harappan cities, stupas, rock-cut caves, water structures, temples, mosques, forts and palaces, tombs, traditional houses, churches and colonial buildings — and the thought behind them.</em></p>\n<blockquote>This chapter takes students on a guided journey through Indian architecture, defined as the art and techniques of design and construction combining functional and aesthetic aspects — a field that is both artistic and highly technical, and in which India has excelled for several millennia. It opens with a quotation from Ananda Coomaraswamy on the craftsman as part of the universe rather than an individual expressing personal whims, and explains that the evolution of forms, their diversity and technicalities cannot …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>◐ extends</td><td>Water structures are a distinct strand of Indian architecture: from Harappan drainage, Dholavira's reservoirs and interlocking trapezoid-brick wells, through Shringaverpur's Ganga-fed chain of reservoirs with silt-settling tanks, to the stepwells (vāvs, bāorīs such as Rani ki Vav) of Gujarat and Rajasthan that stored rainwater and gave a cool social space, temple tanks (puṣhkariṇīs) for harvesting and ritual, the Grand Anicut, and Agra Fort's Persian wheels lifting Yamuna water to fountains that cooled the palace.</td><td>Section: The Beginnings … / Section: Water Structures / Section: Forts and Palaces (Red Fort at Agra box)</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>○ uses</td><td>Because India's monsoon delivers water seasonally, people over millennia built structures to harvest, store and distribute it — from the village pond to the Grand Anicut — suited to each region's geology and climate, and many now suffer from depleted sources, poor maintenance, pollution and waste dumping that environmentalists, locals and NGOs work to reverse.</td><td>Section: Water Structures</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“a \"Let's Remember\" box pointing to Sanchi panels shown in earlier grades”</li>\n<li>“a \"Let's Remember\" box on where these caves appear in earlier textbooks”</li>\n<li>“Forts are recalled from earlier chapters”</li>\n<li>“a \"Let's Remember\" box asks students to recall the forts of Jaisalmer, Kumbhalgarh, Raigad and Sindhudurg and locate them on the map”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/social_sciences/viii/summaries/ch_10_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "social_sciences-viii-ch14": {"title": "India's Urban Landscape", "crumb": "chapter · Social Sciences · Class 8", "html": "<h1>India's Urban Landscape</h1>\n<p><strong>Social Sciences · Class 8 · Chapter 14</strong></p>\n<p><em>Examines what makes a place urban, how cities become economic and cultural hubs, the strains of rapid urbanisation — water, sanitation, slums, pollution — and how planning, from Jaipur to Singapore and Bengaluru's lake revival, can answer them.</em></p>\n<blockquote>The chapter opens with an epigraph from the American urbanist Jane Jacobs — that cities can provide something for everybody only when they are created by everybody — and four Big Questions: how cities become centres of diverse economic activities, in what ways urbanisation can impact people's lives, what challenges cities face in the twenty-first century, and how effective urban planning can improve life in cities. The introduction establishes that India has a long urban legacy running from Harappan cities such as …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>◐ extends</td><td>Cities have always depended on water — places near rivers grew into trade centres, Harappan Dholavira had complex water structures, and Jaipur was laid out in 1727 with reservoirs and canals for a steady supply in a dry climate — and today water supply and sewerage are core problems of urban planning, eased in Delhi by spreading growth across the National Capital Region and built into Singapore's master plans and Ahmedabad's Sabarmati Riverfront.</td><td>Section: Introduction / Section: How do Cities Become Centres of Economic Activities? / Section: What Leads to Urbanisation? (Delhi) / Section: Planning Our Cities / Section: India's 'Pink City' (Panna Meena Kund stepwell)</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>◐ extends</td><td>Bengaluru suffers summer water shortages and monsoon flooding because of poor planning, groundwater overuse, no rainwater harvesting and encroached lake beds — its roughly 1,000 lakes reduced to about 200 — and non-profits, resident associations and communities have revived lakes such as Yelahanka by desilting, repairing bunds, clearing drainage channels and replanting, increasing water availability.</td><td>Section: Challenges Faced by Cities / Section: Power of collective action in the revival of Bengaluru lakes</td></tr>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>○ uses</td><td>Unplanned urban growth and slums leave residents with poor access to water and sanitation, while sewage- and chemical-polluted lakes such as Bellandur and Varthur foam, release toxic gases and even catch fire.</td><td>Section: Challenges Faced by Cities / Section: Power of collective action in the revival of Bengaluru lakes</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“a let's-remember activity asks students to recall why Surat became a textile and diamond-cutting hub”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/social_sciences/viii/summaries/ch_14_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-ix-ch02": {"title": "Cell: The Building Block of Life", "crumb": "chapter · Science · Class 9", "html": "<h1>Cell: The Building Block of Life</h1>\n<p><strong>Science · Class 9 · Chapter 2</strong></p>\n<p><em>Cells are studied through the microscope, their membrane and wall, their organelles, cell division by mitosis and meiosis, and the Cell Theory.</em></p>\n<blockquote>Section 2.1 introduces the challenge of studying cells given their sub-millimetre size. The human eye can resolve two points only if they are at least 0.1 mm apart — the limit of resolution — which means most plant and animal cells, lying in the range of 10–100 µm, require optical assistance to study. Robert Hooke first observed cells in 1665 using a self-designed microscope with 200–300× magnification, identifying box-like compartments in cork. Light microscopes used in school laboratories combine an objective …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>◐ extends</td><td>Water moves into and out of cells by osmosis — diffusion across the selectively permeable membrane from a dilute to a concentrated solution — so a potato piece or cheek cell shrinks in 20% salt or sugar solution and a plant cell plasmolyses while its wall holds its outer shape, and the water-filled central vacuole's turgor keeps plant cells firm until water deficit makes the plant wilt.</td><td>2.2.1 Cell membrane (Activity 2.2, What if…) / 2.2.2 Cell wall (Activity 2.3) / 2.3.1 Vacuoles</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/ix/summaries/ch_02_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-ix-ch03": {"title": "Tissues in Action", "crumb": "chapter · Science · Class 9", "html": "<h1>Tissues in Action</h1>\n<p><strong>Science · Class 9 · Chapter 3</strong></p>\n<p><em>Plant meristematic and permanent tissues and the four animal tissue types are described, ending with joints and the musculoskeletal system.</em></p>\n<blockquote>The chapter opens by framing multicellular life as a hierarchy — cells of similar type performing similar functions cluster to form tissues, tissues combine into organs, and organs integrate into organ systems. A tissue is formally defined as a group of structurally similar cells working together to perform a specific function. The formation of specialised tissues enables division of labour, increasing the efficiency and complexity of life processes in both plants and animals.</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>◐ extends</td><td>Water enters through root hairs that enlarge the root's absorbing surface, rises through xylem's dead tracheids and vessels, and leaves through stomata as transpiration — a loss the waxy cuticle limits (thicker in dry habitats) but which also creates the transpiration pull that keeps water moving upward against gravity.</td><td>3.2.4 (i) Protective tissue — Epidermis / (iii) Conducting tissues — Complex permanent tissues / Pause and Ponder 2–4</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“connecting to the mitosis observed in onion root tips in Chapter 2”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/ix/summaries/ch_03_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-ix-ch05": {"title": "Exploring Mixtures and their Separation", "crumb": "chapter · Science · Class 9", "html": "<h1>Exploring Mixtures and their Separation</h1>\n<p><strong>Science · Class 9 · Chapter 5</strong></p>\n<p><em>Mixtures are classified as homogeneous or heterogeneous and separated by crystallization, distillation, chromatography, separating funnel, sublimation, centrifugation and coagulation, with solutions, suspensions and colloids told apart by the Tyndall effect.</em></p>\n<blockquote>Mixtures are classified on the basis of their uniformity into two broad categories: homogeneous and heterogeneous. A homogeneous mixture, also called a solution, has a uniform composition throughout — a well-stirred sugar–water mixture tastes equally sweet from first sip to last. Examples include vinegar (acetic acid in water) and aerated drinks (carbon dioxide in water). A heterogeneous mixture, by contrast, is non-uniform; sand particles are easily visible in water and settle over time. The chapter asks students …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-as-solvent</td><td>Water as a solvent]]</td><td>◐ extends</td><td>Water solutions are now quantified — concentration as % m/m, % m/v or % v/v (ORS and 0.9% saline must be exact) and solubility read from curves against temperature — and separated by crystallizing a cooled saturated solution (copper sulfate; salt from seawater brine), distilling off a lower-boiling liquid such as acetone or recovering the solvent, running ink up chromatography paper with water as the solvent, draining oil from water in a separating funnel, and clearing suspended particles by filtration, centrifugation or alum coagulation, while colloids such as milk scatter light.</td><td>5.2 Solutions (5.2.1–5.2.3, Activity 5.2) / 5.3 Methods of Separation of Homogeneous Mixtures (Activities 5.3, 5.4, 5.5) / 5.4 (Activities 5.6, 5.8; 5.4.3 Suspensions; 5.4.4 Colloids) / 5.5 Tyndall Effect</td></tr>\n<tr><td>[[states-of-water</td><td>States of water]]</td><td>○ uses</td><td>Distillation exploits water's 100 °C boiling point — a lower-boiling liquid like acetone (56 °C) is boiled off first and condensed in a water-cooled condenser — and clouds of water droplets or ice crystals in air are posed as a colloid puzzle, with snowflakes and frost cited as natural crystals.</td><td>5.3.2 Distillation / 5.3.1 Crystallization / 5.4.4 Colloids (Pause and Ponder)</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/ix/summaries/ch_05_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-ix-ch09": {"title": "Atomic Foundations of Matter", "crumb": "chapter · Science · Class 9", "html": "<h1>Atomic Foundations of Matter</h1>\n<p><strong>Science · Class 9 · Chapter 9</strong></p>\n<p><em>The laws of conservation of mass and constant proportions lead to Dalton's atomic theory, covalent and ionic bonding, formula writing and molecular and formula unit masses.</em></p>\n<blockquote>This section opens by asking whether mass changes during physical and chemical changes, using the example of water whose properties differ entirely from its constituent elements hydrogen and oxygen, yet whose mass equals the sum of their masses. Three numbered activities anchor the section's central claim. Activity 9.1 investigates a physical change: students dissolve common salt in water and find that the mass of the resulting solution equals the sum of the masses of water and salt taken, establishing that mass …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-as-solvent</td><td>Water as a solvent]]</td><td>◐ extends</td><td>Ionic compounds such as salt and copper sulfate dissolve in water (not in kerosene or petrol) and their solutions conduct electricity because the ions become free to move, sugar dissolves without conducting, and camphor and naphthalene do not dissolve at all — while water itself is treated as a compound (hydrogen and oxygen always 1:8 by mass whatever the source, two single covalent bonds in H₂O, molecular mass 18 u), a fact with no id of its own placed here as nearest.</td><td>9.6 Properties of the Ionic and the Covalent Compounds (Activity 9.4) / 9.1 (Activity 9.1) / 9.2 Law of Constant Proportions / 9.4.1 B Molecules of compounds / 9.7</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“The section recalls from Chapter 8 that atoms with eight electrons in the valence shell (or two electrons if the K-shell is outermost) are stable”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/ix/summaries/ch_09_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-ix-ch11": {"title": "Reproduction: How Life Continues", "crumb": "chapter · Science · Class 9", "html": "<h1>Reproduction: How Life Continues</h1>\n<p><strong>Science · Class 9 · Chapter 11</strong></p>\n<p><em>Asexual and sexual reproduction in plants, animals and humans, from vegetative propagation and meiosis to pollination, fertilisation, pregnancy and reproductive health.</em></p>\n<blockquote>11.1 Asexual Reproduction Asexual reproduction is found in many unicellular organisms such as bacteria, amoeba, and yeast, as well as in simple multicellular organisms like hydra and sponge, and in many plants. In plants, new individuals arise from vegetative parts without seeds — for example, potato and ginger sprout from fleshy underground stems, money plant and sugarcane grow from stem cuttings, and Bryophyllum leaves produce tiny plantlets. This mode is called vegetative propagation and involves only one …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<p><em>None recorded.</em> Water appears only incidentally — as the medium of external fertilisation in fish and frogs, one pollination agent among four, and a seed-dispersal and germination condition; the chapter teaches reproduction, not a water concept.</p>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/ix/summaries/ch_11_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-ix-ch12": {"title": "Patterns in Life: Diversity and Classification", "crumb": "chapter · Science · Class 9", "html": "<h1>Patterns in Life: Diversity and Classification</h1>\n<p><strong>Science · Class 9 · Chapter 12</strong></p>\n<p><em>Biodiversity is organised through the five-kingdom system, plant and animal groups, hierarchical ranks, binomial naming and fossil evidence.</em></p>\n<blockquote>12.1 India as a Biodiversity Hotspot India's natural landscape spans mountains, deserts, northeastern rainforests, southern plateaus and long coastlines, with each region carrying distinct soil types and climatic conditions. These diverse habitats support an exceptionally wide variety of species, including those found nowhere else on Earth — called endemic species. Examples of Indian endemic species include the Nilgiri tahr, the Lion-tailed macaque, the pitcher plant Nepenthes khasiana and Neelakurinji. Regions …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>○ uses</td><td>The plant kingdom is ordered by its dependence on water: thallophytes are aquatic, bryophytes and pteridophytes live on land but still need water for their swimming male gametes, and gymnosperms are the first to reproduce without water — while sponges feed on water flowing through their pores and fins and gills fit fish for aquatic life.</td><td>12.6.4 Kingdom Plantae (Thallophyta, Bryophyta, Pteridophyta, Gymnosperms) / 12.6.5 Porifera / 12.7 Adaptations as Outcomes of Structural Change</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“compare a cross section of a fern stem (showing its vascular bundles) with the cross section of a sunflower stem studied in Chapter 3”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/ix/summaries/ch_12_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-ix-ch13": {"title": "Earth as a System: Energy, Matter, and Life", "crumb": "chapter · Science · Class 9", "html": "<h1>Earth as a System: Energy, Matter, and Life</h1>\n<p><strong>Science · Class 9 · Chapter 13</strong></p>\n<p><em>Earth is one system of five spheres — geosphere, hydrosphere, cryosphere, atmosphere, biosphere — linked by uneven solar heating, winds and ocean currents, biogeochemical cycles and human impact.</em></p>\n<blockquote>This chapter integrates ideas about energy flow, atmospheric processes, biogeochemical cycles, and human impact that students explored separately in earlier grades, presenting them as parts of one interconnected Earth system made up of five interacting spheres: the geosphere (solid rocks, soil, and landforms), hydrosphere (surface water and groundwater), cryosphere (ice and snow), atmosphere (the surrounding air), and biosphere (all living organisms and their habitats). A disturbance in any one sphere propagates …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-cycle</td><td>The water cycle]]</td><td>◐ extends</td><td>The water cycle now includes surface runoff back to the ocean and infiltration into soil and rock, where water dissolves and carries minerals, and it links all five spheres — so a warmer atmosphere holding more moisture brings heavier rains in some places and droughts in others, while intense rainfall erodes soil and cuts groundwater recharge.</td><td>13.3.1 Water cycle / Activity 13.1</td></tr>\n<tr><td>[[oceans-and-water-bodies</td><td>Oceans and water bodies]]</td><td>◐ extends</td><td>Surface water and groundwater form the hydrosphere and ice and snow the cryosphere; ocean currents driven by planetary winds, temperature and salinity differences, Earth's rotation and the continents form gyres that carry heat poleward (the North Atlantic Drift keeps European ports ice-free) and nutrients to marine life, and the ocean holds 71% of global carbon, acidifying as it warms.</td><td>Introduction (five spheres) / 13.2.3 Ocean currents / 13.3.2 Carbon cycle / 13.4</td></tr>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>◐ extends</td><td>Nearly all weather happens in the troposphere, and the monsoon is now treated as climate-sensitive: warmer Arabian Sea water intensifies the southwest monsoon, deforestation lowers local rainfall, and IITM Pune's coupled atmosphere–ocean–land–ice models forecast how warming may alter monsoon rainfall.</td><td>Introduction / 13.1.3 Role of the atmosphere / 13.4 Human Impact on Earth's Processes / IITM feature</td></tr>\n<tr><td>[[water-and-heat</td><td>Water and heat]]</td><td>◐ extends</td><td>Water shapes Earth's heat budget: water vapour is a greenhouse gas, dark ocean water (low albedo) absorbs heat while snow and ice reflect it, and ocean currents move heat from the equator toward the poles, regulating climate.</td><td>13.1 Uneven Heating of the Earth / 13.1.1 (Activity 13.2) / 13.2.3 Ocean currents</td></tr>\n<tr><td>[[rivers-and-landforms</td><td>Rivers and landforms]]</td><td>○ uses</td><td>Melting glaciers add water to rivers and raise sea levels that threaten coastal cities such as Mumbai and Chennai, and intense rainfall runoff erodes soil.</td><td>13.3.1 Water cycle / 13.3.2 Carbon cycle</td></tr>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>○ uses</td><td>Excess nitrate fertiliser washed into rivers and lakes triggers algal blooms that deplete oxygen and kill fish (eutrophication), and warmer, more acidic seawater threatens plankton and coral reefs.</td><td>13.4 Human Impact on Earth's Processes</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“integrates ideas about energy flow, atmospheric processes, biogeochemical cycles, and human impact that students explored separately in earlier grades”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/ix/summaries/ch_13_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "social_sciences-ix-ch02": {"title": "Shaping of the Earth's Surface", "crumb": "chapter · Social Sciences · Class 9", "html": "<h1>Shaping of the Earth's Surface</h1>\n<p><strong>Social Sciences · Class 9 · Chapter 2</strong></p>\n<p><em>Explains how internal forces (plate tectonics) build the Earth's surface and how external agents — running water, glaciers, waves, wind and groundwater — weather, erode and deposit to level it, ending with landform-linked disasters.</em></p>\n<blockquote>The chapter opens by establishing that the Earth's surface is not fixed but is constantly transformed by powerful forces acting both from within the planet and on its surface, with the theory of plate tectonics offered as the central idea that explains these changes. It defines a landform as a natural feature on the Earth's surface produced by processes such as weathering, erosion, deposition, and the movement of the crust, giving mountains, valleys, plateaus, plains, deserts, and coastal features as examples. …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[rivers-and-landforms</td><td>Rivers and landforms]]</td><td>◐ extends</td><td>A river shapes land differently along its course — V-shaped valleys, waterfalls and rapids where hard rock resists in the upper course, meanders and oxbow lakes from outer-bank erosion and inner-bank deposition in the middle, deltas, levees and alluvial fans where it meets the sea — while glaciers carve U-shaped valleys, cirques and fjords, leave moraines that dam lakes, and can unleash Glacial Lake Outburst Floods when their ice or moraine dams fail.</td><td>Section: Running Water / Section: Waterfall / Section: Meander / Section: Deltas / Section: Glaciers (Chamoli 2021 activity) / Section: GLOFs</td></tr>\n<tr><td>[[oceans-and-water-bodies</td><td>Oceans and water bodies]]</td><td>○ uses</td><td>Sea waves and currents are agents of gradation that undercut headlands into cliffs, wave-cut platforms, caves, arches and stacks and deposit beaches and sand bars that shield settlements from coastal erosion.</td><td>Section: Waves and Currents</td></tr>\n<tr><td>[[water-as-solvent</td><td>Water as a solvent]]</td><td>○ uses</td><td>Chemical weathering changes minerals by reaction with water and acids, and groundwater dissolving limestone creates karst — caves, stalactites, stalagmites, sinkholes and underground rivers.</td><td>Section: Weathering / Section: Agents of Gradation / Section: Underground Water</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>○ uses</td><td>Rivers, glaciers and groundwater are used as well as feared: the Grand Anicut (Kallanai) in Tamil Nadu shows rivers harnessed for irrigation, moraine-dammed lakes give water supply, irrigation and hydropower, karst provides fresh water, the Sindhu-Sarasvatī people used contouring, bunding, terracing, dams and canals, and Nagaland's Zabo system of earthen bunds and check dams conserves soil and water and recharges groundwater.</td><td>Section: Erosion (Don't Miss Out) / Section: Meander / Section: Glaciers / Section: Underground Water</td></tr>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>○ uses</td><td>The river plains of the Ganga, Nile, Brahmaputra and Indus gave rise to agricultural societies and early cities, coasts and harbours supported trade and cultural contact, ancient water management is documented in the Vedas, Kṛiṣhiparāśhara and Kauṭilya's Arthaśhāstra, and waterfalls and karst caves carry cultural or religious significance.</td><td>Section: Agents of Gradation (Don't Miss Out) / Section: Erosion (Don't Miss Out) / Section: Waterfall / Section: Underground Water</td></tr>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>○ uses</td><td>Heavy continuous rainfall adds weight and reduces friction on slopes to trigger landslides and fills glacial lakes before outbursts, while prolonged drought and low rainfall leave loose dry soil for dust storms.</td><td>Section: Landslides / Section: GLOFs / Section: Dust Storms</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/social_sciences/ix/summaries/ch_02_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "social_sciences-ix-ch03": {"title": "Atmosphere and Climate", "crumb": "chapter · Social Sciences · Class 9", "html": "<h1>Atmosphere and Climate</h1>\n<p><strong>Social Sciences · Class 9 · Chapter 3</strong></p>\n<p><em>Describes the atmosphere's composition and layers, separates weather from climate and sets out their elements, explains India's seasons and the monsoon's reversal, and closes with climate change and a case study of the 2025 Punjab floods.</em></p>\n<blockquote>The chapter opens by introducing the atmosphere as the blanket of air held around the Earth by gravity, a mixture of gases in varying proportions that is vital for the survival of all living beings. It explains that the atmosphere shields the planet from harmful solar radiation, including ultraviolet radiation, regulates temperature by trapping some of the Sun's energy and preventing it from escaping to space, and is a key component of the Earth's weather and climate systems, influencing temperature, humidity, and …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>◐ extends</td><td>Precipitation falls when saturated air condenses, shaped by prevailing winds, mountains and seasons; India's tropical monsoon climate has four IMD seasons, and the monsoon is a wind reversal — the south-west monsoon (June–September), drawn in by a low over the fast-heating landmass, brings most of India's rain, while the north-east monsoon (October–February) blows seaward and rains mainly on the south-east coast after crossing the Bay of Bengal — mapped by normal dates of advance and retreat, vital to farming, water supply and festivals, and studied by the National Monsoon Mission.</td><td>Section: Elements of Weather and Climate / Section: Seasons in India (Table 3.2) / Section: Monsoon (Fig. 3.10, Fig. 3.11)</td></tr>\n<tr><td>[[water-and-heat</td><td>Water and heat]]</td><td>◐ extends</td><td>Land heats and cools faster than the sea, so by day a sea breeze blows from sea to land and at night a land breeze from land to sea, moderating coastal climates, and the same contrast on a seasonal scale drives the monsoon's reversal.</td><td>Section: Elements of Weather and Climate (Fig. 3.8 local winds) / Section: Monsoon</td></tr>\n<tr><td>[[states-of-water</td><td>States of water]]</td><td>○ uses</td><td>Water vapour makes up only about 0.1 to 0.4 per cent of the atmosphere yet drives cloud formation, warmer air holds more of it, and precipitation is that vapour condensing out of saturated air as drizzle, rain, snow, sleet or hail.</td><td>Section: Composition of the Atmosphere (Fig. 3.2) / Section: Elements of Weather and Climate</td></tr>\n<tr><td>[[water-cycle</td><td>The water cycle]]</td><td>○ uses</td><td>Most water vapour and clouds sit in the troposphere, and the monsoon winds carry moisture gathered over the Indian Ocean, Arabian Sea and Bay of Bengal onto the land as rain.</td><td>Section: Structure of the Atmosphere / Section: Monsoon</td></tr>\n<tr><td>[[rivers-and-landforms</td><td>Rivers and landforms]]</td><td>○ uses</td><td>The 2025 Punjab floods came from heavy monsoon rain swelling the Satluj, Beas, Ravi and Ghaggar in succession, made worse by weak old embankments (dhūsī bāndh), building too close to rivers, silt reducing river and dam capacity and late warnings — and climate change is making floods, droughts, glacier melt and sea-level rise more frequent.</td><td>Section: Punjab Floods 2025: A Case Study / Section: Climate Change</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“Students recall from their Grade 8 Science textbook how nitrogen is useful for plants”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/social_sciences/ix/summaries/ch_03_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "spiral-water": {"title": "The spiral", "crumb": "view", "html": "<h1>The spiral — each idea, class by class</h1>\n<p><em>Read down any block: that is the idea growing from Class 3 to Class 9. The role mark says whether the class meets the idea for the first time (●), takes it further (◐), or leans on it (○).</em></p>\n<p>Part of the <a href=\"#Water\" class=\"wl\">Water</a> thread.</p>\n<h2><a href=\"#states-of-water\" class=\"wl\">States of water</a></h2>\n<p><strong>Class 5</strong></p>\n<ul>\n<li>◐ <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a> — Water exists as liquid (rain), solid (ice) and vapour (steam); students watch droplets condense on a cold steel glass of ice, ice melt, water boil and water left in sunlight for three days disappear, recording that water changes form and can return to liquid.</li>\n</ul>\n<p><strong>Class 6</strong></p>\n<ul>\n<li>● <a href=\"#science-vi-ch08\" class=\"wl\">Science · Ch 8 A Journey through States of Water</a> — Water exists as ice, liquid water and water vapour; evaporation (which goes on even at room temperature) and condensation, melting and freezing move it between these states, and evaporation is faster with more exposed surface, higher temperature, moving air and drier air.</li>\n<li>○ <a href=\"#science-vi-ch07\" class=\"wl\">Science · Ch 7 Temperature and its Measurement</a> — Boiling water and melting ice each hold a constant temperature, and students' readings of boiling water in Shillong come out slightly below 100 °C, raising the idea that the boiling point of water depends on altitude.</li>\n<li>○ <a href=\"#science-vi-ch09\" class=\"wl\">Science · Ch 9 Methods of Separation in Everyday Life</a> — Evaporation — a liquid turning into its vapour — is put to work to separate a dissolved solid from water, whether by sunlight and air over seawater in shallow pits or by boiling a salt solution away over a spirit lamp.</li>\n</ul>\n<p><strong>Class 7</strong></p>\n<ul>\n<li>○ <a href=\"#science-vii-ch05\" class=\"wl\">Science · Ch 5 Changes Around Us: Physical and Chemical</a> — Ice melting, water boiling or evaporating and wet clothes drying are physical changes — the water stays water in all three states — and they are reversible, since melted ice can be refrozen and evaporated water condensed, unlike burning wood or making popcorn.</li>\n</ul>\n<p><strong>Class 8</strong></p>\n<ul>\n<li>◐ <a href=\"#science-viii-ch07\" class=\"wl\">Science · Ch 7 Particulate Nature of Matter</a> — Ice, water and vapour are explained by particles: in ice they only vibrate in fixed positions, at the melting point (0 °C) they break free to move within a limited space, at the boiling point they escape as vapour with bubbles forming throughout the bulk, whereas evaporation happens only at the surface at any temperature — and water, unlike air, is practically incompressible.</li>\n<li>◐ <a href=\"#science-viii-ch09\" class=\"wl\">Science · Ch 9 The Amazing World of Solutes, Solvents, and Solutions</a> — Water is densest at 4 °C and expands as it freezes into ice at 0 °C, so ice is less dense than liquid water and floats — the anomalous behaviour of water.</li>\n<li>○ <a href=\"#science-viii-ch13\" class=\"wl\">Science · Ch 13 Our Home: Earth, a Unique Life Sustaining Planet</a> — Earth sits in the habitable (Goldilocks) zone where temperatures keep water liquid — closer to the Sun it would evaporate, farther away it would freeze — and the atmosphere's mild greenhouse effect is what holds that liquid range.</li>\n</ul>\n<p><strong>Class 9</strong></p>\n<ul>\n<li>○ <a href=\"#science-ix-ch05\" class=\"wl\">Science · Ch 5 Exploring Mixtures and their Separation</a> — Distillation exploits water's 100 °C boiling point — a lower-boiling liquid like acetone (56 °C) is boiled off first and condensed in a water-cooled condenser — and clouds of water droplets or ice crystals in air are posed as a colloid puzzle, with snowflakes and frost cited as natural crystals.</li>\n<li>○ <a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a> — Water vapour makes up only about 0.1 to 0.4 per cent of the atmosphere yet drives cloud formation, warmer air holds more of it, and precipitation is that vapour condensing out of saturated air as drizzle, rain, snow, sleet or hail.</li>\n</ul>\n<p><em>Not touched in: Class 3, Class 4.</em></p>\n<h2><a href=\"#water-cycle\" class=\"wl\">The water cycle</a></h2>\n<p><strong>Class 3</strong></p>\n<ul>\n<li>● <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a> — After rain falls it soaks into the soil, runs into streams and rivers, collects in puddles, ponds and lakes, or is stored underground as groundwater that feeds wells — the cycle grounded at a concrete, observable level without the formal 'water cycle' term.</li>\n</ul>\n<p><strong>Class 5</strong></p>\n<ul>\n<li>● <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a> — The Sun's heat evaporates water from oceans and rivers, the vapour cools into clouds, and rain, snow and hail fall back into rivers, lakes and oceans in a continuous cycle, modelled with coloured water sealed in a transparent bag left in sunlight.</li>\n</ul>\n<p><strong>Class 6</strong></p>\n<ul>\n<li>● <a href=\"#science-vi-ch08\" class=\"wl\">Science · Ch 8 A Journey through States of Water</a> — Water vapour rising from oceans, lakes and rivers cools and condenses around dust particles to form clouds, the droplets merge into drops heavy enough to fall as rain (or hail or snow), and the water collects again in oceans, lakes, rivers and groundwater — the water cycle.</li>\n<li>○ <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a> — Oceans drive the water cycle by generating the rainfall that keeps continents from being deserts, which is why clouds forming over the ocean are the source of India's summer monsoon.</li>\n</ul>\n<p><strong>Class 7</strong></p>\n<ul>\n<li>◐ <a href=\"#science-vii-ch07\" class=\"wl\">Science · Ch 7 Heat Transfer in Nature</a> — Solar radiation drives evaporation from oceans, rivers and lakes and transpiration from plants, the rising vapour cools and condenses into clouds, and precipitation as rain, snow or hail returns water through soil, rocks and plants to the water bodies — with water present in nature as liquid, as snow, ice sheets and glaciers, and as vapour.</li>\n<li>○ <a href=\"#social_sciences-vii-ch02\" class=\"wl\">Social Sciences · Ch 2 Understanding the Weather</a> — The IMD's motto 'From the sun arises rain', taken from the Manusmṛiti's 'from the sun arises rain, from rain comes food, and from food, living beings originate', is presented as the ancient understanding of the sun's role in the water cycle.</li>\n<li>○ <a href=\"#social_sciences-vii-ch03\" class=\"wl\">Social Sciences · Ch 3 Climates of India</a> — Cooler, moisture-laden winds drawn in from the ocean condense their moisture over the heated land and drop it as heavy monsoon rain, and winds crossing the Bay of Bengal collect moisture again for east and south India — the ocean-to-rain leg of the water cycle.</li>\n</ul>\n<p><strong>Class 8</strong></p>\n<ul>\n<li>○ <a href=\"#science-viii-ch13\" class=\"wl\">Science · Ch 13 Our Home: Earth, a Unique Life Sustaining Planet</a> — Water vapour forms clouds that bring rain and snow, refilling rivers and lakes and deciding which plants and animals can live in a region — and cutting down a forest can change the rainfall.</li>\n<li>○ <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> — Oceans add moisture to the air that forms clouds and rainfall, which is how the distant Southern Indian Ocean influences the monsoon in the Gangetic Plains.</li>\n</ul>\n<p><strong>Class 9</strong></p>\n<ul>\n<li>◐ <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> — The water cycle now includes surface runoff back to the ocean and infiltration into soil and rock, where water dissolves and carries minerals, and it links all five spheres — so a warmer atmosphere holding more moisture brings heavier rains in some places and droughts in others, while intense rainfall erodes soil and cuts groundwater recharge.</li>\n<li>○ <a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a> — Most water vapour and clouds sit in the troposphere, and the monsoon winds carry moisture gathered over the Indian Ocean, Arabian Sea and Bay of Bengal onto the land as rain.</li>\n</ul>\n<p><em>Not touched in: Class 4.</em></p>\n<h2><a href=\"#rain-and-monsoon\" class=\"wl\">Rain and the monsoon</a></h2>\n<p><strong>Class 3</strong></p>\n<ul>\n<li>● <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a> — Rain is met by direct observation: children read sky and nature clues to predict whether it will rain, then watch a shower and describe its heaviness, drop size, speed and slant, and collect rainwater to see whether it looks clean or dirty.</li>\n</ul>\n<p><strong>Class 4</strong></p>\n<ul>\n<li>○ <a href=\"#the_world_around_us-iv-ch09\" class=\"wl\">The World Around Us · Ch 9 Different Lands, Different Lives</a> — Rainfall differs across landforms and shapes how people live: deserts get very little rain, Sikkim's heavy rain calls for wooden houses with slanting roofs, the rainy season brings landslides in the mountains, and coastal Odisha faces cyclones.</li>\n</ul>\n<p><strong>Class 5</strong></p>\n<ul>\n<li>○ <a href=\"#the_world_around_us-v-ch02\" class=\"wl\">The World Around Us · Ch 2 Journey of a River</a> — Rainfall governs a river's year: seasonal rivers flow only in the rainy season, excessive rain makes rivers overflow their banks, and dams hold water back for the dry season.</li>\n</ul>\n<p><strong>Class 6</strong></p>\n<ul>\n<li>● <a href=\"#science-vi-ch07\" class=\"wl\">Science · Ch 7 Temperature and its Measurement</a> — Air temperature is a weather measurement: weather services record each day's maximum and minimum air temperature, which rises towards summer and falls in winter and is used in forecasting (this node is weather measurement only, with no water content — recorded because the vocabulary lists weather measurement here).</li>\n<li>● <a href=\"#science-vi-ch08\" class=\"wl\">Science · Ch 8 A Journey through States of Water</a> — Humidity is the measure of water vapour in the air; on rainy, humid days evaporation is slower and clothes dry slowly, and rain is what falls when cloud droplets grow heavy.</li>\n<li>○ <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a> — India's summer monsoon rains originate over the ocean, and the same oceans generate cyclones — violent storms with extreme rainfall and strong winds that damage coastal regions.</li>\n<li>○ <a href=\"#social_sciences-vi-ch03\" class=\"wl\">Social Sciences · Ch 3 Landforms and Life</a> — Precipitation is defined as water reaching the ground as rain, snow or hail, deserts are the landform that receives very little of it, and cloudbursts, flash floods and heavy snowfall are among the hazards of mountain life.</li>\n<li>○ <a href=\"#social_sciences-vi-ch06\" class=\"wl\">Social Sciences · Ch 6 The Beginnings of Indian Civilisation</a> — A global climatic change from about 2200 BCE reduced rainfall and made farming harder, which together with the drying of the Sarasvatī in its central basin led to the abandonment of cities such as Kalibangan and Banawali.</li>\n</ul>\n<p><strong>Class 7</strong></p>\n<ul>\n<li>● <a href=\"#social_sciences-vii-ch02\" class=\"wl\">Social Sciences · Ch 2 Understanding the Weather</a> — Precipitation (rain, snow, sleet or hail) is measured with a rain gauge whose scale reads rainfall in millimetres, humidity — the water vapour in the air — is measured by a hygrometer as relative humidity from dry (20–40%) to humid (60–80%), and these readings, alongside traditional signs such as ants moving eggs or frogs croaking, feed forecasts of rain, of the monsoon's arrival and IMD colour-coded heavy-rain warnings.</li>\n<li>◐ <a href=\"#social_sciences-vii-ch03\" class=\"wl\">Social Sciences · Ch 3 Climates of India</a> — The monsoon is a seasonal wind reversal — in summer the heated Asian landmass forms a low that draws moisture-laden ocean winds inland to drop heavy rain (the south-west monsoon advancing from early June to cover India by mid-July, the Western Ghats leaving the Deccan in a rain shadow, Mawsynram receiving about 11,000 mm a year), while in winter dry winds blow from land to sea except where the north-east monsoon gathers Bay of Bengal moisture for the east and south — and a failed monsoon means scarcity, higher food prices and migration.</li>\n<li>○ <a href=\"#social_sciences-vii-ch01\" class=\"wl\">Social Sciences · Ch 1 Geographical Diversity of India</a> — Rainfall varies from extremely scarce in the cold desert of Ladakh to among the highest in the world in the Garo, Khasi and Jaintia Hills of Meghalaya.</li>\n</ul>\n<p><strong>Class 8</strong></p>\n<ul>\n<li>◐ <a href=\"#science-viii-ch06\" class=\"wl\">Science · Ch 6 Pressure, Winds, Storms, and Cyclones</a> — Storms form when warm moist air rises, expands and cools so its water vapour condenses into clouds and the droplets merge to fall as rain, hail or snow; ice particles and droplets rubbing inside the cloud build the charges that discharge as lightning in a thunderstorm (Kalboishakhi, Bordoisila and mango showers are pre-monsoon examples), and cyclones bring intense winds and heavy rainfall around a calm eye.</li>\n</ul>\n<p><strong>Class 9</strong></p>\n<ul>\n<li>◐ <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> — Nearly all weather happens in the troposphere, and the monsoon is now treated as climate-sensitive: warmer Arabian Sea water intensifies the southwest monsoon, deforestation lowers local rainfall, and IITM Pune's coupled atmosphere–ocean–land–ice models forecast how warming may alter monsoon rainfall.</li>\n<li>◐ <a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a> — Precipitation falls when saturated air condenses, shaped by prevailing winds, mountains and seasons; India's tropical monsoon climate has four IMD seasons, and the monsoon is a wind reversal — the south-west monsoon (June–September), drawn in by a low over the fast-heating landmass, brings most of India's rain, while the north-east monsoon (October–February) blows seaward and rains mainly on the south-east coast after crossing the Bay of Bengal — mapped by normal dates of advance and retreat, vital to farming, water supply and festivals, and studied by the National Monsoon Mission.</li>\n<li>○ <a href=\"#social_sciences-ix-ch02\" class=\"wl\">Social Sciences · Ch 2 Shaping of the Earth's Surface</a> — Heavy continuous rainfall adds weight and reduces friction on slopes to trigger landslides and fills glacial lakes before outbursts, while prolonged drought and low rainfall leave loose dry soil for dust storms.</li>\n</ul>\n<h2><a href=\"#rivers-and-landforms\" class=\"wl\">Rivers and landforms</a></h2>\n<p><strong>Class 5</strong></p>\n<ul>\n<li>● <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a> — Rivers begin in mountains and flow downhill with their path and speed shaped by the land they cross (and flowing water reshapes land over time), modelled with mustard seeds on crumpled paper and traced on a map of India's rivers, including the Luni that ends in the Rann of Kutch without reaching a sea.</li>\n<li>◐ <a href=\"#the_world_around_us-v-ch02\" class=\"wl\">The World Around Us · Ch 2 Journey of a River</a> — One river is followed source to sea: the Godavari rises as a stream at Trimbakeshwar in the Western Ghats, gathers tributaries over 1,465 km, flows year-round (perennial, unlike seasonal rivers), spreads into a delta where freshwater meets the sea at the Coringa mangroves, and overflows its banks in floods when rain is excessive — worse where forests have been cut.</li>\n</ul>\n<p><strong>Class 6</strong></p>\n<ul>\n<li>● <a href=\"#social_sciences-vi-ch03\" class=\"wl\">Social Sciences · Ch 3 Landforms and Life</a> — Snow melting on mountains feeds rivers such as the 2,500 km Ganga with its Himalayan tributaries, rivers plunge off plateau edges as waterfalls (Jog, Hundru, Nohkalikai, Victoria), and rivers rising in mountains carry rock, sand and silt down to deposit them as the fertile soils
