, brass and other traditional vessels, kept pots of water outside their homes for passers-by in the hot months, and celebrate rain and rivers in songs and poems.</td></tr>\n<tr><td>3</td><td>[[english-iii-ch13</td><td>English · Ch 13 Madhu's Wish]]</td><td>○ uses</td><td>In Sudha Murty's story a magical tree grants Madhu every kind of food but no water, and the tale's whole moral is that water is worth more than any feast.</td></tr>\n<tr><td>5</td><td>[[the_world_around_us-v-ch02</td><td>The World Around Us · Ch 2 Journey of a River]]</td><td>◐ extends</td><td>Since ancient times settlements have grown beside rivers for reliable water; the Godavari is sacred (Dakshina Ganga, the Pushkaram festival at Nashik), families carry river stories and festivals, and students role-play as Sarpanch or plan a riverside city that stays clean, flood-safe and supplied through summer.</td></tr>\n<tr><td>5</td><td>[[english-v-ch06</td><td>English · Ch 6 What a Tank!]]</td><td>○ uses</td><td>Rural Punjab's rooftop water tanks are sculpted from cement and steel into flowers, footballs, roosters, tractors and aeroplanes that announce the owner's occupation or passion, and children design a community poster to preserve and clean old water tanks.</td></tr>\n<tr><td>5</td><td>[[english-v-ch08</td><td>English · Ch 8 The Decision of the Panchayat]]</td><td>○ uses</td><td>A village Panchayat under the banyan tree settles a dispute in which a neighbour who sold a well claims he did not sell the water in it, ruling that water kept in another's well belongs to the well's owner, and children judge whether the decision was fair.</td></tr>\n<tr><td>5</td><td>[[the_world_around_us-v-ch01</td><td>The World Around Us · Ch 1 Water — The Essence of Life]]</td><td>○ uses</td><td>Communities have built traditional rainwater-harvesting structures such as the johads of Rajasthan (small dams that collect rain and recharge groundwater), and Hiware Bazar in Maharashtra became water-positive through community-led watershed management.</td></tr>\n<tr><td>6</td><td>[[social_sciences-vi-ch06</td><td>Social Sciences · Ch 6 The Beginnings of Indian Civilisation]]</td><td>● introduces</td><td>India's first civilisation grew on the plains watered by the Indus and the Sarasvatī, and its planned cities counted water and drainage management as a mark of urbanism — the waterproofed Great Bath of Mohenjo-daro, hundreds of brick-lined wells, and Dholavira's six stone or rock-cut reservoirs (the largest 73 m long) linked by underground drains.</td></tr>\n<tr><td>6</td><td>[[science-vi-ch11</td><td>Science · Ch 11 Nature's Treasures]]</td><td>○ uses</td><td>Rainwater harvesting is an age-old Indian practice, seen in traditional stepwells — the Bawadi of Rajasthan and the Vav of Gujarat — that store rainwater and water seeping from nearby ponds and lakes.</td></tr>\n<tr><td>6</td><td>[[social_sciences-vi-ch02</td><td>Social Sciences · Ch 2 Oceans and Continents]]</td><td>○ uses</td><td>From earliest times people have used seas and oceans to migrate, trade, wage military campaigns and fish, coastal cultures built tales and legends around the sea, and ocean-born tsunamis such as the 2004 Indian Ocean tsunami are now met with early warning systems and the National Disaster Management Authority.</td></tr>\n<tr><td>6</td><td>[[social_sciences-vi-ch03</td><td>Social Sciences · Ch 3 Landforms and Life]]</td><td>○ uses</td><td>The first civilisations grew up around rivers in fertile plains, river sources and confluences are held sacred with festivals and rituals in India, rivers carry navigation and trade, and the Sangam tiṇai Neydal ties coastal life to fishing and seafaring.</td></tr>\n<tr><td>7</td><td>[[english-vii-ch01</td><td>English · Ch 1 The Day the River Spoke (Learning Together)]]</td><td>○ uses</td><td>The River is a living character who listens to a village girl and counsels her to go to school, and children go on to discuss why India's rivers are held sacred and mostly addressed as female (the Brahmaputra and Sone being male) and to name the country's boats — canoe, catamaran, coracle, shikara — and other water-transport words (boats placed here as the nearest fit in the vocabulary).</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch10</td><td>Social Sciences · Ch 10 A Journey Through Indian Architecture]]</td><td>◐ extends</td><td>Water structures are a distinct strand of Indian architecture: from Harappan drainage, Dholavira's reservoirs and interlocking trapezoid-brick wells, through Shringaverpur's Ganga-fed chain of reservoirs with silt-settling tanks, to the stepwells (vāvs, bāorīs such as Rani ki Vav) of Gujarat and Rajasthan that stored rainwater and gave a cool social space, temple tanks (puṣhkariṇīs) for harvesting and ritual, the Grand Anicut, and Agra Fort's Persian wheels lifting Yamuna water to fountains that cooled the palace.</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch14</td><td>Social Sciences · Ch 14 India's Urban Landscape]]</td><td>◐ extends</td><td>Cities have always depended on water — places near rivers grew into trade centres, Harappan Dholavira had complex water structures, and Jaipur was laid out in 1727 with reservoirs and canals for a steady supply in a dry climate — and today water supply and sewerage are core problems of urban planning, eased in Delhi by spreading growth across the National Capital Region and built into Singapore's master plans and Ahmedabad's Sabarmati Riverfront.</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch01</td><td>Social Sciences · Ch 1 Natural Resources and Their Use]]</td><td>○ uses</td><td>Water resources that cross political boundaries generate inter-state and international tensions, as with the Kaveri River shared among Karnataka, Tamil Nadu, Kerala and Puducherry.</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch08</td><td>Social Sciences · Ch 8 World Geography: Some Glimpses]]</td><td>○ uses</td><td>River valleys nurtured some of the world's earliest civilisations — the Nile was the cradle of ancient Egypt — and waterways carry trade: the Persian Gulf linked India and Europe for millennia, bays shelter ports and dockyards, and the Suez Canal (1869) made the shortest sea route from India to Europe.</td></tr>\n<tr><td>9</td><td>[[social_sciences-ix-ch02</td><td>Social Sciences · Ch 2 Shaping of the Earth's Surface]]</td><td>○ uses</td><td>The river plains of the Ganga, Nile, Brahmaputra and Indus gave rise to agricultural societies and early cities, coasts and harbours supported trade and cultural contact, ancient water management is documented in the Vedas, Kṛiṣhiparāśhara and Kauṭilya's Arthaśhāstra, and waterfalls and karst caves carry cultural or religious significance.</td></tr>\n</tbody></table>\n<p><strong>Introduces</strong> (2): Class 3 TWAU ch 7; Class 6 SS ch 6</p>\n<p><strong>Extends</strong> (3): Class 5 TWAU ch 2; Class 8 SS ch 10; Class 8 SS ch 14</p>\n<p><strong>Uses</strong> (11): Class 3 Eng ch 13; Class 5 Eng ch 6; Class 5 Eng ch 8; Class 5 TWAU ch 1; Class 6 Sci ch 11; Class 6 SS ch 2; Class 6 SS ch 3; Class 7 Eng ch 1; Class 8 SS ch 1; Class 8 SS ch 8; Class 9 SS ch 2</p>\n<h2>Joint-class candidates</h2>\n<p>Same class, different subjects, this one idea:</p>\n<ul>\n<li><strong>Class 3</strong> — <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a> + <a href=\"#english-iii-ch13\" class=\"wl\">English · Ch 13 Madhu's Wish</a></li>\n<li><strong>Class 5</strong> — <a href=\"#the_world_around_us-v-ch02\" class=\"wl\">The World Around Us · Ch 2 Journey of a River</a> + <a href=\"#english-v-ch06\" class=\"wl\">English · Ch 6 What a Tank!</a> + <a href=\"#english-v-ch08\" class=\"wl\">English · Ch 8 The Decision of the Panchayat</a> + <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a></li>\n<li><strong>Class 6</strong> — <a href=\"#social_sciences-vi-ch06\" class=\"wl\">Social Sciences · Ch 6 The Beginnings of Indian Civilisation</a> + <a href=\"#science-vi-ch11\" class=\"wl\">Science · Ch 11 Nature's Treasures</a> + <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a> + <a href=\"#social_sciences-vi-ch03\" class=\"wl\">Social Sciences · Ch 3 Landforms and Life</a></li>\n</ul>\n<h2>Related ideas</h2>\n<p>Ideas that most often appear in the same chapters: <a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a> (13), <a href=\"#water-and-life\" class=\"wl\">Water and life</a> (9), <a href=\"#rain-and-monsoon\" class=\"wl\">Rain and the monsoon</a> (6), <a href=\"#oceans-and-water-bodies\" class=\"wl\">Oceans and water bodies</a> (6).</p>"}, "english-iii-ch13": {"title": "Madhu's Wish", "crumb": "chapter · English · Class 3", "html": "<h1>Madhu's Wish</h1>\n<p><strong>English · Class 3 · Chapter 13</strong></p>\n<p><em>A boy who shares his lunch is granted a wish by a magical banyan tree, asks for endless food and no water, and learns through unstoppable hiccups that water matters more than any feast.</em></p>\n<blockquote>Madhu, a boy who loves eating all kinds of food, sits under a banyan tree every day at noon for lunch. One day an old man arrives; Madhu shares his food. The grateful old man grants Madhu a wish from the magical tree. Madhu wishes for different types of food forever, ignoring the tree's gentle warning to think carefully. The tree grants laddoos, then fruits (grapes, mangoes, apples, bananas, jackfruit, melons, guavas, oranges), then savouries (matri, samosas, kachori, potato chips, vada). Madhu gets hiccups and …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>○ uses</td><td>In Sudha Murty's story a magical tree grants Madhu every kind of food but no water, and the tale's whole moral is that water is worth more than any feast.</td><td>Section A: Madhu's Wish (prose_summary) / Let us think B.3 'Do you think water is important? Why do you think so?'</td></tr>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>○ uses</td><td>When hiccups strike, sharbat, kheer and badam milk cannot stop them and only a jug of water can, so children talk about why the body needs water above all other food.</td><td>Let us listen A.2 (transcript) / Let us think B.1–3 / Let us write A.4 'Madhu asked for water because ___'</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/english/iii/summaries/ch_13_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "mathematics-iii-ch11": {"title": "Filling and Lifting", "crumb": "chapter · Mathematics · Class 3", "html": "<h1>Filling and Lifting</h1>\n<p><strong>Mathematics · Class 3 · Chapter 11</strong></p>\n<p><em>Introduces capacity by comparing and pouring between vessels, names the litre (with half and quarter litre) as its standard unit, then introduces weight comparison, the kilogram and pan-balance reasoning.</em></p>\n<blockquote>This section introduces capacity comparison by asking children to observe that different-shaped vessels hold different amounts of liquid. Through the story of Ritu, Monu, and Nita with glasses of different sizes, children learn that 'how much a container holds' (capacity) cannot be judged by appearance alone. The concrete method — pouring contents into identical same-sized glasses — establishes the idea of a fair comparison. Children then extend this to vessels from home, guessing and verifying how many small …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[measuring-water</td><td>Measuring water]]</td><td>● introduces</td><td>How much a vessel holds cannot be judged by its shape, so water or milk is poured into same-sized glasses to compare fairly, and the litre (then half and quarter litre) is met as the standard unit by checking a bucket, mug and glass against a 1-litre bottle.</td><td>S1 Whose glass holds more? (T-4, T-5) / S2 A Measuring Bottle — the litre (T-13, T-14, T-16)</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/mathematics/iii/summaries/ch_11_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "the_world_around_us-iii-ch07": {"title": "Water–A Precious Gift", "crumb": "chapter · The World Around Us · Class 3", "html": "<h1>Water–A Precious Gift</h1>\n<p><strong>The World Around Us · Class 3 · Chapter 7</strong></p>\n<p><em>Children observe rain, follow where rainwater goes, trace where their household water comes from and how it is stored, and learn that every drop must be saved.</em></p>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>● introduces</td><td>Rain is met by direct observation: children read sky and nature clues to predict whether it will rain, then watch a shower and describe its heaviness, drop size, speed and slant, and collect rainwater to see whether it looks clean or dirty.</td><td>Section: Here Comes the Rain! / T-1, T-2, T-3</td></tr>\n<tr><td>[[water-cycle</td><td>The water cycle]]</td><td>● introduces</td><td>After rain falls it soaks into the soil, runs into streams and rivers, collects in puddles, ponds and lakes, or is stored underground as groundwater that feeds wells — the cycle grounded at a concrete, observable level without the formal 'water cycle' term.</td><td>Section: What happened to the rainwater? / T-4, T-5, T-19</td></tr>\n<tr><td>[[oceans-and-water-bodies</td><td>Oceans and water bodies]]</td><td>● introduces</td><td>Streams, rivers, ponds and lakes are the local water bodies where rainwater collects, and students find one near their village or city, visit and draw it, and record whether its water is (or was) used for drinking.</td><td>Section: What happened to the rainwater? / T-8; Let us reflect / T-20</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>● introduces</td><td>Tap water comes from rooftop tanks, pipes, wells, borewells or tankers; many people must carry water from a distant well, river or lake; households store water against irregular supply; and water is precious, so it must not be wasted or polluted.</td><td>Sections: Water is a Precious Gift! / Water in Our Daily Lives / Every Drop Counts (T-10 to T-15, T-22)</td></tr>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>● introduces</td><td>People have long stored water in clay, copper, brass and other traditional vessels, kept pots of water outside their homes for passers-by in the hot months, and celebrate rain and rivers in songs and poems.</td><td>Sections: Water is a Precious Gift! / Water in Our Daily Lives / Every Drop Counts (T-6, T-9, T-14, T-17)</td></tr>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>○ uses</td><td>Water is essential for the survival of people, birds and animals, so students build and maintain a birdbath, note which birds and insects come to drink, and ask whether the water near them is fit for drinking.</td><td>Section: Every Drop Counts / T-18, T-21; Let us reflect / T-20</td></tr>\n<tr><td>[[measuring-water</td><td>Measuring water]]</td><td>○ uses</td><td>Students estimate how much water everyday tasks need in informal units (mugs of water to brush teeth, water used for a shower) to build a sense of quantity — placed under the nearest id, since no standard units such as litres are used.</td><td>Section: Water in Our Daily Lives / T-16</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/the_world_around_us/iii/summaries/ch_07_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "mathematics-iv-ch08": {"title": "Weigh It, Pour It", "crumb": "chapter · Mathematics · Class 4", "html": "<h1>Weigh It, Pour It</h1>\n<p><strong>Mathematics · Class 4 · Chapter 8</strong></p>\n<p><em>Revisits weight and capacity from Grade 3, introduces grams and millilitres as sub-units with their fraction relationships to the kilogram and litre, and closes with measuring everyday water use and waste.</em></p>\n<blockquote>The chapter opens by revisiting weight and capacity from Grade 3, then situates learning in a vegetable market scene where a seller weighs vegetables. Students compare animals by heaviness, reflect on objects they interact with daily (school bag, heaviest book), and predict the weight of a half pumpkin using a scale image. The section moves along the concrete path — students draw on lived experience and visual estimation before any formal measurement.</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[measuring-water</td><td>Measuring water]]</td><td>◐ extends</td><td>The litre is subdivided into millilitres — 500 ml is half a litre, 250 ml a quarter, 100 ml a tenth — discovered by pouring, with 10 ml dosing cups and 1 ml droppers for tiny amounts, and household containers (water bottle, glass, mug, jug, bucket) are estimated then measured.</td><td>S5 Measuring capacity — litre, millilitre, and fractions (T-21, T-22, T-23, T-24, T-27)</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>○ uses</td><td>Students count the litres of water they drink and use each day for showering, washing clothes and watering crops, and collect the drip from a leaking tap for an hour to work out how much water is wasted in a day and a week.</td><td>S6 Water use, conservation, and measuring containers (T-29, T-30, T-31 Water Conservation in Everyday Life)</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“The chapter opens by revisiting weight and capacity from Grade 3”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/mathematics/iv/summaries/ch_08_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "the_world_around_us-iv-ch09": {"title": "Different Lands, Different Lives", "crumb": "chapter · The World Around Us · Class 4", "html": "<h1>Different Lands, Different Lives</h1>\n<p><strong>The World Around Us · Class 4 · Chapter 9</strong></p>\n<p><em>Four children's holidays introduce India's plains, desert, coast and mountains and how each landform shapes food, clothing, houses, livelihoods and festivals.</em></p>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>○ uses</td><td>Rainfall differs across landforms and shapes how people live: deserts get very little rain, Sikkim's heavy rain calls for wooden houses with slanting roofs, the rainy season brings landslides in the mountains, and coastal Odisha faces cyclones.</td><td>Sections: In the Land of Endless Sand / In the Mountains, with Nayan / On the Seashore, with Chandni (T-12, T-19, T-21)</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>○ uses</td><td>Water is scarce in the desert, so plants like cactus, khejri and babool survive by storing water and desert houses keep tankas (water tanks) for storage; students discuss why deserts are short of water.</td><td>Section: In the Land of Endless Sand, with Ritika / T-6</td></tr>\n<tr><td>[[oceans-and-water-bodies</td><td>Oceans and water bodies]]</td><td>○ uses</td><td>The sea defines the coastal landform: Odisha's coast has beaches, fishing as the main livelihood, sand art and conch shells, and students compare life by the sea with life in the desert and discuss why beaches must be kept clean.</td><td>Section: On the Seashore, with Chandni / T-7, T-9, T-10</td></tr>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>○ uses</td><td>The sea along the Odisha coast is a habitat for sea turtles, crabs, dolphins, corals, seaweed and starfish, which students identify by name from pictures.</td><td>Section: On the Seashore, with Chandni / T-11</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/the_world_around_us/iv/summaries/ch_09_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "english-v-ch05": {"title": "The Frog", "crumb": "chapter · English · Class 5", "html": "<h1>The Frog</h1>\n<p><strong>English · Class 5 · Chapter 5</strong></p>\n<p><em>A first-person poem in which a frog describes its cheerful amphibious life in ponds, drains and grass, from tadpole to webbed-footed hopper.</em></p>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>○ uses</td><td>A frog lives in water and on land alike — sitting in ponds and muddy drains, swimming first as a tadpole and later with webbed feet — and children compare this amphibious life with a fish's and draw the frog's pond home.</td><td>Section A: The Frog (poem_text, poem_appreciation_summary) / Let us Think A.1, A.3, B.1, B.3 / Let us Listen: My Frog's World</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/english/v/summaries/ch_05_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "english-v-ch06": {"title": "What a Tank!", "crumb": "chapter · English · Class 5", "html": "<h1>What a Tank!</h1>\n<p><strong>English · Class 5 · Chapter 6</strong></p>\n<p><em>An informational text on India's traditional and modern water-storage structures, centred on rural Punjab's rooftop tanks sculpted into flowers, tractors and aeroplanes, with discussion and listening tasks on water wastage and conservation.</em></p>\n<blockquote>The chapter is an informational text about water storage structures, focusing on traditional and modern water tanks in India. It opens by noting that water conservation has existed for centuries, with ancient structures serving multiple purposes — storing water, preventing floods, and uniting communities. The text describes traditional methods still in use: Ooranis in Tamil Nadu for rainwater harvesting, Panam Keni wells in Kerala that stay full year-round, and underground Tankas in Rajasthan's Thar region that …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>○ uses</td><td>Water has been stored for centuries in structures like Tamil Nadu's ooranis for rainwater harvesting, Kerala's year-round Panam Keni wells and Rajasthan's underground tankas, and today in household overhead tanks — and children list how water is wasted daily, how to stop it, and hear how a day without supply led a family to set up rainwater harvesting at home.</td><td>Section A: What a Tank! (prose_summary) / Let us Think A.1, B.1 / Let us Speak A–B / Let us Listen: A Day without Water / Let us Explore A (cleaning tanks)</td></tr>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>○ uses</td><td>Rural Punjab's rooftop water tanks are sculpted from cement and steel into flowers, footballs, roosters, tractors and aeroplanes that announce the owner's occupation or passion, and children design a community poster to preserve and clean old water tanks.</td><td>Section A: What a Tank! (prose_summary) / Let us Think A.3–4, B.2 / Let us Write A (poster) / Let us Explore B (The Thirsty Crow)</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“Find at least five exclamatory sentences from your Grade 4 English textbook”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/english/v/summaries/ch_06_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "english-v-ch08": {"title": "The Decision of the Panchayat", "crumb": "chapter · English · Class 5", "html": "<h1>The Decision of the Panchayat</h1>\n<p><strong>English · Class 5 · Chapter 8</strong></p>\n<p><em>A cunning neighbour sells a farmer a well but refuses him its water, and the village Panchayat outwits him with a judgment that the water in another's well belongs to the well's owner.</em></p>\n<blockquote>A hardworking farmer in a small village prospers and buys a third field along with the well next to it from his cunning neighbour. The next day the neighbour refuses to let the farmer draw water from the well, arguing that he sold only the well structure and not the water inside it. The confused farmer approaches the village chief, who convenes a Panchayat meeting under the banyan tree in the village centre. Both parties are summoned and heard. When the neighbour stubbornly repeats his claim, the Panchayat …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>○ uses</td><td>A village Panchayat under the banyan tree settles a dispute in which a neighbour who sold a well claims he did not sell the water in it, ruling that water kept in another's well belongs to the well's owner, and children judge whether the decision was fair.</td><td>Section A: The Decision of the Panchayat (prose_summary) / Let us Think A.1–4, B.1, B.3</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>○ uses</td><td>A farmer buys the well beside his new field because the well is the field's source of water, and the chapter states outright that water is priceless — so valuable that no price can be put on it.</td><td>Section A (prose_summary) / Let us Write B 'Water is priceless'</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/english/v/summaries/ch_08_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "mathematics-v-ch05": {"title": "Far and Near", "crumb": "chapter · Mathematics · Class 5", "html": "<h1>Far and Near</h1>\n<p><strong>Mathematics · Class 5 · Chapter 5</strong></p>\n<p><em>Builds the length unit hierarchy from millimetre to kilometre and performs conversions and the four operations on compound lengths.</em></p>\n<blockquote>The chapter opens by activating prior knowledge of length units — metre and centimetre — through a matching activity. Students identify which unit is appropriate for everyday quantities such as the height of India Gate, the length of a handkerchief, or the depth of a well. This is a concrete-to-symbolic warm-up that anchors unit sense before new units are introduced.</blockquote>\n<h2>Water ideas in this chapter</h2>\n<p><em>None recorded.</em> Length and distance only; water stations in a race, a well's depth and a waterfall's distance appear as incidental context, never as measured or discussed water.</p>\n<hr>\n<p>Source summary: <code>authoring/chapters/mathematics/v/summaries/ch_05_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "mathematics-v-ch08": {"title": "Weight and Capacity", "crumb": "chapter · Mathematics · Class 5", "html": "<h1>Weight and Capacity</h1>\n<p><strong>Mathematics · Class 5 · Chapter 8</strong></p>\n<p><em>Formalises weight units from milligram to tonne and capacity in litres and millilitres, with double-number-line conversion, comparison and all four operations on compound quantities.</em></p>\n<blockquote>The chapter opens with a real-life context: Anu has recorded weights of household items (iron almirah, bed, sofa, refrigerator, etc.) and students must tick those that are plausible. This section activates prior sense of the gram–kilogram distinction by asking learners to evaluate whether recorded values (e.g. 40 g for an iron almirah) are reasonable. The task is purely perceptual-reasoning: no calculation is required, only familiarity with everyday objects and appropriate units.</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[measuring-water</td><td>Measuring water]]</td><td>◐ extends</td><td>Litres and millilitres are tied by 1,000 ml = 1 l on a double number line, so 1 l 400 ml is 1,400 ml (not 1,040 ml), and amounts of water, milk, fuel and oil in compound l-and-ml form are compared, added, subtracted, multiplied and divided with regrouping across the 1,000.</td><td>S10 Measuring Capacity (T-28, T-29) / S11 Big to Small, Small to Big (T-30, T-31) / S12 l and ml Double Number Line (T-33, T-34, T-35) / S13–S14 (T-36–T-43)</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/mathematics/v/summaries/ch_08_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "the_world_around_us-v-ch01": {"title": "Water — The Essence of Life", "crumb": "chapter · The World Around Us · Class 5", "html": "<h1>Water — The Essence of Life</h1>\n<p><strong>The World Around Us · Class 5 · Chapter 1</strong></p>\n<p><em>Freshwater is a tiny share of Earth's water; the chapter builds the three forms of water, the water cycle, groundwater, river flow and freshwater habitats through models and a field visit.</em></p>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[oceans-and-water-bodies</td><td>Oceans and water bodies]]</td><td>● introduces</td><td>Most of Earth's surface is covered by water but nearly all of it is salty ocean water unfit for drinking or farming; freshwater is only a tiny fraction (a teaspoon in a glass) held in rivers, ponds, lakes and underground, and India's rivers drain either to the Bay of Bengal or the Arabian Sea.</td><td>Section: Water on Earth / T-1, T-2, T-3; Surface Water / T-10; Let us reflect / T-16</td></tr>\n<tr><td>[[water-cycle</td><td>The water cycle]]</td><td>● introduces</td><td>The Sun's heat evaporates water from oceans and rivers, the vapour cools into clouds, and rain, snow and hail fall back into rivers, lakes and oceans in a continuous cycle, modelled with coloured water sealed in a transparent bag left in sunlight.</td><td>Section: Water Cycle / T-5</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>● introduces</td><td>Rainwater percolates through soil and rock to become groundwater drawn up by wells, borewells, tube wells and handpumps; paved city surfaces block recharge while open ground, soak pits, ponds and trees restore it, and students design a house or school that conserves water.</td><td>Section: Groundwater / T-6, T-7; Let us reflect / T-18, T-19, T-20</td></tr>\n<tr><td>[[rivers-and-landforms</td><td>Rivers and landforms]]</td><td>● introduces</td><td>Rivers begin in mountains and flow downhill with their path and speed shaped by the land they cross (and flowing water reshapes land over time), modelled with mustard seeds on crumpled paper and traced on a map of India's rivers, including the Luni that ends in the Rann of Kutch without reaching a sea.</td><td>Section: Surface Water / T-8, T-9, T-10</td></tr>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>● introduces</td><td>All living beings depend on freshwater, and freshwater habitats hold specially adapted plants and animals (fins and gills, waxy leaves; dragonfly, pond heron, freshwater turtle, lotus, water hyacinth) linked in a food chain, which students observe on a visit to a pond, lake or aquarium.</td><td>Section: Life in Water / T-11, T-12, T-13, T-14; Let us reflect / T-17</td></tr>\n<tr><td>[[states-of-water</td><td>States of water]]</td><td>◐ extends</td><td>Water exists as liquid (rain), solid (ice) and vapour (steam); students watch droplets condense on a cold steel glass of ice, ice melt, water boil and water left in sunlight for three days disappear, recording that water changes form and can return to liquid.</td><td>Section: Water has Different Forms / T-4; Let us reflect / T-15</td></tr>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>○ uses</td><td>Communities have built traditional rainwater-harvesting structures such as the johads of Rajasthan (small dams that collect rain and recharge groundwater), and Hiware Bazar in Maharashtra became water-positive through community-led watershed management.</td><td>Sections: Water on Earth; Surface Water</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“This section revisits the three states of water — liquid (rain), solid (ice), and vapour (steam)”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/the_world_around_us/v/summaries/ch_01_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "the_world_around_us-v-ch02": {"title": "Journey of a River", "crumb": "chapter · The World Around Us · Class 5", "html": "<h1>Journey of a River</h1>\n<p><strong>The World Around Us · Class 5 · Chapter 2</strong></p>\n<p><em>The Godavari narrates its own journey from source to delta, showing how a river supports life, is dammed, polluted, floods and runs dry, and what people owe it in return.</em></p>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-as-solvent</td><td>Water as a solvent]]</td><td>● introduces</td><td>Some pollutants dissolve invisibly in water while others such as oil do not (a spoon of sugar versus a spoon of cooking oil stirred into two glasses), both harming the river, and students design a simple water filter from everyday materials.</td><td>Section: What Pollutes Me and Why it Matters / T-13; Let us reflect / T-26</td></tr>\n<tr><td>[[rivers-and-landforms</td><td>Rivers and landforms]]</td><td>◐ extends</td><td>One river is followed source to sea: the Godavari rises as a stream at Trimbakeshwar in the Western Ghats, gathers tributaries over 1,465 km, flows year-round (perennial, unlike seasonal rivers), spreads into a delta where freshwater meets the sea at the Coringa mangroves, and overflows its banks in floods when rain is excessive — worse where forests have been cut.</td><td>Sections: Where I Begin, Where I Flow / The Life I Hold / When a River Floods (T-1, T-16)</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>◐ extends</td><td>A river supplies water for drinking, cooking, washing, irrigation and industry through pipes and canals; India's 900-plus dams store river water for dry seasons, irrigation and electricity at the cost of flooding land and displacing people; and drought (Chennai 2019) forces migration and calls for conservation habits, the National Water Mission and water ATMs.</td><td>Sections: The Many Ways I Support Lives / Dams—Storing My Water, Changing My Flow / When a River Runs Dry! (T-3, T-6, T-8, T-18, T-19)</td></tr>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>◐ extends</td><td>Waste, plastic, untreated sewage and fertiliser runoff make river water unsafe for people and wildlife — algal 'green blankets' choke aquatic life and make water undrinkable — and floods spread disease and cut off safe drinking water.</td><td>Section: What Pollutes Me and Why it Matters / T-12, T-14, T-15; When a River Floods / T-16</td></tr>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>◐ extends</td><td>Since ancient times settlements have grown beside rivers for reliable water; the Godavari is sacred (Dakshina Ganga, the Pushkaram festival at Nashik), families carry river stories and festivals, and students role-play as Sarpanch or plan a riverside city that stays clean, flood-safe and supplied through summer.</td><td>Sections: Where I Begin, Where I Flow / The Many Ways I Support Lives / Let us reflect (T-2, T-17, T-21, T-23, T-27)</td></tr>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>○ uses</td><td>Rainfall governs a river's year: seasonal rivers flow only in the rainy season, excessive rain makes rivers overflow their banks, and dams hold water back for the dry season.</td><td>Sections: The Life I Hold / Dams—Storing My Water, Changing My Flow / When a River Floods</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/the_world_around_us/v/summaries/ch_02_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "the_world_around_us-v-ch04": {"title": "Our School—A Happy Place", "crumb": "chapter · The World Around Us · Class 5", "html": "<h1>Our School—A Happy Place</h1>\n<p><strong>The World Around Us · Class 5 · Chapter 4</strong></p>\n<p><em>Students explore their own school as 'green school' teams — waste, water, cooling, greenery, traffic and fire safety — and how everyday behaviour makes it a happy place.</em></p>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>◐ extends</td><td>A dripping tap wastes far more water than it seems — students time how long a drip takes to fill a glass and scale it up to a day — and a green school fixes leaks, prevents wastage and collects rainwater, in the spirit of the Jal Shakti Abhiyan.</td><td>Section: Dripping Water / T-15, T-16, T-17; Be a School Explorer! (Water Watchers)</td></tr>\n<tr><td>[[measuring-water</td><td>Measuring water]]</td><td>○ uses</td><td>Water is measured two ways: the time a drip takes to fill a glass (scaled to glasses per day), and water temperature read with a thermometer before and after an hour under a tree versus in the Sun.</td><td>Section: Dripping Water / T-15; Greenery Around Us / T-20</td></tr>\n<tr><td>[[water-and-heat</td><td>Water and heat]]</td><td>○ uses</td><td>Water kept in the shade of a tree stays cooler than water left in the Sun, and clay matkas cool drinking water without electricity by evaporative cooling.</td><td>Section: Greenery Around Us / T-20; Dripping Water (IKS note on matkas)</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/the_world_around_us/v/summaries/ch_04_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "the_world_around_us-v-ch07": {"title": "Energy—How Things Work", "crumb": "chapter · The World Around Us · Class 5", "html": "<h1>Energy—How Things Work</h1>\n<p><strong>The World Around Us · Class 5 · Chapter 7</strong></p>\n<p><em>Energy is what makes things move, light up, sound and warm; the chapter covers its sources (food, fuels, electricity) and clean generation from the Sun, wind and flowing water.</em></p>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>○ uses</td><td>Flowing water is a clean energy source: fast-moving rivers generate electricity and traditional gharaats (watermills) in hilly areas grind grain, modelled with a paper-cup water wheel that turns when water is poured on it — placed under the nearest id, since hydropower is not in the vocabulary.</td><td>Section: Generating Energy from the Sun, Wind and Water / T-8, T-12</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/the_world_around_us/v/summaries/ch_07_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "english-vi-ch11": {"title": "The Winner (Sports and Wellness)", "crumb": "chapter · English · Class 6", "html": "<h1>The Winner (Sports and Wellness)</h1>\n<p><strong>English · Class 6 · Chapter 11</strong></p>\n<p><em>Georgia Heard's short poem about children playing ball in a neighbour's field until night falls and 'wins', taught for typographic pattern and personification.</em></p>\n<h2>Water ideas in this chapter</h2>\n<p><em>None recorded.</em> Water is only the setting ('next to the creek'); the sole water task is a vocabulary word web naming other water bodies (Let us learn), plus a swimming riddle in Let us listen — incidental, neither taught nor substantively used.</p>\n<hr>\n<p>Source summary: <code>authoring/chapters/english/vi/summaries/ch_11_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-vi-ch06": {"title": "Materials Around Us", "crumb": "chapter · Science · Class 6", "html": "<h1>Materials Around Us</h1>\n<p><strong>Science · Class 6 · Chapter 6</strong></p>\n<p><em>Objects are made of materials that can be grouped by observable properties — lustre, hardness, transparency, solubility in water, mass and volume — leading to the definition of matter as anything that occupies space and has mass.</em></p>\n<blockquote>This section introduces students to the idea that all objects around us are made from materials such as paper, wood, cloth, glass, metal, plastic, and clay. Through a classroom conversation between characters Ghulan, Sheeta, and their teacher Madam Vidya, students are prompted to notice and compare the objects they bring to school every day. The key term introduced is material, defined as any substance used to create an object. The section includes Activity 6.1, a listing activity where students identify objects …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-as-solvent</td><td>Water as a solvent]]</td><td>● introduces</td><td>Stirring sugar, salt, chalk powder, sand and sawdust into water shows that some materials dissolve completely (soluble) while others do not (insoluble), some liquids mix with water while others form a separate layer, and gases such as oxygen dissolve too, which is what makes aquatic life possible.</td><td>6.3.4 What is soluble in water; what is not? / Activity 6.7</td></tr>\n<tr><td>[[measuring-water</td><td>Measuring water]]</td><td>● introduces</td><td>The amount of water in a tumbler is its volume — the space it occupies — and bottles labelled 1 L, 500 mL or 200 mL state that volume in litres and millilitres (with 1 m³ = 1000 L noted as the SI relation).</td><td>6.3.6 Space and volume / 6.4 What is Matter?</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“the distinction between the two will be explored in higher classes”</li>\n<li>“connecting classification of the non-living world to prior learning about classification of the living world”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/vi/summaries/ch_06_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-vi-ch07": {"title": "Temperature and its Measurement", "crumb": "chapter · Science · Class 6", "html": "<h1>Temperature and its Measurement</h1>\n<p><strong>Science · Class 6 · Chapter 7</strong></p>\n<p><em>Touch is an unreliable judge of hot and cold, so temperature is measured with clinical, laboratory and room thermometers on the Celsius, Fahrenheit and Kelvin scales.</em></p>\n<blockquote>This section establishes that our sense of touch is unreliable as a measure of hotness or coldness. Using a narrative about Lambok and his sister Phiban, the chapter opens with the question of whether fever can always be detected by touch alone, prompting the need for a more reliable method. Activity 7.1 (\"Let us investigate\") is a student-executed hands-on activity in which students dip their hands into containers of warm water, tap water, and ice-cold water in sequence and record both predictions and …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[measuring-water</td><td>Measuring water]]</td><td>● introduces</td><td>A laboratory thermometer is dipped into warm water and read while still immersed, held vertically with the eye level to the liquid column, to measure the water's temperature in degrees Celsius.</td><td>7.3.2 Laboratory thermometer / Activity 7.5</td></tr>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>● introduces</td><td>Air temperature is a weather measurement: weather services record each day's maximum and minimum air temperature, which rises towards summer and falls in winter and is used in forecasting (this node is weather measurement only, with no water content — recorded because the vocabulary lists weather measurement here).</td><td>7.3.3 Air temperature / Activity 7.7</td></tr>\n<tr><td>[[states-of-water</td><td>States of water]]</td><td>○ uses</td><td>Boiling water and melting ice each hold a constant temperature, and students' readings of boiling water in Shillong come out slightly below 100 °C, raising the idea that the boiling point of water depends on altitude.</td><td>7.3.2 Laboratory thermometer / Activity 7.6 and 'More to do!'</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/vi/summaries/ch_07_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-vi-ch08": {"title": "A Journey through States of Water", "crumb": "chapter · Science · Class 6", "html": "<h1>A Journey through States of Water</h1>\n<p><strong>Science · Class 6 · Chapter 8</strong></p>\n<p><em>Water exists as ice, liquid water and invisible water vapour; heating and cooling move it between these states, and evaporation and condensation at planetary scale give clouds and rain.</em></p>\n<blockquote>This section opens with children noticing that water from playground puddles disappears after rain. It introduces the concept that water on surfaces—utensils, mopped floors, wet clothes—dries up over time, prompting students to investigate whether water seeps through surfaces or disappears in another way. Through an activity using a steel plate, students establish that water does not seep through a solid surface. The section introduces the key term evaporation: the process of conversion of water into its vapour …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[states-of-water</td><td>States of water]]</td><td>● introduces</td><td>Water exists as ice, liquid water and water vapour; evaporation (which goes on even at room temperature) and condensation, melting and freezing move it between these states, and evaporation is faster with more exposed surface, higher temperature, moving air and drier air.</td><td>8.1 Investigating Water's Disappearing Act / 8.2 Another Mystery / 8.3 / 8.4 / 8.5 (Activities 8.2, 8.4, 8.5, 8.6, 8.7, 8.8)</td></tr>\n<tr><td>[[water-cycle</td><td>The water cycle]]</td><td>● introduces</td><td>Water vapour rising from oceans, lakes and rivers cools and condenses around dust particles to form clouds, the droplets merge into drops heavy enough to fall as rain (or hail or snow), and the water collects again in oceans, lakes, rivers and groundwater — the water cycle.</td><td>8.7 How Do Clouds Give Us Rain? / Activities 8.10, 8.11</td></tr>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>● introduces</td><td>Humidity is the measure of water vapour in the air; on rainy, humid days evaporation is slower and clothes dry slowly, and rain is what falls when cloud droplets grow heavy.</td><td>8.2 Another Mystery / 8.5 How can Water be Evaporated Faster or Slower? / 8.7</td></tr>\n<tr><td>[[water-and-heat</td><td>Water and heat]]</td><td>● introduces</td><td>Supplying heat turns ice to water and water to vapour while removing heat freezes water, and because evaporation takes heat from the water left behind, a porous earthen matka, a pot-in-pot cooler or water sprinkled on a floor cools things down.</td><td>8.4 How can We Change the States of Water? / 8.6 Cooling Effect / Activity 8.9</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>○ uses</td><td>Only a small fraction of Earth's water is available to living things, the rest lying in the oceans, so water must be used wisely and water bodies kept free of pollution; an Atmospheric Water Generator can even harvest water by condensing humid air.</td><td>8.7 closing note / 8.4 'More to Know' (Atmospheric Water Generator)</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/vi/summaries/ch_08_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-vi-ch09": {"title": "Methods of Separation in Everyday Life", "crumb": "chapter · Science · Class 6", "html": "<h1>Methods of Separation in Everyday Life</h1>\n<p><strong>Science · Class 6 · Chapter 9</strong></p>\n<p><em>Nine everyday separation methods — handpicking, threshing, winnowing, sieving, evaporation, sedimentation and decantation, filtration, churning and magnetic separation — told through a journey across India.</em></p>\n<blockquote>The chapter introduces a variety of everyday separation methods through a narrative of two siblings, Malli and Valli, travelling across India and encountering different separation techniques in each location. The concept of a mixture — when two or more substances are combined — is established as the context for why separation is needed.</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-as-solvent</td><td>Water as a solvent]]</td><td>◐ extends</td><td>A dissolved solid such as salt is recovered from water by evaporating the water (in salt pans and by heating a salt solution to dryness), insoluble particles are removed by letting them settle and decanting or by filtering muddy water through filter paper, cloth, cotton, sand or charcoal, and oil is decanted off water because it forms a separate layer.</td><td>Evaporation (Activities 9.2, 9.3) / Sedimentation and Decantation / Filtration (Activities 9.4, 9.5)</td></tr>\n<tr><td>[[states-of-water</td><td>States of water]]</td><td>○ uses</td><td>Evaporation — a liquid turning into its vapour — is put to work to separate a dissolved solid from water, whether by sunlight and air over seawater in shallow pits or by boiling a salt solution away over a spirit lamp.</td><td>Evaporation / Activities 9.2, 9.3</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/vi/summaries/ch_09_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-vi-ch10": {"title": "Living Creatures: Exploring their Characteristics", "crumb": "chapter · Science · Class 6", "html": "<h1>Living Creatures: Exploring their Characteristics</h1>\n<p><strong>Science · Class 6 · Chapter 10</strong></p>\n<p><em>Living beings are distinguished from non-living by movement, growth, nutrition, respiration, excretion, response to stimuli and reproduction; then seed germination and the life cycles of a bean plant, a mosquito and a frog are traced.</em></p>\n<blockquote>The chapter opens with a narrative in which students Avadhi and Aayush encounter shells during a morning walk and wonder whether a non-moving shell could be home to a living snail. This curiosity drives the class discussion that forms the backbone of the chapter — how to distinguish the living from the non-living.</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>● introduces</td><td>A seed needs water and air (not light) to germinate — water softens the seed coat so the embryo can grow — while mosquitoes lay eggs on stagnant water where larvae and pupae surface to breathe, and frogs begin life as spawn and tadpoles swimming in ponds before living on both land and water.</td><td>10.2 Essential Conditions for Germination of a Seed (Activity 10.2) / 10.5.1 Life cycle of a mosquito (Activity 10.5) / 10.5.2 Life cycle of a frog (Activity 10.6)</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/vi/summaries/ch_10_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-vi-ch11": {"title": "Nature's Treasures", "crumb": "chapter · Science · Class 6", "html": "<h1>Nature's Treasures</h1>\n<p><strong>Science · Class 6 · Chapter 11</strong></p>\n<p><em>Air, water, sunlight, forests, soil, rocks, minerals and fossil fuels are natural resources, classified as renewable or non-renewable and to be used responsibly.</em></p>\n<blockquote>Section 11.1 introduces air as a vital natural resource essential for the survival of all living beings. Students perform a breathing exercise (Activity 11.1) to experience first-hand how quickly the body requires oxygen—holding the breath causes discomfort because the body cannot function without it. Air is described as a mixture of gases that surrounds the Earth: nitrogen makes up 78%, oxygen 21%, and argon, carbon dioxide, and other gases together account for the remaining 1%. The section introduces the concept …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>● introduces</td><td>Water is a precious resource because most of it is saline and only a very small fraction of freshwater is easily accessible, so wastage in hand washing, cooking and gardening should be cut by turning off taps, fixing leaks, recycling water and harvesting rainwater — access is unequal across India, and water counts as a renewable resource only when used judiciously.</td><td>11.2 (water as a natural resource) / Activity 11.3 / 11.7 (renewable resources)</td></tr>\n<tr><td>[[oceans-and-water-bodies</td><td>Oceans and water bodies]]</td><td>● introduces</td><td>Water covers about two-thirds of the Earth's surface, but most of it lies in oceans and seas as saline water, with freshwater held in ice sheets and snow, rivers, lakes, ponds, wells and underground sources.</td><td>11.2 (water as a natural resource)</td></tr>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>○ uses</td><td>Rainwater harvesting is an age-old Indian practice, seen in traditional stepwells — the Bawadi of Rajasthan and the Vav of Gujarat — that store rainwater and water seeping from nearby ponds and lakes.</td><td>11.2 (water as a natural resource)</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/vi/summaries/ch_11_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "social_sciences-vi-ch02": {"title": "Oceans and Continents", "crumb": "chapter · Social Sciences · Class 6", "html": "<h1>Oceans and Continents</h1>\n<p><strong>Social Sciences · Class 6 · Chapter 2</strong></p>\n<p><em>Maps the distribution of water and land on Earth — five interconnected oceans, seven continents and islands — and shows how oceans sustain life, drive rainfall, shape human history and also bring cyclones and tsunamis.</em></p>\n<blockquote>Water is the dominant feature of the Earth's surface, covering almost three-fourths of the globe — which is why early astronauts called it the \"blue planet.\" The largest water bodies are called oceans, while large continuous expanses of land are called continents. Oceans and continents are not distributed equally between the Northern and Southern Hemispheres; the Northern Hemisphere holds significantly more land, while the Southern Hemisphere is predominantly water. Smaller extensions of oceans carry various names …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[oceans-and-water-bodies</td><td>Oceans and water bodies]]</td><td>● introduces</td><td>Water covers almost three-fourths of the Earth, mostly as five named but continuously connected oceans (Pacific the largest, Arctic the smallest) whose seas, bays and gulfs are parts of one global body, the Southern Hemisphere is mostly water, and freshwater is only a small share found in glaciers, rivers, lakes, the atmosphere and underground.</td><td>Section: The Distribution of Water and Land on the Earth (polar-view map activity) / Section: Oceans</td></tr>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>● introduces</td><td>Every layer of the ocean from sunlit surface to dark depths hosts marine flora (algae, seaweeds) and marine fauna (fish, dolphins, whales), the ocean's plant life makes more than half the world's oxygen, and salty seawater is unfit for land animals to drink.</td><td>Section: Oceans / Section: Oceans and Life</td></tr>\n<tr><td>[[water-cycle</td><td>The water cycle]]</td><td>○ uses</td><td>Oceans drive the water cycle by generating the rainfall that keeps continents from being deserts, which is why clouds forming over the ocean are the source of India's summer monsoon.</td><td>Section: Oceans and Life / Section: Oceans and Disasters</td></tr>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>○ uses</td><td>India's summer monsoon rains originate over the ocean, and the same oceans generate cyclones — violent storms with extreme rainfall and strong winds that damage coastal regions.</td><td>Section: Oceans and Disasters</td></tr>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>○ uses</td><td>From earliest times people have used seas and oceans to migrate, trade, wage military campaigns and fish, coastal cultures built tales and legends around the sea, and ocean-born tsunamis such as the 2004 Indian Ocean tsunami are now met with early warning systems and the National Disaster Management Authority.</td><td>Section: Oceans and Life / Section: Oceans and Disasters</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/social_sciences/vi/summaries/ch_02_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "social_sciences-vi-ch03": {"title": "Landforms and Life", "crumb": "chapter · Social Sciences · Class 6", "html": "<h1>Landforms and Life</h1>\n<p><strong>Social Sciences · Class 6 · Chapter 3</strong></p>\n<p><em>Classifies the Earth's surface into mountains, plateaus and plains (plus deserts), describing each landform's environment, the life and livelihoods it supports, and the challenges and cultural meanings people attach to it.</em></p>\n<blockquote>The chapter opens by establishing that land takes many forms across the Earth's surface. A journey from Chhota Nagpur in Jharkhand to Prayagraj in Uttar Pradesh and on to Almora in Uttarakhand, for instance, passes through three distinctly different landscapes. A landform is defined as a physical feature on the Earth's surface, shaped over millions of years and deeply connected to the environment and life. The chapter organises these features into three broad categories: mountains, plateaus and plains. Each …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[rivers-and-landforms</td><td>Rivers and landforms]]</td><td>● introduces</td><td>Snow melting on mountains feeds rivers such as the 2,500 km Ganga with its Himalayan tributaries, rivers plunge off plateau edges as waterfalls (Jog, Hundru, Nohkalikai, Victoria), and rivers rising in mountains carry rock, sand and silt down to deposit them as the fertile soils of floodplains.</td><td>Section: Mountains (Don't Miss Out: the Ganga) / Section: Plateaus (waterfalls) / Section: Plains (floodplains)</td></tr>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>○ uses</td><td>Precipitation is defined as water reaching the ground as rain, snow or hail, deserts are the landform that receives very little of it, and cloudbursts, flash floods and heavy snowfall are among the hazards of mountain life.</td><td>Section: Mountains (key vocabulary) / Section: Life in the mountains (activity on challenges) / Section: Life in the plains (deserts)</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>○ uses</td><td>Farming on the Ganga plain, once rainfed, now depends heavily on irrigation from canals and groundwater, which has raised production but depleted groundwater — a challenge for the future.</td><td>Section: Life in the plains</td></tr>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>○ uses</td><td>The first civilisations grew up around rivers in fertile plains, river sources and confluences are held sacred with festivals and rituals in India, rivers carry navigation and trade, and the Sangam tiṇai Neydal ties coastal life to fishing and seafaring.</td><td>Section: Life in the plains (river-visit activity; the five tiṇais)</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“prompting students to connect poetry to geography”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/social_sciences/vi/summaries/ch_03_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "social_sciences-vi-ch06": {"title": "The Beginnings of Indian Civilisation", "crumb": "chapter · Social Sciences · Class 6", "html": "<h1>The Beginnings of Indian Civilisation</h1>\n<p><strong>Social Sciences · Class 6 · Chapter 6</strong></p>\n<p><em>Defines what makes a civilisation and traces the Sindhu-Sarasvatī (Harappan) civilisation from river-valley villages to planned cities with drainage, wells and reservoirs, through its crafts, food and trade, to its decline as rainfall fell and the Sarasvatī dried.</em></p>\n<blockquote>This section introduces the concept of civilisation as an advanced stage of human societies. The chapter defines a civilisation as requiring at least seven key characteristics: some form of government and administration to manage complex society; urbanism including town-planning, city growth, and water and drainage management; a variety of crafts involving raw material management and production of finished goods; both internal and external trade to exchange goods; some form of writing for record-keeping and …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>● introduces</td><td>India's first civilisation grew on the plains watered by the Indus and the Sarasvatī, and its planned cities counted water and drainage management as a mark of urbanism — the waterproofed Great Bath of Mohenjo-daro, hundreds of brick-lined wells, and Dholavira's six stone or rock-cut reservoirs (the largest 73 m long) linked by underground drains.</td><td>Section: What Is a Civilisation? / Section: From Village to City / Section: Town-Planning (Great Bath debate) / Section: Water Management</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>○ uses</td><td>Harappans drew water from brick-lined wells, ponds and streams, and where these were lacking built human-made reservoirs that harvested and distributed water — an infrastructure that needed organised administration to build and maintain.</td><td>Section: Water Management (reservoir-measuring activity; Think About It on administration)</td></tr>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>○ uses</td><td>Harappan homes had bathing areas connected to a city-wide drainage network beneath the streets that carried waste water away — an early system of sanitation.</td><td>Section: Water Management</td></tr>\n<tr><td>[[rivers-and-landforms</td><td>Rivers and landforms]]</td><td>○ uses</td><td>Settlements were placed along rivers both for water and for the fertile soil rivers create, and the Sarasvatī — today the seasonal Ghaggar in India and Hakra in Pakistan — is a river that later texts describe drying up and disappearing.</td><td>Section: The Sarasvatī River / Section: What Did the Harappans Eat?</td></tr>\n<tr><td>[[rain-and-monsoon</td><td>Rain and the monsoon]]</td><td>○ uses</td><td>A global climatic change from about 2200 BCE reduced rainfall and made farming harder, which together with the drying of the Sarasvatī in its central basin led to the abandonment of cities such as Kalibangan and Banawali.</td><td>Section: The End or a New Beginning?</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/social_sciences/vi/summaries/ch_06_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "english-vii-ch01": {"title": "The Day the River Spoke (Learning Together)", "crumb": "chapter · English · Class 7", "html": "<h1>The Day the River Spoke (Learning Together)</h1>\n<p><strong>English · Class 7 · Chapter 1</strong></p>\n<p><em>In Kamala Nair's story a personified River counsels Jahnavi, a coastal-village girl kept home from school, to slip into class and claim her right to learn.</em></p>\n<blockquote>Jahnavi is a bright girl of nearly ten living in a coastal village in India. Her parents work on the farm, and she has been kept home to mind her younger siblings — first Ramu, then little Appu — while her brother Gopi (whom she calls Ettan, meaning 'Elder brother') and neighbour Meena attend school. Sitting by the river one day, weeping silently as a kingfisher swoops and a lizard basks, Jahnavi hears a sleepy, murmuring voice that turns out to be the River itself. The River, gently personified throughout, draws …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-in-society</td><td>Water in society]]</td><td>○ uses</td><td>The River is a living character who listens to a village girl and counsels her to go to school, and children go on to discuss why India's rivers are held sacred and mostly addressed as female (the Brahmaputra and Sone being male) and to name the country's boats — canoe, catamaran, coracle, shikara — and other water-transport words (boats placed here as the nearest fit in the vocabulary).</td><td>Section A: The Day the River Spoke (prose_summary) / Let us think and reflect I Extract 1 / Let us learn I, IV, V / Let us explore I</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/english/vii/summaries/ch_01_summary.json</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-vii-ch04": {"title": "The World of Metals and Non-metals", "crumb": "chapter · Science · Class 7", "html": "<h1>The World of Metals and Non-metals</h1>\n<p><strong>Science · Class 7 · Chapter 4</strong></p>\n<p><em>Metals and non-metals are distinguished by malleability, ductility, sonority and conduction, then by how they behave with air and water — rusting, basic metal oxides, acidic non-metal oxides.</em></p>\n<blockquote>4.1 Properties of Materials introduces the physical properties used to distinguish metals from non-metals, organised across five subsections.</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-as-solvent</td><td>Water as a solvent]]</td><td>○ uses</td><td>Iron rusts only when both water and air are present (a nail in boiled, oil-covered water or in dry air stays clean), sodium is stored in kerosene to keep it from water while phosphorus is stored under water, and sulfur dioxide dissolves in water to give an acidic solution — water here is a reactant and storage medium, which has no id of its own, so it is placed under the nearest (water-as-solvent).</td><td>4.2 Effect of Air and Water on Metals: Iron / 4.3 Effect of Air and Water on Other Metals / 4.4 Substances that Behave Differently from Metals in Air and Water</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“build a tester circuit (as in Chapter 3)”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/vii/summaries/ch_04_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-vii-ch05": {"title": "Changes Around Us: Physical and Chemical", "crumb": "chapter · Science · Class 7", "html": "<h1>Changes Around Us: Physical and Chemical</h1>\n<p><strong>Science · Class 7 · Chapter 5</strong></p>\n<p><em>Changes are sorted into physical and chemical, reversible and irreversible, desirable and undesirable, ending with the slow natural changes of weathering and erosion.</em></p>\n<blockquote>The introductory Activity 5.1 asks students to observe and record changes — including melting ice cubes, chopping vegetables, boiling water, making popcorn, cutting paper, burning wood, and drying wet clothes — and reflect on what is changing in each case, noting that changes may involve size, shape, smell, or other properties observed through the senses.</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[rivers-and-landforms</td><td>Rivers and landforms]]</td><td>● introduces</td><td>Rocks break into sediments by weathering — water freezing in cracks, temperature swings, growing roots, and water with dissolved chemicals reacting with rock surfaces — and flowing water and wind then carry the sediments away (erosion) to settle in water bodies where, over thousands of years, they harden into new rock.</td><td>5.7.1 Weathering of rocks / 5.7.2 Erosion</td></tr>\n<tr><td>[[states-of-water</td><td>States of water]]</td><td>○ uses</td><td>Ice melting, water boiling or evaporating and wet clothes drying are physical changes — the water stays water in all three states — and they are reversible, since melted ice can be refrozen and evaporated water condensed, unlike burning wood or making popcorn.</td><td>5.1 A Substance May Change in Appearance but Remain the Same! / Activity 5.1 / 5.5 Are Changes Permanent? (Activity 5.8)</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“Rusting revisits the formation of rust from Chapter 4”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/vii/summaries/ch_05_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-vii-ch07": {"title": "Heat Transfer in Nature", "crumb": "chapter · Science · Class 7", "html": "<h1>Heat Transfer in Nature</h1>\n<p><strong>Science · Class 7 · Chapter 7</strong></p>\n<p><em>Heat moves by conduction, convection and radiation, and these modes explain land and sea breezes, the water cycle and the seepage of rainwater into the ground.</em></p>\n<blockquote>7.1 Conduction of Heat establishes through an experimental investigation that heat travels along a metal strip from its hotter end towards its cooler end. The process of heat transfer from the hotter part of an object to the cooler part, where the particles themselves do not move from their positions but pass heat on to neighbouring particles, is defined as conduction. Materials that allow heat to pass through them easily — such as metals — are called good conductors of heat, and this explains why cooking utensils …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-and-heat</td><td>Water and heat]]</td><td>◐ extends</td><td>Water heats by convection — warmed water at the base expands, rises and is replaced by cooler water, as a potassium permanganate trace shows — and because land heats and cools faster than water, air flows from sea to land by day (sea breeze) and from land to sea at night (land breeze), while a pan of water on a flame uses conduction, convection and radiation at once.</td><td>7.2 Convection / 7.2.1 Land and Sea Breeze (Activity 7.4) / 7.3 Radiation</td></tr>\n<tr><td>[[water-cycle</td><td>The water cycle]]</td><td>◐ extends</td><td>Solar radiation drives evaporation from oceans, rivers and lakes and transpiration from plants, the rising vapour cools and condenses into clouds, and precipitation as rain, snow or hail returns water through soil, rocks and plants to the water bodies — with water present in nature as liquid, as snow, ice sheets and glaciers, and as vapour.</td><td>7.4 Water Cycle</td></tr>\n<tr><td>[[water-as-resource</td><td>Water as a resource]]</td><td>◐ extends</td><td>Rain seeps into the ground fastest through gravel and slowest through clay (infiltration) to become groundwater held in aquifers that wells and bore wells tap, and since over-extraction and urban concrete are depleting it, rainwater harvesting and recharge pits are needed — Ladakh's ice stupas store winter stream water as ice to release for farming in summer.</td><td>7.4.1 Seepage of water beneath the Earth / Science and Society box (ice stupa)</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/vii/summaries/ch_07_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-vii-ch09": {"title": "Nutrition and Respiration in Animals (summary carries no chapter title; named from its sections 9.1 and 9.2)", "crumb": "chapter · Science · Class 7", "html": "<h1>Nutrition and Respiration in Animals (summary carries no chapter title; named from its sections 9.1 and 9.2)</h1>\n<p><strong>Science · Class 7 · Chapter 9</strong></p>\n<p><em>Animals digest food along the alimentary canal and respire to release energy from it, with variations such as rumination, gizzards, gills and skin breathing.</em></p>\n<blockquote>Animals obtain energy from food by breaking down complex components such as carbohydrates, proteins, and fats into simpler, absorbable forms through a process called digestion. This breakdown takes place along a long continuous tube called the alimentary canal, which runs from the mouth to the anus. The simpler molecules produced through digestion are absorbed into the blood and transported to every cell in the body to fuel life processes.</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>○ uses</td><td>The large intestine absorbs water from undigested food, respiration in cells releases water along with carbon dioxide and energy, and fish breathe by passing dissolved oxygen from the surrounding water into the blood through gills, while tadpoles use gills and frogs and earthworms exchange gases through moist skin.</td><td>9.1.1 Large intestine / 9.2.1 How does the exchange of gases happen? / 9.2.2 Do other animals breathe the same way as humans do?</td></tr>\n</tbody></table>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/vii/summaries/ch_09_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "science-vii-ch10": {"title": "Life Processes in Plants", "crumb": "chapter · Science · Class 7", "html": "<h1>Life Processes in Plants</h1>\n<p><strong>Science · Class 7 · Chapter 10</strong></p>\n<p><em>Plants make food by photosynthesis from carbon dioxide and water in sunlight with chlorophyll, transport water through xylem and food through phloem, and respire like animals.</em></p>\n<blockquote>10.1 How Do Plants Grow? builds on prior knowledge that plants require water and sunlight, testing these claims through a controlled experiment. The section contains a student activity. Activity 10.1 asks students to set up three pots with similar saplings under different conditions — Pot A in sunlight with water, Pot B in sunlight without water, and Pot C in the dark with water — observe changes in height, number of leaves, and leaf colour over two weeks, and infer that plants require both sunlight and water for …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[water-and-life</td><td>Water and life]]</td><td>◐ extends</td><td>Plants need water to grow (a sapling in sunlight without water fails), water is a raw material of photosynthesis (carbon dioxide + water → glucose + oxygen), and roots absorb water with dissolved minerals that travel upward through xylem tubes, as a stem cutting in red-inked water shows.</td><td>10.1 How Do Plants Grow? (Activity 10.1) / 10.2.3 Photosynthesis: in a nutshell / 10.3.1 Transport of water and minerals (Activity 10.7)</td></tr>\n</tbody></table>\n<h2>The chapter's own pointers</h2>\n<p>Phrases in the summary that point at another class or subject, verbatim:</p>\n<ul>\n<li>“connects to Grade 6 learning that all living beings need food for growth, and to Chapter 9's discussion of how animals obtain nutrition”</li>\n</ul>\n<hr>\n<p>Source summary: <code>authoring/chapters/science/vii/summaries/ch_10_summary.txt</code> · Thread: <a href=\"#Water\" class=\"wl\">Water</a></p>"}, "social_sciences-vii-ch01": {"title": "Geographical Diversity of India", "crumb": "chapter · Social Sciences · Class 7", "html": "<h1>Geographical Diversity of India</h1>\n<p><strong>Social Sciences · Class 7 · Chapter 1</strong></p>\n<p><em>Tours India's physical regions — Himalayas, Ladakh, Gangetic plains, Thar, Aravallis, peninsular plateau, coasts, islands, the Sundarbans and the Northeast hills — and the life, resources and culture each supports.</em></p>\n<blockquote>India is the seventh-largest country in the world and forms part of Asia. Along with its neighbours — Pakistan, Bangladesh, Nepal, Bhutan, Sri Lanka, and Myanmar — it constitutes the Indian Subcontinent. The Himalayan Mountain range stands as a natural barrier in the north, the Thar Desert and Arabian Sea mark its western limits, the Indian Ocean lies to the south, and the Bay of Bengal to the east. These geographical boundaries have played a crucial role in shaping India's climate, culture, and history. For the …</blockquote>\n<h2>Water ideas in this chapter</h2>\n<table><thead><tr><th>Idea</th><th>Role</th><th>What this chapter says</th><th>Where</th></tr></thead><tbody>\n<tr><td>[[rivers-and-landforms</td><td>Rivers and landforms]]</td><td>◐ extends</td><td>Summer snow-melt from the Himalayas — the Bhagirathi rising at Gaumukh from the Gangotri Glacier — feeds the Ganga, Indus and Brahmaputra whose mineral-laden waters build the fertile Gangetic plains, the eastward tilt of the peninsular plateau sends the Godavari, Krishna, Kaveri and Mahanadi to the Bay of Bengal as wide fertile deltas while the Narmada and Tapti flow west into estuaries, and the Ganga–Brahmaputra delta forms the mangrove Sundarbans.</td><td>Section: The Himalayas as a Water Tower / Section: The Gangetic Plains / Section: The Peninsular Plateau / Section: India's Amazing Coastlines / Section: The Delta in West Bengal and the Sundarba
