as a resource, ○ Water and life</li>\n</ul>\n<p><strong>Class 9</strong></p>\n<ul>\n<li><a href=\"#science-ix-ch02\" class=\"wl\">Science · Ch 2 Cell: The Building Block of Life</a> — ◐ Water and life</li>\n<li><a href=\"#science-ix-ch03\" class=\"wl\">Science · Ch 3 Tissues in Action</a> — ◐ Water and life</li>\n<li><a href=\"#science-ix-ch05\" class=\"wl\">Science · Ch 5 Exploring Mixtures and their Separation</a> — ◐ Water as a solvent, ○ States of water</li>\n<li><a href=\"#science-ix-ch09\" class=\"wl\">Science · Ch 9 Atomic Foundations of Matter</a> — ◐ Water as a solvent</li>\n<li><a href=\"#science-ix-ch12\" class=\"wl\">Science · Ch 12 Patterns in Life: Diversity and Classification</a> — ○ Water and life</li>\n<li><a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> — ◐ The water cycle, ◐ Oceans and water bodies, ◐ Rain and the monsoon, ◐ Water and heat, ○ Rivers and landforms, ○ Water and life</li>\n<li><a href=\"#social_sciences-ix-ch02\" class=\"wl\">Social Sciences · Ch 2 Shaping of the Earth's Surface</a> — ◐ Rivers and landforms, ○ Oceans and water bodies, ○ Water as a solvent, ○ Water as a resource, ○ Water in society, ○ Rain and the monsoon</li>\n<li><a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a> — ◐ Rain and the monsoon, ◐ Water and heat, ○ States of water, ○ The water cycle, ○ Rivers and landforms</li>\n</ul>\n<h2>Looked at, left out</h2>\n<p>The keyword scan flagged these, the reader found only incidental water content:</p>\n<ul>\n<li>Mathematics Class 5 ch 5 <em>Far and Near</em> — Length and distance only; water stations in a race, a well's depth and a waterfall's distance appear as incidental context, never as measured or discussed water.</li>\n<li>English Class 6 ch 11 <em>The Winner (Sports and Wellness)</em> — Water is only the setting ('next to the creek'); the sole water task is a vocabulary word web naming other water bodies (Let us learn), plus a swimming riddle in Let us listen — incidental, neither taught nor substantively used.</li>\n<li>Science Class 8 ch 2 <em>The Invisible Living World: Beyond Our Naked Eye</em> — Water appears only as a sampling medium (pond or stagnant water observed under the microscope, a water-filled flask used as a lens) and as the habitat of microalgae; the chapter teaches cells and microorganisms, not any water concept.</li>\n<li>Science Class 9 ch 11 <em>Reproduction: How Life Continues</em> — Water appears only incidentally — as the medium of external fertilisation in fish and frogs, one pollination agent among four, and a seed-dispersal and germination condition; the chapter teaches reproduction, not a water concept.</li>\n</ul>"}, "states-of-water": {"title": "States of water", "crumb": "idea", "html": "<h1>States of water</h1>\n<p><em>Solid, liquid and gas; melting, freezing, evaporation, condensation, boiling.</em></p>\n<p>Part of the <a href=\"#Water\" class=\"wl\">Water</a> thread.</p>\n<p><strong>First taught:</strong> Class 6, <a href=\"#science-vi-ch08\" class=\"wl\">Science · Ch 8 A Journey through States of Water</a>.</p>\n<h2>The idea, class by class</h2>\n<table><thead><tr><th>Class</th><th>Subject · chapter</th><th>Role</th><th>What this chapter says</th></tr></thead><tbody>\n<tr><td>5</td><td>[[the_world_around_us-v-ch01</td><td>The World Around Us · Ch 1 Water — The Essence of Life]]</td><td>◐ extends</td><td>Water exists as liquid (rain), solid (ice) and vapour (steam); students watch droplets condense on a cold steel glass of ice, ice melt, water boil and water left in sunlight for three days disappear, recording that water changes form and can return to liquid.</td></tr>\n<tr><td>6</td><td>[[science-vi-ch08</td><td>Science · Ch 8 A Journey through States of Water]]</td><td>● introduces</td><td>Water exists as ice, liquid water and water vapour; evaporation (which goes on even at room temperature) and condensation, melting and freezing move it between these states, and evaporation is faster with more exposed surface, higher temperature, moving air and drier air.</td></tr>\n<tr><td>6</td><td>[[science-vi-ch07</td><td>Science · Ch 7 Temperature and its Measurement]]</td><td>○ uses</td><td>Boiling water and melting ice each hold a constant temperature, and students' readings of boiling water in Shillong come out slightly below 100 °C, raising the idea that the boiling point of water depends on altitude.</td></tr>\n<tr><td>6</td><td>[[science-vi-ch09</td><td>Science · Ch 9 Methods of Separation in Everyday Life]]</td><td>○ uses</td><td>Evaporation — a liquid turning into its vapour — is put to work to separate a dissolved solid from water, whether by sunlight and air over seawater in shallow pits or by boiling a salt solution away over a spirit lamp.</td></tr>\n<tr><td>7</td><td>[[science-vii-ch05</td><td>Science · Ch 5 Changes Around Us: Physical and Chemical]]</td><td>○ uses</td><td>Ice melting, water boiling or evaporating and wet clothes drying are physical changes — the water stays water in all three states — and they are reversible, since melted ice can be refrozen and evaporated water condensed, unlike burning wood or making popcorn.</td></tr>\n<tr><td>8</td><td>[[science-viii-ch07</td><td>Science · Ch 7 Particulate Nature of Matter]]</td><td>◐ extends</td><td>Ice, water and vapour are explained by particles: in ice they only vibrate in fixed positions, at the melting point (0 °C) they break free to move within a limited space, at the boiling point they escape as vapour with bubbles forming throughout the bulk, whereas evaporation happens only at the surface at any temperature — and water, unlike air, is practically incompressible.</td></tr>\n<tr><td>8</td><td>[[science-viii-ch09</td><td>Science · Ch 9 The Amazing World of Solutes, Solvents, and Solutions]]</td><td>◐ extends</td><td>Water is densest at 4 °C and expands as it freezes into ice at 0 °C, so ice is less dense than liquid water and floats — the anomalous behaviour of water.</td></tr>\n<tr><td>8</td><td>[[science-viii-ch13</td><td>Science · Ch 13 Our Home: Earth, a Unique Life Sustaining Planet]]</td><td>○ uses</td><td>Earth sits in the habitable (Goldilocks) zone where temperatures keep water liquid — closer to the Sun it would evaporate, farther away it would freeze — and the atmosphere's mild greenhouse effect is what holds that liquid range.</td></tr>\n<tr><td>9</td><td>[[science-ix-ch05</td><td>Science · Ch 5 Exploring Mixtures and their Separation]]</td><td>○ uses</td><td>Distillation exploits water's 100 °C boiling point — a lower-boiling liquid like acetone (56 °C) is boiled off first and condensed in a water-cooled condenser — and clouds of water droplets or ice crystals in air are posed as a colloid puzzle, with snowflakes and frost cited as natural crystals.</td></tr>\n<tr><td>9</td><td>[[social_sciences-ix-ch03</td><td>Social Sciences · Ch 3 Atmosphere and Climate]]</td><td>○ uses</td><td>Water vapour makes up only about 0.1 to 0.4 per cent of the atmosphere yet drives cloud formation, warmer air holds more of it, and precipitation is that vapour condensing out of saturated air as drizzle, rain, snow, sleet or hail.</td></tr>\n</tbody></table>\n<p><strong>Introduces</strong> (1): Class 6 Sci ch 8</p>\n<p><strong>Extends</strong> (3): Class 5 TWAU ch 1; Class 8 Sci ch 7; Class 8 Sci ch 9</p>\n<p><strong>Uses</strong> (6): Class 6 Sci ch 7; Class 6 Sci ch 9; Class 7 Sci ch 5; Class 8 Sci ch 13; Class 9 Sci ch 5; Class 9 SS ch 3</p>\n<h2>Joint-class candidates</h2>\n<p>Same class, different subjects, this one idea:</p>\n<ul>\n<li><strong>Class 9</strong> — <a href=\"#science-ix-ch05\" class=\"wl\">Science · Ch 5 Exploring Mixtures and their Separation</a> + <a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a></li>\n</ul>\n<h2>Related ideas</h2>\n<p>Ideas that most often appear in the same chapters: <a href=\"#water-cycle\" class=\"wl\">The water cycle</a> (4), <a href=\"#water-as-solvent\" class=\"wl\">Water as a solvent</a> (4), <a href=\"#rivers-and-landforms\" class=\"wl\">Rivers and landforms</a> (3), <a href=\"#water-and-life\" class=\"wl\">Water and life</a> (3).</p>"}, "water-cycle": {"title": "The water cycle", "crumb": "idea", "html": "<h1>The water cycle</h1>\n<p><em>Evaporation → clouds → precipitation → collection; the Sun as the driver; the cycle as a system.</em></p>\n<p>Part of the <a href=\"#Water\" class=\"wl\">Water</a> thread.</p>\n<p><strong>First taught:</strong> Class 3, <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a>.</p>\n<h2>The idea, class by class</h2>\n<table><thead><tr><th>Class</th><th>Subject · chapter</th><th>Role</th><th>What this chapter says</th></tr></thead><tbody>\n<tr><td>3</td><td>[[the_world_around_us-iii-ch07</td><td>The World Around Us · Ch 7 Water–A Precious Gift]]</td><td>● introduces</td><td>After rain falls it soaks into the soil, runs into streams and rivers, collects in puddles, ponds and lakes, or is stored underground as groundwater that feeds wells — the cycle grounded at a concrete, observable level without the formal 'water cycle' term.</td></tr>\n<tr><td>5</td><td>[[the_world_around_us-v-ch01</td><td>The World Around Us · Ch 1 Water — The Essence of Life]]</td><td>● introduces</td><td>The Sun's heat evaporates water from oceans and rivers, the vapour cools into clouds, and rain, snow and hail fall back into rivers, lakes and oceans in a continuous cycle, modelled with coloured water sealed in a transparent bag left in sunlight.</td></tr>\n<tr><td>6</td><td>[[science-vi-ch08</td><td>Science · Ch 8 A Journey through States of Water]]</td><td>● introduces</td><td>Water vapour rising from oceans, lakes and rivers cools and condenses around dust particles to form clouds, the droplets merge into drops heavy enough to fall as rain (or hail or snow), and the water collects again in oceans, lakes, rivers and groundwater — the water cycle.</td></tr>\n<tr><td>6</td><td>[[social_sciences-vi-ch02</td><td>Social Sciences · Ch 2 Oceans and Continents]]</td><td>○ uses</td><td>Oceans drive the water cycle by generating the rainfall that keeps continents from being deserts, which is why clouds forming over the ocean are the source of India's summer monsoon.</td></tr>\n<tr><td>7</td><td>[[science-vii-ch07</td><td>Science · Ch 7 Heat Transfer in Nature]]</td><td>◐ extends</td><td>Solar radiation drives evaporation from oceans, rivers and lakes and transpiration from plants, the rising vapour cools and condenses into clouds, and precipitation as rain, snow or hail returns water through soil, rocks and plants to the water bodies — with water present in nature as liquid, as snow, ice sheets and glaciers, and as vapour.</td></tr>\n<tr><td>7</td><td>[[social_sciences-vii-ch02</td><td>Social Sciences · Ch 2 Understanding the Weather]]</td><td>○ uses</td><td>The IMD's motto 'From the sun arises rain', taken from the Manusmṛiti's 'from the sun arises rain, from rain comes food, and from food, living beings originate', is presented as the ancient understanding of the sun's role in the water cycle.</td></tr>\n<tr><td>7</td><td>[[social_sciences-vii-ch03</td><td>Social Sciences · Ch 3 Climates of India]]</td><td>○ uses</td><td>Cooler, moisture-laden winds drawn in from the ocean condense their moisture over the heated land and drop it as heavy monsoon rain, and winds crossing the Bay of Bengal collect moisture again for east and south India — the ocean-to-rain leg of the water cycle.</td></tr>\n<tr><td>8</td><td>[[science-viii-ch13</td><td>Science · Ch 13 Our Home: Earth, a Unique Life Sustaining Planet]]</td><td>○ uses</td><td>Water vapour forms clouds that bring rain and snow, refilling rivers and lakes and deciding which plants and animals can live in a region — and cutting down a forest can change the rainfall.</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch08</td><td>Social Sciences · Ch 8 World Geography: Some Glimpses]]</td><td>○ uses</td><td>Oceans add moisture to the air that forms clouds and rainfall, which is how the distant Southern Indian Ocean influences the monsoon in the Gangetic Plains.</td></tr>\n<tr><td>9</td><td>[[science-ix-ch13</td><td>Science · Ch 13 Earth as a System: Energy, Matter, and Life]]</td><td>◐ extends</td><td>The water cycle now includes surface runoff back to the ocean and infiltration into soil and rock, where water dissolves and carries minerals, and it links all five spheres — so a warmer atmosphere holding more moisture brings heavier rains in some places and droughts in others, while intense rainfall erodes soil and cuts groundwater recharge.</td></tr>\n<tr><td>9</td><td>[[social_sciences-ix-ch03</td><td>Social Sciences · Ch 3 Atmosphere and Climate]]</td><td>○ uses</td><td>Most water vapour and clouds sit in the troposphere, and the monsoon winds carry moisture gathered over the Indian Ocean, Arabian Sea and Bay of Bengal onto the land as rain.</td></tr>\n</tbody></table>\n<p><strong>Introduces</strong> (3): Class 3 TWAU ch 7; Class 5 TWAU ch 1; Class 6 Sci ch 8</p>\n<p><strong>Extends</strong> (2): Class 7 Sci ch 7; Class 9 Sci ch 13</p>\n<p><strong>Uses</strong> (6): Class 6 SS ch 2; Class 7 SS ch 2; Class 7 SS ch 3; Class 8 Sci ch 13; Class 8 SS ch 8; Class 9 SS ch 3</p>\n<h2>Joint-class candidates</h2>\n<p>Same class, different subjects, this one idea:</p>\n<ul>\n<li><strong>Class 6</strong> — <a href=\"#science-vi-ch08\" class=\"wl\">Science · Ch 8 A Journey through States of Water</a> + <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a></li>\n<li><strong>Class 7</strong> — <a href=\"#science-vii-ch07\" class=\"wl\">Science · Ch 7 Heat Transfer in Nature</a> + <a href=\"#social_sciences-vii-ch02\" class=\"wl\">Social Sciences · Ch 2 Understanding the Weather</a> + <a href=\"#social_sciences-vii-ch03\" class=\"wl\">Social Sciences · Ch 3 Climates of India</a></li>\n<li><strong>Class 8</strong> — <a href=\"#science-viii-ch13\" class=\"wl\">Science · Ch 13 Our Home: Earth, a Unique Life Sustaining Planet</a> + <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a></li>\n<li><strong>Class 9</strong> — <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> + <a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a></li>\n</ul>\n<h2>Related ideas</h2>\n<p>Ideas that most often appear in the same chapters: <a href=\"#rain-and-monsoon\" class=\"wl\">Rain and the monsoon</a> (7), <a href=\"#oceans-and-water-bodies\" class=\"wl\">Oceans and water bodies</a> (6), <a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a> (6), <a href=\"#water-and-life\" class=\"wl\">Water and life</a> (6).</p>"}, "rain-and-monsoon": {"title": "Rain and the monsoon", "crumb": "idea", "html": "<h1>Rain and the monsoon</h1>\n<p><em>Rainfall, monsoon winds, seasons and climate patterns, humidity, weather measurement.</em></p>\n<p>Part of the <a href=\"#Water\" class=\"wl\">Water</a> thread.</p>\n<p><strong>First taught:</strong> Class 3, <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a>.</p>\n<h2>The idea, class by class</h2>\n<table><thead><tr><th>Class</th><th>Subject · chapter</th><th>Role</th><th>What this chapter says</th></tr></thead><tbody>\n<tr><td>3</td><td>[[the_world_around_us-iii-ch07</td><td>The World Around Us · Ch 7 Water–A Precious Gift]]</td><td>● introduces</td><td>Rain is met by direct observation: children read sky and nature clues to predict whether it will rain, then watch a shower and describe its heaviness, drop size, speed and slant, and collect rainwater to see whether it looks clean or dirty.</td></tr>\n<tr><td>4</td><td>[[the_world_around_us-iv-ch09</td><td>The World Around Us · Ch 9 Different Lands, Different Lives]]</td><td>○ uses</td><td>Rainfall differs across landforms and shapes how people live: deserts get very little rain, Sikkim's heavy rain calls for wooden houses with slanting roofs, the rainy season brings landslides in the mountains, and coastal Odisha faces cyclones.</td></tr>\n<tr><td>5</td><td>[[the_world_around_us-v-ch02</td><td>The World Around Us · Ch 2 Journey of a River]]</td><td>○ uses</td><td>Rainfall governs a river's year: seasonal rivers flow only in the rainy season, excessive rain makes rivers overflow their banks, and dams hold water back for the dry season.</td></tr>\n<tr><td>6</td><td>[[science-vi-ch07</td><td>Science · Ch 7 Temperature and its Measurement]]</td><td>● introduces</td><td>Air temperature is a weather measurement: weather services record each day's maximum and minimum air temperature, which rises towards summer and falls in winter and is used in forecasting (this node is weather measurement only, with no water content — recorded because the vocabulary lists weather measurement here).</td></tr>\n<tr><td>6</td><td>[[science-vi-ch08</td><td>Science · Ch 8 A Journey through States of Water]]</td><td>● introduces</td><td>Humidity is the measure of water vapour in the air; on rainy, humid days evaporation is slower and clothes dry slowly, and rain is what falls when cloud droplets grow heavy.</td></tr>\n<tr><td>6</td><td>[[social_sciences-vi-ch02</td><td>Social Sciences · Ch 2 Oceans and Continents]]</td><td>○ uses</td><td>India's summer monsoon rains originate over the ocean, and the same oceans generate cyclones — violent storms with extreme rainfall and strong winds that damage coastal regions.</td></tr>\n<tr><td>6</td><td>[[social_sciences-vi-ch03</td><td>Social Sciences · Ch 3 Landforms and Life]]</td><td>○ uses</td><td>Precipitation is defined as water reaching the ground as rain, snow or hail, deserts are the landform that receives very little of it, and cloudbursts, flash floods and heavy snowfall are among the hazards of mountain life.</td></tr>\n<tr><td>6</td><td>[[social_sciences-vi-ch06</td><td>Social Sciences · Ch 6 The Beginnings of Indian Civilisation]]</td><td>○ uses</td><td>A global climatic change from about 2200 BCE reduced rainfall and made farming harder, which together with the drying of the Sarasvatī in its central basin led to the abandonment of cities such as Kalibangan and Banawali.</td></tr>\n<tr><td>7</td><td>[[social_sciences-vii-ch02</td><td>Social Sciences · Ch 2 Understanding the Weather]]</td><td>● introduces</td><td>Precipitation (rain, snow, sleet or hail) is measured with a rain gauge whose scale reads rainfall in millimetres, humidity — the water vapour in the air — is measured by a hygrometer as relative humidity from dry (20–40%) to humid (60–80%), and these readings, alongside traditional signs such as ants moving eggs or frogs croaking, feed forecasts of rain, of the monsoon's arrival and IMD colour-coded heavy-rain warnings.</td></tr>\n<tr><td>7</td><td>[[social_sciences-vii-ch03</td><td>Social Sciences · Ch 3 Climates of India]]</td><td>◐ extends</td><td>The monsoon is a seasonal wind reversal — in summer the heated Asian landmass forms a low that draws moisture-laden ocean winds inland to drop heavy rain (the south-west monsoon advancing from early June to cover India by mid-July, the Western Ghats leaving the Deccan in a rain shadow, Mawsynram receiving about 11,000 mm a year), while in winter dry winds blow from land to sea except where the north-east monsoon gathers Bay of Bengal moisture for the east and south — and a failed monsoon means scarcity, higher food prices and migration.</td></tr>\n<tr><td>7</td><td>[[social_sciences-vii-ch01</td><td>Social Sciences · Ch 1 Geographical Diversity of India]]</td><td>○ uses</td><td>Rainfall varies from extremely scarce in the cold desert of Ladakh to among the highest in the world in the Garo, Khasi and Jaintia Hills of Meghalaya.</td></tr>\n<tr><td>8</td><td>[[science-viii-ch06</td><td>Science · Ch 6 Pressure, Winds, Storms, and Cyclones]]</td><td>◐ extends</td><td>Storms form when warm moist air rises, expands and cools so its water vapour condenses into clouds and the droplets merge to fall as rain, hail or snow; ice particles and droplets rubbing inside the cloud build the charges that discharge as lightning in a thunderstorm (Kalboishakhi, Bordoisila and mango showers are pre-monsoon examples), and cyclones bring intense winds and heavy rainfall around a calm eye.</td></tr>\n<tr><td>9</td><td>[[science-ix-ch13</td><td>Science · Ch 13 Earth as a System: Energy, Matter, and Life]]</td><td>◐ extends</td><td>Nearly all weather happens in the troposphere, and the monsoon is now treated as climate-sensitive: warmer Arabian Sea water intensifies the southwest monsoon, deforestation lowers local rainfall, and IITM Pune's coupled atmosphere–ocean–land–ice models forecast how warming may alter monsoon rainfall.</td></tr>\n<tr><td>9</td><td>[[social_sciences-ix-ch03</td><td>Social Sciences · Ch 3 Atmosphere and Climate]]</td><td>◐ extends</td><td>Precipitation falls when saturated air condenses, shaped by prevailing winds, mountains and seasons; India's tropical monsoon climate has four IMD seasons, and the monsoon is a wind reversal — the south-west monsoon (June–September), drawn in by a low over the fast-heating landmass, brings most of India's rain, while the north-east monsoon (October–February) blows seaward and rains mainly on the south-east coast after crossing the Bay of Bengal — mapped by normal dates of advance and retreat, vital to farming, water supply and festivals, and studied by the National Monsoon Mission.</td></tr>\n<tr><td>9</td><td>[[social_sciences-ix-ch02</td><td>Social Sciences · Ch 2 Shaping of the Earth's Surface]]</td><td>○ uses</td><td>Heavy continuous rainfall adds weight and reduces friction on slopes to trigger landslides and fills glacial lakes before outbursts, while prolonged drought and low rainfall leave loose dry soil for dust storms.</td></tr>\n</tbody></table>\n<p><strong>Introduces</strong> (4): Class 3 TWAU ch 7; Class 6 Sci ch 7; Class 6 Sci ch 8; Class 7 SS ch 2</p>\n<p><strong>Extends</strong> (4): Class 7 SS ch 3; Class 8 Sci ch 6; Class 9 Sci ch 13; Class 9 SS ch 3</p>\n<p><strong>Uses</strong> (7): Class 4 TWAU ch 9; Class 5 TWAU ch 2; Class 6 SS ch 2; Class 6 SS ch 3; Class 6 SS ch 6; Class 7 SS ch 1; Class 9 SS ch 2</p>\n<h2>Joint-class candidates</h2>\n<p>Same class, different subjects, this one idea:</p>\n<ul>\n<li><strong>Class 6</strong> — <a href=\"#science-vi-ch07\" class=\"wl\">Science · Ch 7 Temperature and its Measurement</a> + <a href=\"#science-vi-ch08\" class=\"wl\">Science · Ch 8 A Journey through States of Water</a> + <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a> + <a href=\"#social_sciences-vi-ch03\" class=\"wl\">Social Sciences · Ch 3 Landforms and Life</a> + <a href=\"#social_sciences-vi-ch06\" class=\"wl\">Social Sciences · Ch 6 The Beginnings of Indian Civilisation</a></li>\n<li><strong>Class 9</strong> — <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> + <a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a> + <a href=\"#social_sciences-ix-ch02\" class=\"wl\">Social Sciences · Ch 2 Shaping of the Earth's Surface</a></li>\n</ul>\n<h2>Related ideas</h2>\n<p>Ideas that most often appear in the same chapters: <a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a> (10), <a href=\"#rivers-and-landforms\" class=\"wl\">Rivers and landforms</a> (8), <a href=\"#water-cycle\" class=\"wl\">The water cycle</a> (7), <a href=\"#oceans-and-water-bodies\" class=\"wl\">Oceans and water bodies</a> (7).</p>"}, "rivers-and-landforms": {"title": "Rivers and landforms", "crumb": "idea", "html": "<h1>Rivers and landforms</h1>\n<p><em>Rivers from source to sea, erosion and deposition, valleys, deltas, floods, glaciers.</em></p>\n<p>Part of the <a href=\"#Water\" class=\"wl\">Water</a> thread.</p>\n<p><strong>First taught:</strong> Class 5, <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a>.</p>\n<h2>The idea, class by class</h2>\n<table><thead><tr><th>Class</th><th>Subject · chapter</th><th>Role</th><th>What this chapter says</th></tr></thead><tbody>\n<tr><td>5</td><td>[[the_world_around_us-v-ch01</td><td>The World Around Us · Ch 1 Water — The Essence of Life]]</td><td>● introduces</td><td>Rivers begin in mountains and flow downhill with their path and speed shaped by the land they cross (and flowing water reshapes land over time), modelled with mustard seeds on crumpled paper and traced on a map of India's rivers, including the Luni that ends in the Rann of Kutch without reaching a sea.</td></tr>\n<tr><td>5</td><td>[[the_world_around_us-v-ch02</td><td>The World Around Us · Ch 2 Journey of a River]]</td><td>◐ extends</td><td>One river is followed source to sea: the Godavari rises as a stream at Trimbakeshwar in the Western Ghats, gathers tributaries over 1,465 km, flows year-round (perennial, unlike seasonal rivers), spreads into a delta where freshwater meets the sea at the Coringa mangroves, and overflows its banks in floods when rain is excessive — worse where forests have been cut.</td></tr>\n<tr><td>6</td><td>[[social_sciences-vi-ch03</td><td>Social Sciences · Ch 3 Landforms and Life]]</td><td>● introduces</td><td>Snow melting on mountains feeds rivers such as the 2,500 km Ganga with its Himalayan tributaries, rivers plunge off plateau edges as waterfalls (Jog, Hundru, Nohkalikai, Victoria), and rivers rising in mountains carry rock, sand and silt down to deposit them as the fertile soils of floodplains.</td></tr>\n<tr><td>6</td><td>[[social_sciences-vi-ch06</td><td>Social Sciences · Ch 6 The Beginnings of Indian Civilisation]]</td><td>○ uses</td><td>Settlements were placed along rivers both for water and for the fertile soil rivers create, and the Sarasvatī — today the seasonal Ghaggar in India and Hakra in Pakistan — is a river that later texts describe drying up and disappearing.</td></tr>\n<tr><td>7</td><td>[[science-vii-ch05</td><td>Science · Ch 5 Changes Around Us: Physical and Chemical]]</td><td>● introduces</td><td>Rocks break into sediments by weathering — water freezing in cracks, temperature swings, growing roots, and water with dissolved chemicals reacting with rock surfaces — and flowing water and wind then carry the sediments away (erosion) to settle in water bodies where, over thousands of years, they harden into new rock.</td></tr>\n<tr><td>7</td><td>[[social_sciences-vii-ch01</td><td>Social Sciences · Ch 1 Geographical Diversity of India]]</td><td>◐ extends</td><td>Summer snow-melt from the Himalayas — the Bhagirathi rising at Gaumukh from the Gangotri Glacier — feeds the Ganga, Indus and Brahmaputra whose mineral-laden waters build the fertile Gangetic plains, the eastward tilt of the peninsular plateau sends the Godavari, Krishna, Kaveri and Mahanadi to the Bay of Bengal as wide fertile deltas while the Narmada and Tapti flow west into estuaries, and the Ganga–Brahmaputra delta forms the mangrove Sundarbans.</td></tr>\n<tr><td>7</td><td>[[social_sciences-vii-ch03</td><td>Social Sciences · Ch 3 Climates of India]]</td><td>○ uses</td><td>Floods occur when heavy rain, river-bank breaches or bursting glacial lakes send water over normally dry land — as in the 2013 Kedarnath disaster — and urban flooding is worsened by poor drainage, encroached waterways and impermeable concrete.</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch08</td><td>Social Sciences · Ch 8 World Geography: Some Glimpses]]</td><td>○ uses</td><td>Mountains act as 'water towers' — the Tibetan 'Third Pole' sources the Indus, Brahmaputra and Yangtze and its snow-melt is now expanding lakes, the Alps feed the Rhine and Danube, the Andes feed the Amazon (the largest river by volume) — while plains such as the European Plain are built by sediment deposition and the Colorado Plateau's Grand Canyon is cut by erosion.</td></tr>\n<tr><td>9</td><td>[[social_sciences-ix-ch02</td><td>Social Sciences · Ch 2 Shaping of the Earth's Surface]]</td><td>◐ extends</td><td>A river shapes land differently along its course — V-shaped valleys, waterfalls and rapids where hard rock resists in the upper course, meanders and oxbow lakes from outer-bank erosion and inner-bank deposition in the middle, deltas, levees and alluvial fans where it meets the sea — while glaciers carve U-shaped valleys, cirques and fjords, leave moraines that dam lakes, and can unleash Glacial Lake Outburst Floods when their ice or moraine dams fail.</td></tr>\n<tr><td>9</td><td>[[science-ix-ch13</td><td>Science · Ch 13 Earth as a System: Energy, Matter, and Life]]</td><td>○ uses</td><td>Melting glaciers add water to rivers and raise sea levels that threaten coastal cities such as Mumbai and Chennai, and intense rainfall runoff erodes soil.</td></tr>\n<tr><td>9</td><td>[[social_sciences-ix-ch03</td><td>Social Sciences · Ch 3 Atmosphere and Climate]]</td><td>○ uses</td><td>The 2025 Punjab floods came from heavy monsoon rain swelling the Satluj, Beas, Ravi and Ghaggar in succession, made worse by weak old embankments (dhūsī bāndh), building too close to rivers, silt reducing river and dam capacity and late warnings — and climate change is making floods, droughts, glacier melt and sea-level rise more frequent.</td></tr>\n</tbody></table>\n<p><strong>Introduces</strong> (3): Class 5 TWAU ch 1; Class 6 SS ch 3; Class 7 Sci ch 5</p>\n<p><strong>Extends</strong> (3): Class 5 TWAU ch 2; Class 7 SS ch 1; Class 9 SS ch 2</p>\n<p><strong>Uses</strong> (5): Class 6 SS ch 6; Class 7 SS ch 3; Class 8 SS ch 8; Class 9 Sci ch 13; Class 9 SS ch 3</p>\n<h2>Joint-class candidates</h2>\n<p>Same class, different subjects, this one idea:</p>\n<ul>\n<li><strong>Class 7</strong> — <a href=\"#science-vii-ch05\" class=\"wl\">Science · Ch 5 Changes Around Us: Physical and Chemical</a> + <a href=\"#social_sciences-vii-ch01\" class=\"wl\">Social Sciences · Ch 1 Geographical Diversity of India</a> + <a href=\"#social_sciences-vii-ch03\" class=\"wl\">Social Sciences · Ch 3 Climates of India</a></li>\n<li><strong>Class 9</strong> — <a href=\"#social_sciences-ix-ch02\" class=\"wl\">Social Sciences · Ch 2 Shaping of the Earth's Surface</a> + <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> + <a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a></li>\n</ul>\n<h2>Related ideas</h2>\n<p>Ideas that most often appear in the same chapters: <a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a> (8), <a href=\"#rain-and-monsoon\" class=\"wl\">Rain and the monsoon</a> (8), <a href=\"#water-in-society\" class=\"wl\">Water in society</a> (6), <a href=\"#oceans-and-water-bodies\" class=\"wl\">Oceans and water bodies</a> (5).</p>"}, "oceans-and-water-bodies": {"title": "Oceans and water bodies", "crumb": "idea", "html": "<h1>Oceans and water bodies</h1>\n<p><em>Oceans, seas, lakes, ponds; how water is distributed on Earth; tides and currents.</em></p>\n<p>Part of the <a href=\"#Water\" class=\"wl\">Water</a> thread.</p>\n<p><strong>First taught:</strong> Class 3, <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a>.</p>\n<h2>The idea, class by class</h2>\n<table><thead><tr><th>Class</th><th>Subject · chapter</th><th>Role</th><th>What this chapter says</th></tr></thead><tbody>\n<tr><td>3</td><td>[[the_world_around_us-iii-ch07</td><td>The World Around Us · Ch 7 Water–A Precious Gift]]</td><td>● introduces</td><td>Streams, rivers, ponds and lakes are the local water bodies where rainwater collects, and students find one near their village or city, visit and draw it, and record whether its water is (or was) used for drinking.</td></tr>\n<tr><td>4</td><td>[[the_world_around_us-iv-ch09</td><td>The World Around Us · Ch 9 Different Lands, Different Lives]]</td><td>○ uses</td><td>The sea defines the coastal landform: Odisha's coast has beaches, fishing as the main livelihood, sand art and conch shells, and students compare life by the sea with life in the desert and discuss why beaches must be kept clean.</td></tr>\n<tr><td>5</td><td>[[the_world_around_us-v-ch01</td><td>The World Around Us · Ch 1 Water — The Essence of Life]]</td><td>● introduces</td><td>Most of Earth's surface is covered by water but nearly all of it is salty ocean water unfit for drinking or farming; freshwater is only a tiny fraction (a teaspoon in a glass) held in rivers, ponds, lakes and underground, and India's rivers drain either to the Bay of Bengal or the Arabian Sea.</td></tr>\n<tr><td>6</td><td>[[science-vi-ch11</td><td>Science · Ch 11 Nature's Treasures]]</td><td>● introduces</td><td>Water covers about two-thirds of the Earth's surface, but most of it lies in oceans and seas as saline water, with freshwater held in ice sheets and snow, rivers, lakes, ponds, wells and underground sources.</td></tr>\n<tr><td>6</td><td>[[social_sciences-vi-ch02</td><td>Social Sciences · Ch 2 Oceans and Continents]]</td><td>● introduces</td><td>Water covers almost three-fourths of the Earth, mostly as five named but continuously connected oceans (Pacific the largest, Arctic the smallest) whose seas, bays and gulfs are parts of one global body, the Southern Hemisphere is mostly water, and freshwater is only a small share found in glaciers, rivers, lakes, the atmosphere and underground.</td></tr>\n<tr><td>7</td><td>[[social_sciences-vii-ch01</td><td>Social Sciences · Ch 1 Geographical Diversity of India]]</td><td>○ uses</td><td>The Arabian Sea, Indian Ocean and Bay of Bengal bound the subcontinent and hold its two island groups, and India's inland water bodies range from Ladakh's saltwater Pangong Tso to the east-coast Chilika Lake and Pulicat lagoon.</td></tr>\n<tr><td>8</td><td>[[science-viii-ch13</td><td>Science · Ch 13 Our Home: Earth, a Unique Life Sustaining Planet]]</td><td>◐ extends</td><td>Water covering about 70 per cent of Earth's surface — ponds, rivers, seas, oceans and groundwater — forms the hydrosphere, which is why Earth looks like the Blue Planet from space, and melting ice caps now raise sea levels that flood coastal areas.</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch08</td><td>Social Sciences · Ch 8 World Geography: Some Glimpses]]</td><td>◐ extends</td><td>The ocean covers about 71 per cent of the Earth and holds 97 per cent of its water over a floor of mountains, valleys and trenches (the Mariana's Challenger Deep over 11,000 m down); the five oceans are revisited with their distinct features, ocean currents run like giant rivers carrying warm water poleward and cold water toward the equator, seas, gulfs, bays, straits and canals are classified by shape and trade role, and the Great Lakes are a chain of five massive freshwater lakes.</td></tr>\n<tr><td>8</td><td>[[science-viii-ch06</td><td>Science · Ch 6 Pressure, Winds, Storms, and Cyclones]]</td><td>○ uses</td><td>A cyclone is powered by warm ocean water — rising moist air condenses and releases latent heat that deepens the low pressure — weakens once it reaches land and loses its moist air, and drives storm surges of 3–12 metres that flood coasts and contaminate drinking water with seawater.</td></tr>\n<tr><td>9</td><td>[[science-ix-ch13</td><td>Science · Ch 13 Earth as a System: Energy, Matter, and Life]]</td><td>◐ extends</td><td>Surface water and groundwater form the hydrosphere and ice and snow the cryosphere; ocean currents driven by planetary winds, temperature and salinity differences, Earth's rotation and the continents form gyres that carry heat poleward (the North Atlantic Drift keeps European ports ice-free) and nutrients to marine life, and the ocean holds 71% of global carbon, acidifying as it warms.</td></tr>\n<tr><td>9</td><td>[[social_sciences-ix-ch02</td><td>Social Sciences · Ch 2 Shaping of the Earth's Surface]]</td><td>○ uses</td><td>Sea waves and currents are agents of gradation that undercut headlands into cliffs, wave-cut platforms, caves, arches and stacks and deposit beaches and sand bars that shield settlements from coastal erosion.</td></tr>\n</tbody></table>\n<p><strong>Introduces</strong> (4): Class 3 TWAU ch 7; Class 5 TWAU ch 1; Class 6 Sci ch 11; Class 6 SS ch 2</p>\n<p><strong>Extends</strong> (3): Class 8 Sci ch 13; Class 8 SS ch 8; Class 9 Sci ch 13</p>\n<p><strong>Uses</strong> (4): Class 4 TWAU ch 9; Class 7 SS ch 1; Class 8 Sci ch 6; Class 9 SS ch 2</p>\n<h2>Joint-class candidates</h2>\n<p>Same class, different subjects, this one idea:</p>\n<ul>\n<li><strong>Class 6</strong> — <a href=\"#science-vi-ch11\" class=\"wl\">Science · Ch 11 Nature's Treasures</a> + <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a></li>\n<li><strong>Class 8</strong> — <a href=\"#science-viii-ch13\" class=\"wl\">Science · Ch 13 Our Home: Earth, a Unique Life Sustaining Planet</a> + <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> + <a href=\"#science-viii-ch06\" class=\"wl\">Science · Ch 6 Pressure, Winds, Storms, and Cyclones</a></li>\n<li><strong>Class 9</strong> — <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> + <a href=\"#social_sciences-ix-ch02\" class=\"wl\">Social Sciences · Ch 2 Shaping of the Earth's Surface</a></li>\n</ul>\n<h2>Related ideas</h2>\n<p>Ideas that most often appear in the same chapters: <a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a> (8), <a href=\"#rain-and-monsoon\" class=\"wl\">Rain and the monsoon</a> (7), <a href=\"#water-and-life\" class=\"wl\">Water and life</a> (7), <a href=\"#water-cycle\" class=\"wl\">The water cycle</a> (6).</p>"}, "water-as-resource": {"title": "Water as a resource", "crumb": "idea", "html": "<h1>Water as a resource</h1>\n<p><em>Sources, scarcity, conservation, rainwater harvesting, wells, tanks, dams, irrigation, supply.</em></p>\n<p>Part of the <a href=\"#Water\" class=\"wl\">Water</a> thread.</p>\n<p><strong>First taught:</strong> Class 3, <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a>.</p>\n<h2>The idea, class by class</h2>\n<table><thead><tr><th>Class</th><th>Subject · chapter</th><th>Role</th><th>What this chapter says</th></tr></thead><tbody>\n<tr><td>3</td><td>[[the_world_around_us-iii-ch07</td><td>The World Around Us · Ch 7 Water–A Precious Gift]]</td><td>● introduces</td><td>Tap water comes from rooftop tanks, pipes, wells, borewells or tankers; many people must carry water from a distant well, river or lake; households store water against irregular supply; and water is precious, so it must not be wasted or polluted.</td></tr>\n<tr><td>4</td><td>[[mathematics-iv-ch08</td><td>Mathematics · Ch 8 Weigh It, Pour It]]</td><td>○ uses</td><td>Students count the litres of water they drink and use each day for showering, washing clothes and watering crops, and collect the drip from a leaking tap for an hour to work out how much water is wasted in a day and a week.</td></tr>\n<tr><td>4</td><td>[[the_world_around_us-iv-ch09</td><td>The World Around Us · Ch 9 Different Lands, Different Lives]]</td><td>○ uses</td><td>Water is scarce in the desert, so plants like cactus, khejri and babool survive by storing water and desert houses keep tankas (water tanks) for storage; students discuss why deserts are short of water.</td></tr>\n<tr><td>5</td><td>[[the_world_around_us-v-ch01</td><td>The World Around Us · Ch 1 Water — The Essence of Life]]</td><td>● introduces</td><td>Rainwater percolates through soil and rock to become groundwater drawn up by wells, borewells, tube wells and handpumps; paved city surfaces block recharge while open ground, soak pits, ponds and trees restore it, and students design a house or school that conserves water.</td></tr>\n<tr><td>5</td><td>[[the_world_around_us-v-ch02</td><td>The World Around Us · Ch 2 Journey of a River]]</td><td>◐ extends</td><td>A river supplies water for drinking, cooking, washing, irrigation and industry through pipes and canals; India's 900-plus dams store river water for dry seasons, irrigation and electricity at the cost of flooding land and displacing people; and drought (Chennai 2019) forces migration and calls for conservation habits, the National Water Mission and water ATMs.</td></tr>\n<tr><td>5</td><td>[[the_world_around_us-v-ch04</td><td>The World Around Us · Ch 4 Our School—A Happy Place]]</td><td>◐ extends</td><td>A dripping tap wastes far more water than it seems — students time how long a drip takes to fill a glass and scale it up to a day — and a green school fixes leaks, prevents wastage and collects rainwater, in the spirit of the Jal Shakti Abhiyan.</td></tr>\n<tr><td>5</td><td>[[english-v-ch06</td><td>English · Ch 6 What a Tank!]]</td><td>○ uses</td><td>Water has been stored for centuries in structures like Tamil Nadu's ooranis for rainwater harvesting, Kerala's year-round Panam Keni wells and Rajasthan's underground tankas, and today in household overhead tanks — and children list how water is wasted daily, how to stop it, and hear how a day without supply led a family to set up rainwater harvesting at home.</td></tr>\n<tr><td>5</td><td>[[english-v-ch08</td><td>English · Ch 8 The Decision of the Panchayat]]</td><td>○ uses</td><td>A farmer buys the well beside his new field because the well is the field's source of water, and the chapter states outright that water is priceless — so valuable that no price can be put on it.</td></tr>\n<tr><td>5</td><td>[[the_world_around_us-v-ch07</td><td>The World Around Us · Ch 7 Energy—How Things Work]]</td><td>○ uses</td><td>Flowing water is a clean energy source: fast-moving rivers generate electricity and traditional gharaats (watermills) in hilly areas grind grain, modelled with a paper-cup water wheel that turns when water is poured on it — placed under the nearest id, since hydropower is not in the vocabulary.</td></tr>\n<tr><td>6</td><td>[[science-vi-ch11</td><td>Science · Ch 11 Nature's Treasures]]</td><td>● introduces</td><td>Water is a precious resource because most of it is saline and only a very small fraction of freshwater is easily accessible, so wastage in hand washing, cooking and gardening should be cut by turning off taps, fixing leaks, recycling water and harvesting rainwater — access is unequal across India, and water counts as a renewable resource only when used judiciously.</td></tr>\n<tr><td>6</td><td>[[science-vi-ch08</td><td>Science · Ch 8 A Journey through States of Water]]</td><td>○ uses</td><td>Only a small fraction of Earth's water is available to living things, the rest lying in the oceans, so water must be used wisely and water bodies kept free of pollution; an Atmospheric Water Generator can even harvest water by condensing humid air.</td></tr>\n<tr><td>6</td><td>[[social_sciences-vi-ch03</td><td>Social Sciences · Ch 3 Landforms and Life]]</td><td>○ uses</td><td>Farming on the Ganga plain, once rainfed, now depends heavily on irrigation from canals and groundwater, which has raised production but depleted groundwater — a challenge for the future.</td></tr>\n<tr><td>6</td><td>[[social_sciences-vi-ch06</td><td>Social Sciences · Ch 6 The Beginnings of Indian Civilisation]]</td><td>○ uses</td><td>Harappans drew water from brick-lined wells, ponds and streams, and where these were lacking built human-made reservoirs that harvested and distributed water — an infrastructure that needed organised administration to build and maintain.</td></tr>\n<tr><td>7</td><td>[[science-vii-ch07</td><td>Science · Ch 7 Heat Transfer in Nature]]</td><td>◐ extends</td><td>Rain seeps into the ground fastest through gravel and slowest through clay (infiltration) to become groundwater held in aquifers that wells and bore wells tap, and since over-extraction and urban concrete are depleting it, rainwater harvesting and recharge pits are needed — Ladakh's ice stupas store winter stream water as ice to release for farming in summer.</td></tr>\n<tr><td>7</td><td>[[social_sciences-vii-ch01</td><td>Social Sciences · Ch 1 Geographical Diversity of India]]</td><td>◐ extends</td><td>The Himalayas are the 'Water Tower of Asia' whose rivers supply drinking, farming and industrial water to hundreds of millions, while in the water-scarce Thar people conserve rain with traditional taanka or kund rainwater-harvesting systems.</td></tr>\n<tr><td>7</td><td>[[social_sciences-vii-ch03</td><td>Social Sciences · Ch 3 Climates of India]]</td><td>○ uses</td><td>The arid Thar demands unique water conservation practices, and a failed monsoon brings water scarcity that hurts farming and the industries that depend on predictable water availability.</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch01</td><td>Social Sciences · Ch 1 Natural Resources and Their Use]]</td><td>◐ extends</td><td>Water is a renewable resource only while Nature's rhythm of restoration is not disturbed: farmers across India pump groundwater for irrigation faster than it recharges so water tables fall, Punjab's Green Revolution crops and free electricity have left almost 80 per cent of its area 'overexploited' with groundwater beyond about 30 metres, Himalayan glaciers melt faster than precipitation replaces them, and the remedies are water harvesting, pond rejuvenation and reduced consumption.</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch14</td><td>Social Sciences · Ch 14 India's Urban Landscape]]</td><td>◐ extends</td><td>Bengaluru suffers summer water shortages and monsoon flooding because of poor planning, groundwater overuse, no rainwater harvesting and encroached lake beds — its roughly 1,000 lakes reduced to about 200 — and non-profits, resident associations and communities have revived lakes such as Yelahanka by desilting, repairing bunds, clearing drainage channels and replanting, increasing water availability.</td></tr>\n<tr><td>8</td><td>[[science-viii-ch06</td><td>Science · Ch 6 Pressure, Winds, Storms, and Cyclones]]</td><td>○ uses</td><td>Overhead water tanks are placed high to supply good pressure and dam bases are built broader than their tops to withstand the large sideways water pressure near the bottom, because liquid pressure depends on the height of the water column and acts in all directions (liquid pressure itself has no id; placed under the nearest).</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch08</td><td>Social Sciences · Ch 8 World Geography: Some Glimpses]]</td><td>○ uses</td><td>Rivers, mountains and lakes are freshwater suppliers — the Nile's irrigation, drinking water and hydropower, the Alps' drinking water, irrigation and hydroelectricity, the Andes as a source for millions, the Great Lakes' city water now facing chemical contamination — while desert life clusters at Sahara oases and Gobi pastures fed by underground water.</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch10</td><td>Social Sciences · Ch 10 A Journey Through Indian Architecture]]</td><td>○ uses</td><td>Because India's monsoon delivers water seasonally, people over millennia built structures to harvest, store and distribute it — from the village pond to the Grand Anicut — suited to each region's geology and climate, and many now suffer from depleted sources, poor maintenance, pollution and waste dumping that environmentalists, locals and NGOs work to reverse.</td></tr>\n<tr><td>9</td><td>[[social_sciences-ix-ch02</td><td>Social Sciences · Ch 2 Shaping of the Earth's Surface]]</td><td>○ uses</td><td>Rivers, glaciers and groundwater are used as well as feared: the Grand Anicut (Kallanai) in Tamil Nadu shows rivers harnessed for irrigation, moraine-dammed lakes give water supply, irrigation and hydropower, karst provides fresh water, the Sindhu-Sarasvatī people used contouring, bunding, terracing, dams and canals, and Nagaland's Zabo system of earthen bunds and check dams conserves soil and water and recharges groundwater.</td></tr>\n</tbody></table>\n<p><strong>Introduces</strong> (3): Class 3 TWAU ch 7; Class 5 TWAU ch 1; Class 6 Sci ch 11</p>\n<p><strong>Extends</strong> (6): Class 5 TWAU ch 2; Class 5 TWAU ch 4; Class 7 Sci ch 7; Class 7 SS ch 1; Class 8 SS ch 1; Class 8 SS ch 14</p>\n<p><strong>Uses</strong> (13): Class 4 Maths ch 8; Class 4 TWAU ch 9; Class 5 Eng ch 6; Class 5 Eng ch 8; Class 5 TWAU ch 7; Class 6 Sci ch 8; Class 6 SS ch 3; Class 6 SS ch 6; Class 7 SS ch 3; Class 8 Sci ch 6; Class 8 SS ch 8; Class 8 SS ch 10; Class 9 SS ch 2</p>\n<h2>Joint-class candidates</h2>\n<p>Same class, different subjects, this one idea:</p>\n<ul>\n<li><strong>Class 4</strong> — <a href=\"#mathematics-iv-ch08\" class=\"wl\">Mathematics · Ch 8 Weigh It, Pour It</a> + <a href=\"#the_world_around_us-iv-ch09\" class=\"wl\">The World Around Us · Ch 9 Different Lands, Different Lives</a></li>\n<li><strong>Class 5</strong> — <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a> + <a href=\"#the_world_around_us-v-ch02\" class=\"wl\">The World Around Us · Ch 2 Journey of a River</a> + <a href=\"#the_world_around_us-v-ch04\" class=\"wl\">The World Around Us · Ch 4 Our School—A Happy Place</a> + <a href=\"#english-v-ch06\" class=\"wl\">English · Ch 6 What a Tank!</a> + <a href=\"#english-v-ch08\" class=\"wl\">English · Ch 8 The Decision of the Panchayat</a> + <a href=\"#the_world_around_us-v-ch07\" class=\"wl\">The World Around Us · Ch 7 Energy—How Things Work</a></li>\n<li><strong>Class 6</strong> — <a href=\"#science-vi-ch11\" class=\"wl\">Science · Ch 11 Nature's Treasures</a> + <a href=\"#science-vi-ch08\" class=\"wl\">Science · Ch 8 A Journey through States of Water</a> + <a href=\"#social_sciences-vi-ch03\" class=\"wl\">Social Sciences · Ch 3 Landforms and Life</a> + <a href=\"#social_sciences-vi-ch06\" class=\"wl\">Social Sciences · Ch 6 The Beginnings of Indian Civilisation</a></li>\n<li><strong>Class 7</strong> — <a href=\"#science-vii-ch07\" class=\"wl\">Science · Ch 7 Heat Transfer in Nature</a> + <a href=\"#social_sciences-vii-ch01\" class=\"wl\">Social Sciences · Ch 1 Geographical Diversity of India</a> + <a href=\"#social_sciences-vii-ch03\" class=\"wl\">Social Sciences · Ch 3 Climates of India</a></li>\n<li><strong>Class 8</strong> — <a href=\"#social_sciences-viii-ch01\" class=\"wl\">Social Sciences · Ch 1 Natural Resources and Their Use</a> + <a href=\"#social_sciences-viii-ch14\" class=\"wl\">Social Sciences · Ch 14 India's Urban Landscape</a> + <a href=\"#science-viii-ch06\" class=\"wl\">Science · Ch 6 Pressure, Winds, Storms, and Cyclones</a> + <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> + <a href=\"#social_sciences-viii-ch10\" class=\"wl\">Social Sciences · Ch 10 A Journey Through Indian Architecture</a></li>\n</ul>\n<h2>Related ideas</h2>\n<p>Ideas that most often appear in the same chapters: <a href=\"#water-in-society\" class=\"wl\">Water in society</a> (13), <a href=\"#rain-and-monsoon\" class=\"wl\">Rain and the monsoon</a> (10), <a href=\"#oceans-and-water-bodies\" class=\"wl\">Oceans and water bodies</a> (8), <a href=\"#water-and-life\" class=\"wl\">Water and life</a> (8).</p>"}, "water-and-life": {"title": "Water and life", "crumb": "idea", "html": "<h1>Water and life</h1>\n<p><em>Water in the body, in plants, aquatic habitats, drinking water, health and sanitation.</em></p>\n<p>Part of the <a href=\"#Water\" class=\"wl\">Water</a> thread.</p>\n<p><strong>First taught:</strong> Class 5, <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a>.</p>\n<h2>The idea, class by class</h2>\n<table><thead><tr><th>Class</th><th>Subject · chapter</th><th>Role</th><th>What this chapter says</th></tr></thead><tbody>\n<tr><td>3</td><td>[[english-iii-ch13</td><td>English · Ch 13 Madhu's Wish]]</td><td>○ uses</td><td>When hiccups strike, sharbat, kheer and badam milk cannot stop them and only a jug of water can, so children talk about why the body needs water above all other food.</td></tr>\n<tr><td>3</td><td>[[the_world_around_us-iii-ch07</td><td>The World Around Us · Ch 7 Water–A Precious Gift]]</td><td>○ uses</td><td>Water is essential for the survival of people, birds and animals, so students build and maintain a birdbath, note which birds and insects come to drink, and ask whether the water near them is fit for drinking.</td></tr>\n<tr><td>4</td><td>[[the_world_around_us-iv-ch09</td><td>The World Around Us · Ch 9 Different Lands, Different Lives]]</td><td>○ uses</td><td>The sea along the Odisha coast is a habitat for sea turtles, crabs, dolphins, corals, seaweed and starfish, which students identify by name from pictures.</td></tr>\n<tr><td>5</td><td>[[the_world_around_us-v-ch01</td><td>The World Around Us · Ch 1 Water — The Essence of Life]]</td><td>● introduces</td><td>All living beings depend on freshwater, and freshwater habitats hold specially adapted plants and animals (fins and gills, waxy leaves; dragonfly, pond heron, freshwater turtle, lotus, water hyacinth) linked in a food chain, which students observe on a visit to a pond, lake or aquarium.</td></tr>\n<tr><td>5</td><td>[[the_world_around_us-v-ch02</td><td>The World Around Us · Ch 2 Journey of a River]]</td><td>◐ extends</td><td>Waste, plastic, untreated sewage and fertiliser runoff make river water unsafe for people and wildlife — algal 'green blankets' choke aquatic life and make water undrinkable — and floods spread disease and cut off safe drinking water.</td></tr>\n<tr><td>5</td><td>[[english-v-ch05</td><td>English · Ch 5 The Frog]]</td><td>○ uses</td><td>A frog lives in water and on land alike — sitting in ponds and muddy drains, swimming first as a tadpole and later with webbed feet — and children compare this amphibious life with a fish's and draw the frog's pond home.</td></tr>\n<tr><td>6</td><td>[[science-vi-ch10</td><td>Science · Ch 10 Living Creatures: Exploring their Characteristics]]</td><td>● introduces</td><td>A seed needs water and air (not light) to germinate — water softens the seed coat so the embryo can grow — while mosquitoes lay eggs on stagnant water where larvae and pupae surface to breathe, and frogs begin life as spawn and tadpoles swimming in ponds before living on both land and water.</td></tr>\n<tr><td>6</td><td>[[social_sciences-vi-ch02</td><td>Social Sciences · Ch 2 Oceans and Continents]]</td><td>● introduces</td><td>Every layer of the ocean from sunlit surface to dark depths hosts marine flora (algae, seaweeds) and marine fauna (fish, dolphins, whales), the ocean's plant life makes more than half the world's oxygen, and salty seawater is unfit for land animals to drink.</td></tr>\n<tr><td>6</td><td>[[social_sciences-vi-ch06</td><td>Social Sciences · Ch 6 The Beginnings of Indian Civilisation]]</td><td>○ uses</td><td>Harappan homes had bathing areas connected to a city-wide drainage network beneath the streets that carried waste water away — an early system of sanitation.</td></tr>\n<tr><td>7</td><td>[[science-vii-ch10</td><td>Science · Ch 10 Life Processes in Plants]]</td><td>◐ extends</td><td>Plants need water to grow (a sapling in sunlight without water fails), water is a raw material of photosynthesis (carbon dioxide + water → glucose + oxygen), and roots absorb water with dissolved minerals that travel upward through xylem tubes, as a stem cutting in red-inked water shows.</td></tr>\n<tr><td>7</td><td>[[science-vii-ch09</td><td>Science · Ch 9 Nutrition and Respiration in Animals (summary carries no chapter title; named from its sections 9.1 and 9.2)]]</td><td>○ uses</td><td>The large intestine absorbs water from undigested food, respiration in cells releases water along with carbon dioxide and energy, and fish breathe by passing dissolved oxygen from the surrounding water into the blood through gills, while tadpoles use gills and frogs and earthworms exchange gases through moist skin.</td></tr>\n<tr><td>8</td><td>[[science-viii-ch13</td><td>Science · Ch 13 Our Home: Earth, a Unique Life Sustaining Planet]]</td><td>◐ extends</td><td>Liquid water is essential for life to evolve and be sustained: it acts as a solvent, transports nutrients in plants, regulates body temperature in animals, aids digestion and supports aquatic life from plankton to whales, while water pollution from industrial, agricultural and plastic waste harms that life.</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch08</td><td>Social Sciences · Ch 8 World Geography: Some Glimpses]]</td><td>◐ extends</td><td>Oceans support life from plankton to the blue whale and supply almost half the oxygen we breathe, trench organisms live in total darkness on chemical energy instead of photosynthesis, and coral reefs — 'rainforests of the sea' sheltering a quarter of all ocean species — are bleaching as human actions change ocean chemistry.</td></tr>\n<tr><td>8</td><td>[[science-viii-ch09</td><td>Science · Ch 9 The Amazing World of Solutes, Solvents, and Solutions]]</td><td>○ uses</td><td>Colder water holds more dissolved oxygen, so warming water leaves fish short of oxygen, and because ice is less dense than water it floats and insulates the water beneath, keeping aquatic life alive in cold climates.</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch01</td><td>Social Sciences · Ch 1 Natural Resources and Their Use]]</td><td>○ uses</td><td>Water, with air and food, is a resource life cannot exist without and humans cannot manufacture, yet chemical contamination of over-pumped groundwater in Punjab and cement-industry pollution now pose health hazards, and access to water is inequitably distributed with the poor bearing the burden.</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch14</td><td>Social Sciences · Ch 14 India's Urban Landscape]]</td><td>○ uses</td><td>Unplanned urban growth and slums leave residents with poor access to water and sanitation, while sewage- and chemical-polluted lakes such as Bellandur and Varthur foam, release toxic gases and even catch fire.</td></tr>\n<tr><td>9</td><td>[[science-ix-ch02</td><td>Science · Ch 2 Cell: The Building Block of Life]]</td><td>◐ extends</td><td>Water moves into and out of cells by osmosis — diffusion across the selectively permeable membrane from a dilute to a concentrated solution — so a potato piece or cheek cell shrinks in 20% salt or sugar solution and a plant cell plasmolyses while its wall holds its outer shape, and the water-filled central vacuole's turgor keeps plant cells firm until water deficit makes the plant wilt.</td></tr>\n<tr><td>9</td><td>[[science-ix-ch03</td><td>Science · Ch 3 Tissues in Action]]</td><td>◐ extends</td><td>Water enters through root hairs that enlarge the root's absorbing surface, rises through xylem's dead tracheids and vessels, and leaves through stomata as transpiration — a loss the waxy cuticle limits (thicker in dry habitats) but which also creates the transpiration pull that keeps water moving upward against gravity.</td></tr>\n<tr><td>9</td><td>[[science-ix-ch12</td><td>Science · Ch 12 Patterns in Life: Diversity and Classification]]</td><td>○ uses</td><td>The plant kingdom is ordered by its dependence on water: thallophytes are aquatic, bryophytes and pteridophytes live on land but still need water for their swimming male gametes, and gymnosperms are the first to reproduce without water — while sponges feed on water flowing through their pores and fins and gills fit fish for aquatic life.</td></tr>\n<tr><td>9</td><td>[[science-ix-ch13</td><td>Science · Ch 13 Earth as a System: Energy, Matter, and Life]]</td><td>○ uses</td><td>Excess nitrate fertiliser washed into rivers and lakes triggers algal blooms that deplete oxygen and kill fish (eutrophication), and warmer, more acidic seawater threatens plankton and coral reefs.</td></tr>\n</tbody></table>\n<p><strong>Introduces</strong> (3): Class 5 TWAU ch 1; Class 6 Sci ch 10; Class 6 SS ch 2</p>\n<p><strong>Extends</strong> (6): Class 5 TWAU ch 2; Class 7 Sci ch 10; Class 8 Sci ch 13; Class 8 SS ch 8; Class 9 Sci ch 2; Class 9 Sci ch 3</p>\n<p><strong>Uses</strong> (11): Class 3 Eng ch 13; Class 3 TWAU ch 7; Class 4 TWAU ch 9; Class 5 Eng ch 5; Class 6 SS ch 6; Class 7 Sci ch 9; Class 8 Sci ch 9; Class 8 SS ch 1; Class 8 SS ch 14; Class 9 Sci ch 12; Class 9 Sci ch 13</p>\n<h2>Joint-class candidates</h2>\n<p>Same class, different subjects, this one idea:</p>\n<ul>\n<li><strong>Class 3</strong> — <a href=\"#english-iii-ch13\" class=\"wl\">English · Ch 13 Madhu's Wish</a> + <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a></li>\n<li><strong>Class 5</strong> — <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a> + <a href=\"#the_world_around_us-v-ch02\" class=\"wl\">The World Around Us · Ch 2 Journey of a River</a> + <a href=\"#english-v-ch05\" class=\"wl\">English · Ch 5 The Frog</a></li>\n<li><strong>Class 6</strong> — <a href=\"#science-vi-ch10\" class=\"wl\">Science · Ch 10 Living Creatures: Exploring their Characteristics</a> + <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a> + <a href=\"#social_sciences-vi-ch06\" class=\"wl\">Social Sciences · Ch 6 The Beginnings of Indian Civilisation</a></li>\n<li><strong>Class 8</strong> — <a href=\"#science-viii-ch13\" class=\"wl\">Science · Ch 13 Our Home: Earth, a Unique Life Sustaining Planet</a> + <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> + <a href=\"#science-viii-ch09\" class=\"wl\">Science · Ch 9 The Amazing World of Solutes, Solvents, and Solutions</a> + <a href=\"#social_sciences-viii-ch01\" class=\"wl\">Social Sciences · Ch 1 Natural Resources and Their Use</a> + <a href=\"#social_sciences-viii-ch14\" class=\"wl\">Social Sciences · Ch 14 India's Urban Landscape</a></li>\n</ul>\n<h2>Related ideas</h2>\n<p>Ideas that most often appear in the same chapters: <a href=\"#water-in-society\" class=\"wl\">Water in society</a> (9), <a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a> (8), <a href=\"#oceans-and-water-bodies\" class=\"wl\">Oceans and water bodies</a> (7), <a href=\"#rain-and-monsoon\" class=\"wl\">Rain and the monsoon</a> (6).</p>"}, "water-as-solvent": {"title": "Water as a solvent", "crumb": "idea", "html": "<h1>Water as a solvent</h1>\n<p><em>Dissolving, solutions, mixtures, purification and separation.</em></p>\n<p>Part of the <a href=\"#Water\" class=\"wl\">Water</a> thread.</p>\n<p><strong>First taught:</strong> Class 5, <a href=\"#the_world_around_us-v-ch02\" class=\"wl\">The World Around Us · Ch 2 Journey of a River</a>.</p>\n<h2>The idea, class by class</h2>\n<table><thead><tr><th>Class</th><th>Subject · chapter</th><th>Role</th><th>What this chapter says</th></tr></thead><tbody>\n<tr><td>5</td><td>[[the_world_around_us-v-ch02</td><td>The World Around Us · Ch 2 Journey of a River]]</td><td>● introduces</td><td>Some pollutants dissolve invisibly in water while others such as oil do not (a spoon of sugar versus a spoon of cooking oil stirred into two glasses), both harming the river, and students design a simple water filter from everyday materials.</td></tr>\n<tr><td>6</td><td>[[science-vi-ch06</td><td>Science · Ch 6 Materials Around Us]]</td><td>● introduces</td><td>Stirring sugar, salt, chalk powder, sand and sawdust into water shows that some materials dissolve completely (soluble) while others do not (insoluble), some liquids mix with water while others form a separate layer, and gases such as oxygen dissolve too, which is what makes aquatic life possible.</td></tr>\n<tr><td>6</td><td>[[science-vi-ch09</td><td>Science · Ch 9 Methods of Separation in Everyday Life]]</td><td>◐ extends</td><td>A dissolved solid such as salt is recovered from water by evaporating the water (in salt pans and by heating a salt solution to dryness), insoluble particles are removed by letting them settle and decanting or by filtering muddy water through filter paper, cloth, cotton, sand or charcoal, and oil is decanted off water because it forms a separate layer.</td></tr>\n<tr><td>7</td><td>[[science-vii-ch04</td><td>Science · Ch 4 The World of Metals and Non-metals]]</td><td>○ uses</td><td>Iron rusts only when both water and air are present (a nail in boiled, oil-covered water or in dry air stays clean), sodium is stored in kerosene to keep it from water while phosphorus is stored under water, and sulfur dioxide dissolves in water to give an acidic solution — water here is a reactant and storage medium, which has no id of its own, so it is placed under the nearest (water-as-solvent).</td></tr>\n<tr><td>8</td><td>[[science-viii-ch07</td><td>Science · Ch 7 Particulate Nature of Matter]]</td><td>◐ extends</td><td>Sugar dissolved in water turns invisible but is still there (its taste proves it) because its particles slip into the spaces between water particles, so the solution's volume is less than the sum of the two, whereas insoluble sand settles and adds volume; a grain of potassium permanganate spreading through water — faster in hot water — shows that water particles are always moving.</td></tr>\n<tr><td>8</td><td>[[science-viii-ch09</td><td>Science · Ch 9 The Amazing World of Solutes, Solvents, and Solutions]]</td><td>◐ extends</td><td>In a salt–water solution the dissolved solid is the solute and water the solvent; a fixed volume of water dissolves only so much salt before the solution is saturated, solubility of most solids rises with temperature (baking soda at 20, 50 and 70 °C) while that of gases falls, and concentration separates dilute from concentrated solutions.</td></tr>\n<tr><td>8</td><td>[[science-viii-ch08</td><td>Science · Ch 8 Nature of Matter: Elements, Compounds, and Mixtures]]</td><td>○ uses</td><td>Sugar dissolved in water is the model uniform mixture (components indistinguishable even under a microscope), sand-in-water and seawater are solid–liquid mixtures and oxygen-in-water a gas–liquid one, while water itself is shown by passing electricity through it to be a compound of hydrogen and oxygen in a fixed 2:1 ratio — a fact about water's own make-up with no id of its own, placed here as nearest.</td></tr>\n<tr><td>9</td><td>[[science-ix-ch05</td><td>Science · Ch 5 Exploring Mixtures and their Separation]]</td><td>◐ extends</td><td>Water solutions are now quantified — concentration as % m/m, % m/v or % v/v (ORS and 0.9% saline must be exact) and solubility read from curves against temperature — and separated by crystallizing a cooled saturated solution (copper sulfate; salt from seawater brine), distilling off a lower-boiling liquid such as acetone or recovering the solvent, running ink up chromatography paper with water as the solvent, draining oil from water in a separating funnel, and clearing suspended particles by filtration, centrifugation or alum coagulation, while colloids such as milk scatter light.</td></tr>\n<tr><td>9</td><td>[[science-ix-ch09</td><td>Science · Ch 9 Atomic Foundations of Matter]]</td><td>◐ extends</td><td>Ionic compounds such as salt and copper sulfate dissolve in water (not in kerosene or petrol) and their solutions conduct electricity because the ions become free to move, sugar dissolves without conducting, and camphor and naphthalene do not dissolve at all — while water itself is treated as a compound (hydrogen and oxygen always 1:8 by mass whatever the source, two single covalent bonds in H₂O, molecular mass 18 u), a fact with no id of its own placed here as nearest.</td></tr>\n<tr><td>9</td><td>[[social_sciences-ix-ch02</td><td>Social Sciences · Ch 2 Shaping of the Earth's Surface]]</td><td>○ uses</td><td>Chemical weathering changes minerals by reaction with water and acids, and groundwater dissolving limestone creates karst — caves, stalactites, stalagmites, sinkholes and underground rivers.</td></tr>\n</tbody></table>\n<p><strong>Introduces</strong> (2): Class 5 TWAU ch 2; Class 6 Sci ch 6</p>\n<p><strong>Extends</strong> (5): Class 6 Sci ch 9; Class 8 Sci ch 7; Class 8 Sci ch 9; Class 9 Sci ch 5; Class 9 Sci ch 9</p>\n<p><strong>Uses</strong> (3): Class 7 Sci ch 4; Class 8 Sci ch 8; Class 9 SS ch 2</p>\n<h2>Joint-class candidates</h2>\n<p>Same class, different subjects, this one idea:</p>\n<ul>\n<li><strong>Class 9</strong> — <a href=\"#science-ix-ch05\" class=\"wl\">Science · Ch 5 Exploring Mixtures and their Separation</a> + <a href=\"#science-ix-ch09\" class=\"wl\">Science · Ch 9 Atomic Foundations of Matter</a> + <a href=\"#social_sciences-ix-ch02\" class=\"wl\">Social Sciences · Ch 2 Shaping of the Earth's Surface</a></li>\n</ul>\n<h2>Related ideas</h2>\n<p>Ideas that most often appear in the same chapters: <a href=\"#states-of-water\" class=\"wl\">States of water</a> (4), <a href=\"#rivers-and-landforms\" class=\"wl\">Rivers and landforms</a> (2), <a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a> (2), <a href=\"#water-and-life\" class=\"wl\">Water and life</a> (2).</p>"}, "measuring-water": {"title": "Measuring water", "crumb": "idea", "html": "<h1>Measuring water</h1>\n<p><em>Capacity and volume in litres, weighing liquids, measuring water temperature.</em></p>\n<p>Part of the <a href=\"#Water\" class=\"wl\">Water</a> thread.</p>\n<p><strong>First taught:</strong> Class 3, <a href=\"#mathematics-iii-ch11\" class=\"wl\">Mathematics · Ch 11 Filling and Lifting</a>.</p>\n<h2>The idea, class by class</h2>\n<table><thead><tr><th>Class</th><th>Subject · chapter</th><th>Role</th><th>What this chapter says</th></tr></thead><tbody>\n<tr><td>3</td><td>[[mathematics-iii-ch11</td><td>Mathematics · Ch 11 Filling and Lifting]]</td><td>● introduces</td><td>How much a vessel holds cannot be judged by its shape, so water or milk is poured into same-sized glasses to compare fairly, and the litre (then half and quarter litre) is met as the standard unit by checking a bucket, mug and glass against a 1-litre bottle.</td></tr>\n<tr><td>3</td><td>[[the_world_around_us-iii-ch07</td><td>The World Around Us · Ch 7 Water–A Precious Gift]]</td><td>○ uses</td><td>Students estimate how much water everyday tasks need in informal units (mugs of water to brush teeth, water used for a shower) to build a sense of quantity — placed under the nearest id, since no standard units such as litres are used.</td></tr>\n<tr><td>4</td><td>[[mathematics-iv-ch08</td><td>Mathematics · Ch 8 Weigh It, Pour It]]</td><td>◐ extends</td><td>The litre is subdivided into millilitres — 500 ml is half a litre, 250 ml a quarter, 100 ml a tenth — discovered by pouring, with 10 ml dosing cups and 1 ml droppers for tiny amounts, and household containers (water bottle, glass, mug, jug, bucket) are estimated then measured.</td></tr>\n<tr><td>5</td><td>[[mathematics-v-ch08</td><td>Mathematics · Ch 8 Weight and Capacity]]</td><td>◐ extends</td><td>Litres and millilitres are tied by 1,000 ml = 1 l on a double number line, so 1 l 400 ml is 1,400 ml (not 1,040 ml), and amounts of water, milk, fuel and oil in compound l-and-ml form are compared, added, subtracted, multiplied and divided with regrouping across the 1,000.</td></tr>\n<tr><td>5</td><td>[[the_world_around_us-v-ch04</td><td>The World Around Us · Ch 4 Our School—A Happy Place]]</td><td>○ uses</td><td>Water is measured two ways: the time a drip takes to fill a glass (scaled to glasses per day), and water temperature read with a thermometer before and after an hour under a tree versus in the Sun.</td></tr>\n<tr><td>6</td><td>[[science-vi-ch06</td><td>Science · Ch 6 Materials Around Us]]</td><td>● introduces</td><td>The amount of water in a tumbler is its volume — the space it occupies — and bottles labelled 1 L, 500 mL or 200 mL state that volume in litres and millilitres (with 1 m³ = 1000 L noted as the SI relation).</td></tr>\n<tr><td>6</td><td>[[science-vi-ch07</td><td>Science · Ch 7 Temperature and its Measurement]]</td><td>● introduces</td><td>A laboratory thermometer is dipped into warm water and read while still immersed, held vertically with the eye level to the liquid column, to measure the water's temperature in degrees Celsius.</td></tr>\n<tr><td>8</td><td>[[science-viii-ch09</td><td>Science · Ch 9 The Amazing World of Solutes, Solvents, and Solutions]]</td><td>◐ extends</td><td>Water volume is read on a measuring cylinder (5 mL to 500 mL sizes) at its least count with the eye level to the meniscus — Activity 9.5 measures out exactly 50 mL — and the rise in water level when an irregular object is submerged gives that object's volume, while a digital balance with tare gives mass in grams.</td></tr>\n</tbody></table>\n<p><strong>Introduces</strong> (3): Class 3 Maths ch 11; Class 6 Sci ch 6; Class 6 Sci ch 7</p>\n<p><strong>Extends</strong> (3): Class 4 Maths ch 8; Class 5 Maths ch 8; Class 8 Sci ch 9</p>\n<p><strong>Uses</strong> (2): Class 3 TWAU ch 7; Class 5 TWAU ch 4</p>\n<h2>Joint-class candidates</h2>\n<p>Same class, different subjects, this one idea:</p>\n<ul>\n<li><strong>Class 3</strong> — <a href=\"#mathematics-iii-ch11\" class=\"wl\">Mathematics · Ch 11 Filling and Lifting</a> + <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a></li>\n<li><strong>Class 5</strong> — <a href=\"#mathematics-v-ch08\" class=\"wl\">Mathematics · Ch 8 Weight and Capacity</a> + <a href=\"#the_world_around_us-v-ch04\" class=\"wl\">The World Around Us · Ch 4 Our School—A Happy Place</a></li>\n</ul>\n<h2>Related ideas</h2>\n<p>Ideas that most often appear in the same chapters: <a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a> (3), <a href=\"#rain-and-monsoon\" class=\"wl\">Rain and the monsoon</a> (2), <a href=\"#water-and-life\" class=\"wl\">Water and life</a> (2), <a href=\"#water-as-solvent\" class=\"wl\">Water as a solvent</a> (2).</p>"}, "water-and-heat": {"title": "Water and heat", "crumb": "idea", "html": "<h1>Water and heat</h1>\n<p><em>Heating and cooling water, convection, sea and land breezes, water in heat transfer.</em></p>\n<p>Part of the <a href=\"#Water\" class=\"wl\">Water</a> thread.</p>\n<p><strong>First taught:</strong> Class 6, <a href=\"#science-vi-ch08\" class=\"wl\">Science · Ch 8 A Journey through States of Water</a>.</p>\n<h2>The idea, class by class</h2>\n<table><thead><tr><th>Class</th><th>Subject · chapter</th><th>Role</th><th>What this chapter says</th></tr></thead><tbody>\n<tr><td>5</td><td>[[the_world_around_us-v-ch04</td><td>The World Around Us · Ch 4 Our School—A Happy Place]]</td><td>○ uses</td><td>Water kept in the shade of a tree stays cooler than water left in the Sun, and clay matkas cool drinking water without electricity by evaporative cooling.</td></tr>\n<tr><td>6</td><td>[[science-vi-ch08</td><td>Science · Ch 8 A Journey through States of Water]]</td><td>● introduces</td><td>Supplying heat turns ice to water and water to vapour while removing heat freezes water, and because evaporation takes heat from the water left behind, a porous earthen matka, a pot-in-pot cooler or water sprinkled on a floor cools things down.</td></tr>\n<tr><td>7</td><td>[[social_sciences-vii-ch03</td><td>Social Sciences · Ch 3 Climates of India]]</td><td>● introduces</td><td>Because the sea absorbs and releases heat more slowly than land, coastal Mumbai has a yearly temperature range of about 14°C against inland Nagpur's 34°C, and this same land–ocean heating difference creates the pressure contrasts that drive the monsoon winds.</td></tr>\n<tr><td>7</td><td>[[science-vii-ch07</td><td>Science · Ch 7 Heat Transfer in Nature]]</td><td>◐ extends</td><td>Water heats by convection — warmed water at the base expands, rises and is replaced by cooler water, as a potassium permanganate trace shows — and because land heats and cools faster than water, air flows from sea to land by day (sea breeze) and from land to sea at night (land breeze), while a pan of water on a flame uses conduction, convection and radiation at once.</td></tr>\n<tr><td>8</td><td>[[science-viii-ch06</td><td>Science · Ch 6 Pressure, Winds, Storms, and Cyclones]]</td><td>◐ extends</td><td>Sea and land breezes are re-explained through pressure: by day the faster-heating land warms the air above it into a low-pressure area that cooler sea air flows into, and at night the warmer sea reverses the flow.</td></tr>\n<tr><td>8</td><td>[[social_sciences-viii-ch08</td><td>Social Sciences · Ch 8 World Geography: Some Glimpses]]</td><td>◐ extends</td><td>Oceans regulate climate by absorbing heat and releasing it slowly, and warm currents such as the Gulf Stream carry equatorial heat north through the Atlantic so that the United Kingdom is warmer than other places at the same latitude.</td></tr>\n<tr><td>9</td><td>[[science-ix-ch13</td><td>Science · Ch 13 Earth as a System: Energy, Matter, and Life]]</td><td>◐ extends</td><td>Water shapes Earth's heat budget: water vapour is a greenhouse gas, dark ocean water (low albedo) absorbs heat while snow and ice reflect it, and ocean currents move heat from the equator toward the poles, regulating climate.</td></tr>\n<tr><td>9</td><td>[[social_sciences-ix-ch03</td><td>Social Sciences · Ch 3 Atmosphere and Climate]]</td><td>◐ extends</td><td>Land heats and cools faster than the sea, so by day a sea breeze blows from sea to land and at night a land breeze from land to sea, moderating coastal climates, and the same contrast on a seasonal scale drives the monsoon's reversal.</td></tr>\n</tbody></table>\n<p><strong>Introduces</strong> (2): Class 6 Sci ch 8; Class 7 SS ch 3</p>\n<p><strong>Extends</strong> (5): Class 7 Sci ch 7; Class 8 Sci ch 6; Class 8 SS ch 8; Class 9 Sci ch 13; Class 9 SS ch 3</p>\n<p><strong>Uses</strong> (1): Class 5 TWAU ch 4</p>\n<h2>Joint-class candidates</h2>\n<p>Same class, different subjects, this one idea:</p>\n<ul>\n<li><strong>Class 7</strong> — <a href=\"#social_sciences-vii-ch03\" class=\"wl\">Social Sciences · Ch 3 Climates of India</a> + <a href=\"#science-vii-ch07\" class=\"wl\">Science · Ch 7 Heat Transfer in Nature</a></li>\n<li><strong>Class 8</strong> — <a href=\"#science-viii-ch06\" class=\"wl\">Science · Ch 6 Pressure, Winds, Storms, and Cyclones</a> + <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a></li>\n<li><strong>Class 9</strong> — <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> + <a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a></li>\n</ul>\n<h2>Related ideas</h2>\n<p>Ideas that most often appear in the same chapters: <a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a> (6), <a href=\"#water-cycle\" class=\"wl\">The water cycle</a> (6), <a href=\"#rain-and-monsoon\" class=\"wl\">Rain and the monsoon</a> (5), <a href=\"#rivers-and-landforms\" class=\"wl\">Rivers and landforms</a> (4).</p>"}, "water-in-society": {"title": "Water in society", "crumb": "idea", "html": "<h1>Water in society</h1>\n<p><em>Civilisations by rivers, water in architecture, urban supply, community disputes, water in stories.</em></p>\n<p>Part of the <a href=\"#Water\" class=\"wl\">Water</a> thread.</p>\n<p><strong>First taught:</strong> Class 3, <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a>.</p>\n<h2>The idea, class by class</h2>\n<table><thead><tr><th>Class</th><th>Subject · chapter</th><th>Role</th><th>What this chapter says</th></tr></thead><tbody>\n<tr><td>3</td><td>[[the_world_around_us-iii-ch07</td><td>The World Around Us · Ch 7 Water–A Precious Gift]]</td><td>● introduces</td><td>People have long stored water in clay, copper
