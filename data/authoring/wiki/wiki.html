 of floodplains.</li>\n<li>○ <a href=\"#social_sciences-vi-ch06\" class=\"wl\">Social Sciences · Ch 6 The Beginnings of Indian Civilisation</a> — Settlements were placed along rivers both for water and for the fertile soil rivers create, and the Sarasvatī — today the seasonal Ghaggar in India and Hakra in Pakistan — is a river that later texts describe drying up and disappearing.</li>\n</ul>\n<p><strong>Class 7</strong></p>\n<ul>\n<li>● <a href=\"#science-vii-ch05\" class=\"wl\">Science · Ch 5 Changes Around Us: Physical and Chemical</a> — Rocks break into sediments by weathering — water freezing in cracks, temperature swings, growing roots, and water with dissolved chemicals reacting with rock surfaces — and flowing water and wind then carry the sediments away (erosion) to settle in water bodies where, over thousands of years, they harden into new rock.</li>\n<li>◐ <a href=\"#social_sciences-vii-ch01\" class=\"wl\">Social Sciences · Ch 1 Geographical Diversity of India</a> — Summer snow-melt from the Himalayas — the Bhagirathi rising at Gaumukh from the Gangotri Glacier — feeds the Ganga, Indus and Brahmaputra whose mineral-laden waters build the fertile Gangetic plains, the eastward tilt of the peninsular plateau sends the Godavari, Krishna, Kaveri and Mahanadi to the Bay of Bengal as wide fertile deltas while the Narmada and Tapti flow west into estuaries, and the Ganga–Brahmaputra delta forms the mangrove Sundarbans.</li>\n<li>○ <a href=\"#social_sciences-vii-ch03\" class=\"wl\">Social Sciences · Ch 3 Climates of India</a> — Floods occur when heavy rain, river-bank breaches or bursting glacial lakes send water over normally dry land — as in the 2013 Kedarnath disaster — and urban flooding is worsened by poor drainage, encroached waterways and impermeable concrete.</li>\n</ul>\n<p><strong>Class 8</strong></p>\n<ul>\n<li>○ <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> — Mountains act as 'water towers' — the Tibetan 'Third Pole' sources the Indus, Brahmaputra and Yangtze and its snow-melt is now expanding lakes, the Alps feed the Rhine and Danube, the Andes feed the Amazon (the largest river by volume) — while plains such as the European Plain are built by sediment deposition and the Colorado Plateau's Grand Canyon is cut by erosion.</li>\n</ul>\n<p><strong>Class 9</strong></p>\n<ul>\n<li>◐ <a href=\"#social_sciences-ix-ch02\" class=\"wl\">Social Sciences · Ch 2 Shaping of the Earth's Surface</a> — A river shapes land differently along its course — V-shaped valleys, waterfalls and rapids where hard rock resists in the upper course, meanders and oxbow lakes from outer-bank erosion and inner-bank deposition in the middle, deltas, levees and alluvial fans where it meets the sea — while glaciers carve U-shaped valleys, cirques and fjords, leave moraines that dam lakes, and can unleash Glacial Lake Outburst Floods when their ice or moraine dams fail.</li>\n<li>○ <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> — Melting glaciers add water to rivers and raise sea levels that threaten coastal cities such as Mumbai and Chennai, and intense rainfall runoff erodes soil.</li>\n<li>○ <a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a> — The 2025 Punjab floods came from heavy monsoon rain swelling the Satluj, Beas, Ravi and Ghaggar in succession, made worse by weak old embankments (dhūsī bāndh), building too close to rivers, silt reducing river and dam capacity and late warnings — and climate change is making floods, droughts, glacier melt and sea-level rise more frequent.</li>\n</ul>\n<p><em>Not touched in: Class 3, Class 4.</em></p>\n<h2><a href=\"#oceans-and-water-bodies\" class=\"wl\">Oceans and water bodies</a></h2>\n<p><strong>Class 3</strong></p>\n<ul>\n<li>● <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a> — Streams, rivers, ponds and lakes are the local water bodies where rainwater collects, and students find one near their village or city, visit and draw it, and record whether its water is (or was) used for drinking.</li>\n</ul>\n<p><strong>Class 4</strong></p>\n<ul>\n<li>○ <a href=\"#the_world_around_us-iv-ch09\" class=\"wl\">The World Around Us · Ch 9 Different Lands, Different Lives</a> — The sea defines the coastal landform: Odisha's coast has beaches, fishing as the main livelihood, sand art and conch shells, and students compare life by the sea with life in the desert and discuss why beaches must be kept clean.</li>\n</ul>\n<p><strong>Class 5</strong></p>\n<ul>\n<li>● <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a> — Most of Earth's surface is covered by water but nearly all of it is salty ocean water unfit for drinking or farming; freshwater is only a tiny fraction (a teaspoon in a glass) held in rivers, ponds, lakes and underground, and India's rivers drain either to the Bay of Bengal or the Arabian Sea.</li>\n</ul>\n<p><strong>Class 6</strong></p>\n<ul>\n<li>● <a href=\"#science-vi-ch11\" class=\"wl\">Science · Ch 11 Nature's Treasures</a> — Water covers about two-thirds of the Earth's surface, but most of it lies in oceans and seas as saline water, with freshwater held in ice sheets and snow, rivers, lakes, ponds, wells and underground sources.</li>\n<li>● <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a> — Water covers almost three-fourths of the Earth, mostly as five named but continuously connected oceans (Pacific the largest, Arctic the smallest) whose seas, bays and gulfs are parts of one global body, the Southern Hemisphere is mostly water, and freshwater is only a small share found in glaciers, rivers, lakes, the atmosphere and underground.</li>\n</ul>\n<p><strong>Class 7</strong></p>\n<ul>\n<li>○ <a href=\"#social_sciences-vii-ch01\" class=\"wl\">Social Sciences · Ch 1 Geographical Diversity of India</a> — The Arabian Sea, Indian Ocean and Bay of Bengal bound the subcontinent and hold its two island groups, and India's inland water bodies range from Ladakh's saltwater Pangong Tso to the east-coast Chilika Lake and Pulicat lagoon.</li>\n</ul>\n<p><strong>Class 8</strong></p>\n<ul>\n<li>◐ <a href=\"#science-viii-ch13\" class=\"wl\">Science · Ch 13 Our Home: Earth, a Unique Life Sustaining Planet</a> — Water covering about 70 per cent of Earth's surface — ponds, rivers, seas, oceans and groundwater — forms the hydrosphere, which is why Earth looks like the Blue Planet from space, and melting ice caps now raise sea levels that flood coastal areas.</li>\n<li>◐ <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> — The ocean covers about 71 per cent of the Earth and holds 97 per cent of its water over a floor of mountains, valleys and trenches (the Mariana's Challenger Deep over 11,000 m down); the five oceans are revisited with their distinct features, ocean currents run like giant rivers carrying warm water poleward and cold water toward the equator, seas, gulfs, bays, straits and canals are classified by shape and trade role, and the Great Lakes are a chain of five massive freshwater lakes.</li>\n<li>○ <a href=\"#science-viii-ch06\" class=\"wl\">Science · Ch 6 Pressure, Winds, Storms, and Cyclones</a> — A cyclone is powered by warm ocean water — rising moist air condenses and releases latent heat that deepens the low pressure — weakens once it reaches land and loses its moist air, and drives storm surges of 3–12 metres that flood coasts and contaminate drinking water with seawater.</li>\n</ul>\n<p><strong>Class 9</strong></p>\n<ul>\n<li>◐ <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> — Surface water and groundwater form the hydrosphere and ice and snow the cryosphere; ocean currents driven by planetary winds, temperature and salinity differences, Earth's rotation and the continents form gyres that carry heat poleward (the North Atlantic Drift keeps European ports ice-free) and nutrients to marine life, and the ocean holds 71% of global carbon, acidifying as it warms.</li>\n<li>○ <a href=\"#social_sciences-ix-ch02\" class=\"wl\">Social Sciences · Ch 2 Shaping of the Earth's Surface</a> — Sea waves and currents are agents of gradation that undercut headlands into cliffs, wave-cut platforms, caves, arches and stacks and deposit beaches and sand bars that shield settlements from coastal erosion.</li>\n</ul>\n<h2><a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a></h2>\n<p><strong>Class 3</strong></p>\n<ul>\n<li>● <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a> — Tap water comes from rooftop tanks, pipes, wells, borewells or tankers; many people must carry water from a distant well, river or lake; households store water against irregular supply; and water is precious, so it must not be wasted or polluted.</li>\n</ul>\n<p><strong>Class 4</strong></p>\n<ul>\n<li>○ <a href=\"#mathematics-iv-ch08\" class=\"wl\">Mathematics · Ch 8 Weigh It, Pour It</a> — Students count the litres of water they drink and use each day for showering, washing clothes and watering crops, and collect the drip from a leaking tap for an hour to work out how much water is wasted in a day and a week.</li>\n<li>○ <a href=\"#the_world_around_us-iv-ch09\" class=\"wl\">The World Around Us · Ch 9 Different Lands, Different Lives</a> — Water is scarce in the desert, so plants like cactus, khejri and babool survive by storing water and desert houses keep tankas (water tanks) for storage; students discuss why deserts are short of water.</li>\n</ul>\n<p><strong>Class 5</strong></p>\n<ul>\n<li>● <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a> — Rainwater percolates through soil and rock to become groundwater drawn up by wells, borewells, tube wells and handpumps; paved city surfaces block recharge while open ground, soak pits, ponds and trees restore it, and students design a house or school that conserves water.</li>\n<li>◐ <a href=\"#the_world_around_us-v-ch02\" class=\"wl\">The World Around Us · Ch 2 Journey of a River</a> — A river supplies water for drinking, cooking, washing, irrigation and industry through pipes and canals; India's 900-plus dams store river water for dry seasons, irrigation and electricity at the cost of flooding land and displacing people; and drought (Chennai 2019) forces migration and calls for conservation habits, the National Water Mission and water ATMs.</li>\n<li>◐ <a href=\"#the_world_around_us-v-ch04\" class=\"wl\">The World Around Us · Ch 4 Our School—A Happy Place</a> — A dripping tap wastes far more water than it seems — students time how long a drip takes to fill a glass and scale it up to a day — and a green school fixes leaks, prevents wastage and collects rainwater, in the spirit of the Jal Shakti Abhiyan.</li>\n<li>○ <a href=\"#english-v-ch06\" class=\"wl\">English · Ch 6 What a Tank!</a> — Water has been stored for centuries in structures like Tamil Nadu's ooranis for rainwater harvesting, Kerala's year-round Panam Keni wells and Rajasthan's underground tankas, and today in household overhead tanks — and children list how water is wasted daily, how to stop it, and hear how a day without supply led a family to set up rainwater harvesting at home.</li>\n<li>○ <a href=\"#english-v-ch08\" class=\"wl\">English · Ch 8 The Decision of the Panchayat</a> — A farmer buys the well beside his new field because the well is the field's source of water, and the chapter states outright that water is priceless — so valuable that no price can be put on it.</li>\n<li>○ <a href=\"#the_world_around_us-v-ch07\" class=\"wl\">The World Around Us · Ch 7 Energy—How Things Work</a> — Flowing water is a clean energy source: fast-moving rivers generate electricity and traditional gharaats (watermills) in hilly areas grind grain, modelled with a paper-cup water wheel that turns when water is poured on it — placed under the nearest id, since hydropower is not in the vocabulary.</li>\n</ul>\n<p><strong>Class 6</strong></p>\n<ul>\n<li>● <a href=\"#science-vi-ch11\" class=\"wl\">Science · Ch 11 Nature's Treasures</a> — Water is a precious resource because most of it is saline and only a very small fraction of freshwater is easily accessible, so wastage in hand washing, cooking and gardening should be cut by turning off taps, fixing leaks, recycling water and harvesting rainwater — access is unequal across India, and water counts as a renewable resource only when used judiciously.</li>\n<li>○ <a href=\"#science-vi-ch08\" class=\"wl\">Science · Ch 8 A Journey through States of Water</a> — Only a small fraction of Earth's water is available to living things, the rest lying in the oceans, so water must be used wisely and water bodies kept free of pollution; an Atmospheric Water Generator can even harvest water by condensing humid air.</li>\n<li>○ <a href=\"#social_sciences-vi-ch03\" class=\"wl\">Social Sciences · Ch 3 Landforms and Life</a> — Farming on the Ganga plain, once rainfed, now depends heavily on irrigation from canals and groundwater, which has raised production but depleted groundwater — a challenge for the future.</li>\n<li>○ <a href=\"#social_sciences-vi-ch06\" class=\"wl\">Social Sciences · Ch 6 The Beginnings of Indian Civilisation</a> — Harappans drew water from brick-lined wells, ponds and streams, and where these were lacking built human-made reservoirs that harvested and distributed water — an infrastructure that needed organised administration to build and maintain.</li>\n</ul>\n<p><strong>Class 7</strong></p>\n<ul>\n<li>◐ <a href=\"#science-vii-ch07\" class=\"wl\">Science · Ch 7 Heat Transfer in Nature</a> — Rain seeps into the ground fastest through gravel and slowest through clay (infiltration) to become groundwater held in aquifers that wells and bore wells tap, and since over-extraction and urban concrete are depleting it, rainwater harvesting and recharge pits are needed — Ladakh's ice stupas store winter stream water as ice to release for farming in summer.</li>\n<li>◐ <a href=\"#social_sciences-vii-ch01\" class=\"wl\">Social Sciences · Ch 1 Geographical Diversity of India</a> — The Himalayas are the 'Water Tower of Asia' whose rivers supply drinking, farming and industrial water to hundreds of millions, while in the water-scarce Thar people conserve rain with traditional taanka or kund rainwater-harvesting systems.</li>\n<li>○ <a href=\"#social_sciences-vii-ch03\" class=\"wl\">Social Sciences · Ch 3 Climates of India</a> — The arid Thar demands unique water conservation practices, and a failed monsoon brings water scarcity that hurts farming and the industries that depend on predictable water availability.</li>\n</ul>\n<p><strong>Class 8</strong></p>\n<ul>\n<li>◐ <a href=\"#social_sciences-viii-ch01\" class=\"wl\">Social Sciences · Ch 1 Natural Resources and Their Use</a> — Water is a renewable resource only while Nature's rhythm of restoration is not disturbed: farmers across India pump groundwater for irrigation faster than it recharges so water tables fall, Punjab's Green Revolution crops and free electricity have left almost 80 per cent of its area 'overexploited' with groundwater beyond about 30 metres, Himalayan glaciers melt faster than precipitation replaces them, and the remedies are water harvesting, pond rejuvenation and reduced consumption.</li>\n<li>◐ <a href=\"#social_sciences-viii-ch14\" class=\"wl\">Social Sciences · Ch 14 India's Urban Landscape</a> — Bengaluru suffers summer water shortages and monsoon flooding because of poor planning, groundwater overuse, no rainwater harvesting and encroached lake beds — its roughly 1,000 lakes reduced to about 200 — and non-profits, resident associations and communities have revived lakes such as Yelahanka by desilting, repairing bunds, clearing drainage channels and replanting, increasing water availability.</li>\n<li>○ <a href=\"#science-viii-ch06\" class=\"wl\">Science · Ch 6 Pressure, Winds, Storms, and Cyclones</a> — Overhead water tanks are placed high to supply good pressure and dam bases are built broader than their tops to withstand the large sideways water pressure near the bottom, because liquid pressure depends on the height of the water column and acts in all directions (liquid pressure itself has no id; placed under the nearest).</li>\n<li>○ <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> — Rivers, mountains and lakes are freshwater suppliers — the Nile's irrigation, drinking water and hydropower, the Alps' drinking water, irrigation and hydroelectricity, the Andes as a source for millions, the Great Lakes' city water now facing chemical contamination — while desert life clusters at Sahara oases and Gobi pastures fed by underground water.</li>\n<li>○ <a href=\"#social_sciences-viii-ch10\" class=\"wl\">Social Sciences · Ch 10 A Journey Through Indian Architecture</a> — Because India's monsoon delivers water seasonally, people over millennia built structures to harvest, store and distribute it — from the village pond to the Grand Anicut — suited to each region's geology and climate, and many now suffer from depleted sources, poor maintenance, pollution and waste dumping that environmentalists, locals and NGOs work to reverse.</li>\n</ul>\n<p><strong>Class 9</strong></p>\n<ul>\n<li>○ <a href=\"#social_sciences-ix-ch02\" class=\"wl\">Social Sciences · Ch 2 Shaping of the Earth's Surface</a> — Rivers, glaciers and groundwater are used as well as feared: the Grand Anicut (Kallanai) in Tamil Nadu shows rivers harnessed for irrigation, moraine-dammed lakes give water supply, irrigation and hydropower, karst provides fresh water, the Sindhu-Sarasvatī people used contouring, bunding, terracing, dams and canals, and Nagaland's Zabo system of earthen bunds and check dams conserves soil and water and recharges groundwater.</li>\n</ul>\n<h2><a href=\"#water-and-life\" class=\"wl\">Water and life</a></h2>\n<p><strong>Class 3</strong></p>\n<ul>\n<li>○ <a href=\"#english-iii-ch13\" class=\"wl\">English · Ch 13 Madhu's Wish</a> — When hiccups strike, sharbat, kheer and badam milk cannot stop them and only a jug of water can, so children talk about why the body needs water above all other food.</li>\n<li>○ <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a> — Water is essential for the survival of people, birds and animals, so students build and maintain a birdbath, note which birds and insects come to drink, and ask whether the water near them is fit for drinking.</li>\n</ul>\n<p><strong>Class 4</strong></p>\n<ul>\n<li>○ <a href=\"#the_world_around_us-iv-ch09\" class=\"wl\">The World Around Us · Ch 9 Different Lands, Different Lives</a> — The sea along the Odisha coast is a habitat for sea turtles, crabs, dolphins, corals, seaweed and starfish, which students identify by name from pictures.</li>\n</ul>\n<p><strong>Class 5</strong></p>\n<ul>\n<li>● <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a> — All living beings depend on freshwater, and freshwater habitats hold specially adapted plants and animals (fins and gills, waxy leaves; dragonfly, pond heron, freshwater turtle, lotus, water hyacinth) linked in a food chain, which students observe on a visit to a pond, lake or aquarium.</li>\n<li>◐ <a href=\"#the_world_around_us-v-ch02\" class=\"wl\">The World Around Us · Ch 2 Journey of a River</a> — Waste, plastic, untreated sewage and fertiliser runoff make river water unsafe for people and wildlife — algal 'green blankets' choke aquatic life and make water undrinkable — and floods spread disease and cut off safe drinking water.</li>\n<li>○ <a href=\"#english-v-ch05\" class=\"wl\">English · Ch 5 The Frog</a> — A frog lives in water and on land alike — sitting in ponds and muddy drains, swimming first as a tadpole and later with webbed feet — and children compare this amphibious life with a fish's and draw the frog's pond home.</li>\n</ul>\n<p><strong>Class 6</strong></p>\n<ul>\n<li>● <a href=\"#science-vi-ch10\" class=\"wl\">Science · Ch 10 Living Creatures: Exploring their Characteristics</a> — A seed needs water and air (not light) to germinate — water softens the seed coat so the embryo can grow — while mosquitoes lay eggs on stagnant water where larvae and pupae surface to breathe, and frogs begin life as spawn and tadpoles swimming in ponds before living on both land and water.</li>\n<li>● <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a> — Every layer of the ocean from sunlit surface to dark depths hosts marine flora (algae, seaweeds) and marine fauna (fish, dolphins, whales), the ocean's plant life makes more than half the world's oxygen, and salty seawater is unfit for land animals to drink.</li>\n<li>○ <a href=\"#social_sciences-vi-ch06\" class=\"wl\">Social Sciences · Ch 6 The Beginnings of Indian Civilisation</a> — Harappan homes had bathing areas connected to a city-wide drainage network beneath the streets that carried waste water away — an early system of sanitation.</li>\n</ul>\n<p><strong>Class 7</strong></p>\n<ul>\n<li>◐ <a href=\"#science-vii-ch10\" class=\"wl\">Science · Ch 10 Life Processes in Plants</a> — Plants need water to grow (a sapling in sunlight without water fails), water is a raw material of photosynthesis (carbon dioxide + water → glucose + oxygen), and roots absorb water with dissolved minerals that travel upward through xylem tubes, as a stem cutting in red-inked water shows.</li>\n<li>○ <a href=\"#science-vii-ch09\" class=\"wl\">Science · Ch 9 Nutrition and Respiration in Animals (summary carries no chapter title; named from its sections 9.1 and 9.2)</a> — The large intestine absorbs water from undigested food, respiration in cells releases water along with carbon dioxide and energy, and fish breathe by passing dissolved oxygen from the surrounding water into the blood through gills, while tadpoles use gills and frogs and earthworms exchange gases through moist skin.</li>\n</ul>\n<p><strong>Class 8</strong></p>\n<ul>\n<li>◐ <a href=\"#science-viii-ch13\" class=\"wl\">Science · Ch 13 Our Home: Earth, a Unique Life Sustaining Planet</a> — Liquid water is essential for life to evolve and be sustained: it acts as a solvent, transports nutrients in plants, regulates body temperature in animals, aids digestion and supports aquatic life from plankton to whales, while water pollution from industrial, agricultural and plastic waste harms that life.</li>\n<li>◐ <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> — Oceans support life from plankton to the blue whale and supply almost half the oxygen we breathe, trench organisms live in total darkness on chemical energy instead of photosynthesis, and coral reefs — 'rainforests of the sea' sheltering a quarter of all ocean species — are bleaching as human actions change ocean chemistry.</li>\n<li>○ <a href=\"#science-viii-ch09\" class=\"wl\">Science · Ch 9 The Amazing World of Solutes, Solvents, and Solutions</a> — Colder water holds more dissolved oxygen, so warming water leaves fish short of oxygen, and because ice is less dense than water it floats and insulates the water beneath, keeping aquatic life alive in cold climates.</li>\n<li>○ <a href=\"#social_sciences-viii-ch01\" class=\"wl\">Social Sciences · Ch 1 Natural Resources and Their Use</a> — Water, with air and food, is a resource life cannot exist without and humans cannot manufacture, yet chemical contamination of over-pumped groundwater in Punjab and cement-industry pollution now pose health hazards, and access to water is inequitably distributed with the poor bearing the burden.</li>\n<li>○ <a href=\"#social_sciences-viii-ch14\" class=\"wl\">Social Sciences · Ch 14 India's Urban Landscape</a> — Unplanned urban growth and slums leave residents with poor access to water and sanitation, while sewage- and chemical-polluted lakes such as Bellandur and Varthur foam, release toxic gases and even catch fire.</li>\n</ul>\n<p><strong>Class 9</strong></p>\n<ul>\n<li>◐ <a href=\"#science-ix-ch02\" class=\"wl\">Science · Ch 2 Cell: The Building Block of Life</a> — Water moves into and out of cells by osmosis — diffusion across the selectively permeable membrane from a dilute to a concentrated solution — so a potato piece or cheek cell shrinks in 20% salt or sugar solution and a plant cell plasmolyses while its wall holds its outer shape, and the water-filled central vacuole's turgor keeps plant cells firm until water deficit makes the plant wilt.</li>\n<li>◐ <a href=\"#science-ix-ch03\" class=\"wl\">Science · Ch 3 Tissues in Action</a> — Water enters through root hairs that enlarge the root's absorbing surface, rises through xylem's dead tracheids and vessels, and leaves through stomata as transpiration — a loss the waxy cuticle limits (thicker in dry habitats) but which also creates the transpiration pull that keeps water moving upward against gravity.</li>\n<li>○ <a href=\"#science-ix-ch12\" class=\"wl\">Science · Ch 12 Patterns in Life: Diversity and Classification</a> — The plant kingdom is ordered by its dependence on water: thallophytes are aquatic, bryophytes and pteridophytes live on land but still need water for their swimming male gametes, and gymnosperms are the first to reproduce without water — while sponges feed on water flowing through their pores and fins and gills fit fish for aquatic life.</li>\n<li>○ <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> — Excess nitrate fertiliser washed into rivers and lakes triggers algal blooms that deplete oxygen and kill fish (eutrophication), and warmer, more acidic seawater threatens plankton and coral reefs.</li>\n</ul>\n<h2><a href=\"#water-as-solvent\" class=\"wl\">Water as a solvent</a></h2>\n<p><strong>Class 5</strong></p>\n<ul>\n<li>● <a href=\"#the_world_around_us-v-ch02\" class=\"wl\">The World Around Us · Ch 2 Journey of a River</a> — Some pollutants dissolve invisibly in water while others such as oil do not (a spoon of sugar versus a spoon of cooking oil stirred into two glasses), both harming the river, and students design a simple water filter from everyday materials.</li>\n</ul>\n<p><strong>Class 6</strong></p>\n<ul>\n<li>● <a href=\"#science-vi-ch06\" class=\"wl\">Science · Ch 6 Materials Around Us</a> — Stirring sugar, salt, chalk powder, sand and sawdust into water shows that some materials dissolve completely (soluble) while others do not (insoluble), some liquids mix with water while others form a separate layer, and gases such as oxygen dissolve too, which is what makes aquatic life possible.</li>\n<li>◐ <a href=\"#science-vi-ch09\" class=\"wl\">Science · Ch 9 Methods of Separation in Everyday Life</a> — A dissolved solid such as salt is recovered from water by evaporating the water (in salt pans and by heating a salt solution to dryness), insoluble particles are removed by letting them settle and decanting or by filtering muddy water through filter paper, cloth, cotton, sand or charcoal, and oil is decanted off water because it forms a separate layer.</li>\n</ul>\n<p><strong>Class 7</strong></p>\n<ul>\n<li>○ <a href=\"#science-vii-ch04\" class=\"wl\">Science · Ch 4 The World of Metals and Non-metals</a> — Iron rusts only when both water and air are present (a nail in boiled, oil-covered water or in dry air stays clean), sodium is stored in kerosene to keep it from water while phosphorus is stored under water, and sulfur dioxide dissolves in water to give an acidic solution — water here is a reactant and storage medium, which has no id of its own, so it is placed under the nearest (water-as-solvent).</li>\n</ul>\n<p><strong>Class 8</strong></p>\n<ul>\n<li>◐ <a href=\"#science-viii-ch07\" class=\"wl\">Science · Ch 7 Particulate Nature of Matter</a> — Sugar dissolved in water turns invisible but is still there (its taste proves it) because its particles slip into the spaces between water particles, so the solution's volume is less than the sum of the two, whereas insoluble sand settles and adds volume; a grain of potassium permanganate spreading through water — faster in hot water — shows that water particles are always moving.</li>\n<li>◐ <a href=\"#science-viii-ch09\" class=\"wl\">Science · Ch 9 The Amazing World of Solutes, Solvents, and Solutions</a> — In a salt–water solution the dissolved solid is the solute and water the solvent; a fixed volume of water dissolves only so much salt before the solution is saturated, solubility of most solids rises with temperature (baking soda at 20, 50 and 70 °C) while that of gases falls, and concentration separates dilute from concentrated solutions.</li>\n<li>○ <a href=\"#science-viii-ch08\" class=\"wl\">Science · Ch 8 Nature of Matter: Elements, Compounds, and Mixtures</a> — Sugar dissolved in water is the model uniform mixture (components indistinguishable even under a microscope), sand-in-water and seawater are solid–liquid mixtures and oxygen-in-water a gas–liquid one, while water itself is shown by passing electricity through it to be a compound of hydrogen and oxygen in a fixed 2:1 ratio — a fact about water's own make-up with no id of its own, placed here as nearest.</li>\n</ul>\n<p><strong>Class 9</strong></p>\n<ul>\n<li>◐ <a href=\"#science-ix-ch05\" class=\"wl\">Science · Ch 5 Exploring Mixtures and their Separation</a> — Water solutions are now quantified — concentration as % m/m, % m/v or % v/v (ORS and 0.9% saline must be exact) and solubility read from curves against temperature — and separated by crystallizing a cooled saturated solution (copper sulfate; salt from seawater brine), distilling off a lower-boiling liquid such as acetone or recovering the solvent, running ink up chromatography paper with water as the solvent, draining oil from water in a separating funnel, and clearing suspended particles by filtration, centrifugation or alum coagulation, while colloids such as milk scatter light.</li>\n<li>◐ <a href=\"#science-ix-ch09\" class=\"wl\">Science · Ch 9 Atomic Foundations of Matter</a> — Ionic compounds such as salt and copper sulfate dissolve in water (not in kerosene or petrol) and their solutions conduct electricity because the ions become free to move, sugar dissolves without conducting, and camphor and naphthalene do not dissolve at all — while water itself is treated as a compound (hydrogen and oxygen always 1:8 by mass whatever the source, two single covalent bonds in H₂O, molecular mass 18 u), a fact with no id of its own placed here as nearest.</li>\n<li>○ <a href=\"#social_sciences-ix-ch02\" class=\"wl\">Social Sciences · Ch 2 Shaping of the Earth's Surface</a> — Chemical weathering changes minerals by reaction with water and acids, and groundwater dissolving limestone creates karst — caves, stalactites, stalagmites, sinkholes and underground rivers.</li>\n</ul>\n<p><em>Not touched in: Class 3, Class 4.</em></p>\n<h2><a href=\"#measuring-water\" class=\"wl\">Measuring water</a></h2>\n<p><strong>Class 3</strong></p>\n<ul>\n<li>● <a href=\"#mathematics-iii-ch11\" class=\"wl\">Mathematics · Ch 11 Filling and Lifting</a> — How much a vessel holds cannot be judged by its shape, so water or milk is poured into same-sized glasses to compare fairly, and the litre (then half and quarter litre) is met as the standard unit by checking a bucket, mug and glass against a 1-litre bottle.</li>\n<li>○ <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a> — Students estimate how much water everyday tasks need in informal units (mugs of water to brush teeth, water used for a shower) to build a sense of quantity — placed under the nearest id, since no standard units such as litres are used.</li>\n</ul>\n<p><strong>Class 4</strong></p>\n<ul>\n<li>◐ <a href=\"#mathematics-iv-ch08\" class=\"wl\">Mathematics · Ch 8 Weigh It, Pour It</a> — The litre is subdivided into millilitres — 500 ml is half a litre, 250 ml a quarter, 100 ml a tenth — discovered by pouring, with 10 ml dosing cups and 1 ml droppers for tiny amounts, and household containers (water bottle, glass, mug, jug, bucket) are estimated then measured.</li>\n</ul>\n<p><strong>Class 5</strong></p>\n<ul>\n<li>◐ <a href=\"#mathematics-v-ch08\" class=\"wl\">Mathematics · Ch 8 Weight and Capacity</a> — Litres and millilitres are tied by 1,000 ml = 1 l on a double number line, so 1 l 400 ml is 1,400 ml (not 1,040 ml), and amounts of water, milk, fuel and oil in compound l-and-ml form are compared, added, subtracted, multiplied and divided with regrouping across the 1,000.</li>\n<li>○ <a href=\"#the_world_around_us-v-ch04\" class=\"wl\">The World Around Us · Ch 4 Our School—A Happy Place</a> — Water is measured two ways: the time a drip takes to fill a glass (scaled to glasses per day), and water temperature read with a thermometer before and after an hour under a tree versus in the Sun.</li>\n</ul>\n<p><strong>Class 6</strong></p>\n<ul>\n<li>● <a href=\"#science-vi-ch06\" class=\"wl\">Science · Ch 6 Materials Around Us</a> — The amount of water in a tumbler is its volume — the space it occupies — and bottles labelled 1 L, 500 mL or 200 mL state that volume in litres and millilitres (with 1 m³ = 1000 L noted as the SI relation).</li>\n<li>● <a href=\"#science-vi-ch07\" class=\"wl\">Science · Ch 7 Temperature and its Measurement</a> — A laboratory thermometer is dipped into warm water and read while still immersed, held vertically with the eye level to the liquid column, to measure the water's temperature in degrees Celsius.</li>\n</ul>\n<p><strong>Class 8</strong></p>\n<ul>\n<li>◐ <a href=\"#science-viii-ch09\" class=\"wl\">Science · Ch 9 The Amazing World of Solutes, Solvents, and Solutions</a> — Water volume is read on a measuring cylinder (5 mL to 500 mL sizes) at its least count with the eye level to the meniscus — Activity 9.5 measures out exactly 50 mL — and the rise in water level when an irregular object is submerged gives that object's volume, while a digital balance with tare gives mass in grams.</li>\n</ul>\n<p><em>Not touched in: Class 7, Class 9.</em></p>\n<h2><a href=\"#water-and-heat\" class=\"wl\">Water and heat</a></h2>\n<p><strong>Class 5</strong></p>\n<ul>\n<li>○ <a href=\"#the_world_around_us-v-ch04\" class=\"wl\">The World Around Us · Ch 4 Our School—A Happy Place</a> — Water kept in the shade of a tree stays cooler than water left in the Sun, and clay matkas cool drinking water without electricity by evaporative cooling.</li>\n</ul>\n<p><strong>Class 6</strong></p>\n<ul>\n<li>● <a href=\"#science-vi-ch08\" class=\"wl\">Science · Ch 8 A Journey through States of Water</a> — Supplying heat turns ice to water and water to vapour while removing heat freezes water, and because evaporation takes heat from the water left behind, a porous earthen matka, a pot-in-pot cooler or water sprinkled on a floor cools things down.</li>\n</ul>\n<p><strong>Class 7</strong></p>\n<ul>\n<li>● <a href=\"#social_sciences-vii-ch03\" class=\"wl\">Social Sciences · Ch 3 Climates of India</a> — Because the sea absorbs and releases heat more slowly than land, coastal Mumbai has a yearly temperature range of about 14°C against inland Nagpur's 34°C, and this same land–ocean heating difference creates the pressure contrasts that drive the monsoon winds.</li>\n<li>◐ <a href=\"#science-vii-ch07\" class=\"wl\">Science · Ch 7 Heat Transfer in Nature</a> — Water heats by convection — warmed water at the base expands, rises and is replaced by cooler water, as a potassium permanganate trace shows — and because land heats and cools faster than water, air flows from sea to land by day (sea breeze) and from land to sea at night (land breeze), while a pan of water on a flame uses conduction, convection and radiation at once.</li>\n</ul>\n<p><strong>Class 8</strong></p>\n<ul>\n<li>◐ <a href=\"#science-viii-ch06\" class=\"wl\">Science · Ch 6 Pressure, Winds, Storms, and Cyclones</a> — Sea and land breezes are re-explained through pressure: by day the faster-heating land warms the air above it into a low-pressure area that cooler sea air flows into, and at night the warmer sea reverses the flow.</li>\n<li>◐ <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> — Oceans regulate climate by absorbing heat and releasing it slowly, and warm currents such as the Gulf Stream carry equatorial heat north through the Atlantic so that the United Kingdom is warmer than other places at the same latitude.</li>\n</ul>\n<p><strong>Class 9</strong></p>\n<ul>\n<li>◐ <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> — Water shapes Earth's heat budget: water vapour is a greenhouse gas, dark ocean water (low albedo) absorbs heat while snow and ice reflect it, and ocean currents move heat from the equator toward the poles, regulating climate.</li>\n<li>◐ <a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a> — Land heats and cools faster than the sea, so by day a sea breeze blows from sea to land and at night a land breeze from land to sea, moderating coastal climates, and the same contrast on a seasonal scale drives the monsoon's reversal.</li>\n</ul>\n<p><em>Not touched in: Class 3, Class 4.</em></p>\n<h2><a href=\"#water-in-society\" class=\"wl\">Water in society</a></h2>\n<p><strong>Class 3</strong></p>\n<ul>\n<li>● <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a> — People have long stored water in clay, copper, brass and other traditional vessels, kept pots of water outside their homes for passers-by in the hot months, and celebrate rain and rivers in songs and poems.</li>\n<li>○ <a href=\"#english-iii-ch13\" class=\"wl\">English · Ch 13 Madhu's Wish</a> — In Sudha Murty's story a magical tree grants Madhu every kind of food but no water, and the tale's whole moral is that water is worth more than any feast.</li>\n</ul>\n<p><strong>Class 5</strong></p>\n<ul>\n<li>◐ <a href=\"#the_world_around_us-v-ch02\" class=\"wl\">The World Around Us · Ch 2 Journey of a River</a> — Since ancient times settlements have grown beside rivers for reliable water; the Godavari is sacred (Dakshina Ganga, the Pushkaram festival at Nashik), families carry river stories and festivals, and students role-play as Sarpanch or plan a riverside city that stays clean, flood-safe and supplied through summer.</li>\n<li>○ <a href=\"#english-v-ch06\" class=\"wl\">English · Ch 6 What a Tank!</a> — Rural Punjab's rooftop water tanks are sculpted from cement and steel into flowers, footballs, roosters, tractors and aeroplanes that announce the owner's occupation or passion, and children design a community poster to preserve and clean old water tanks.</li>\n<li>○ <a href=\"#english-v-ch08\" class=\"wl\">English · Ch 8 The Decision of the Panchayat</a> — A village Panchayat under the banyan tree settles a dispute in which a neighbour who sold a well claims he did not sell the water in it, ruling that water kept in another's well belongs to the well's owner, and children judge whether the decision was fair.</li>\n<li>○ <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a> — Communities have built traditional rainwater-harvesting structures such as the johads of Rajasthan (small dams that collect rain and recharge groundwater), and Hiware Bazar in Maharashtra became water-positive through community-led watershed management.</li>\n</ul>\n<p><strong>Class 6</strong></p>\n<ul>\n<li>● <a href=\"#social_sciences-vi-ch06\" class=\"wl\">Social Sciences · Ch 6 The Beginnings of Indian Civilisation</a> — India's first civilisation grew on the plains watered by the Indus and the Sarasvatī, and its planned cities counted water and drainage management as a mark of urbanism — the waterproofed Great Bath of Mohenjo-daro, hundreds of brick-lined wells, and Dholavira's six stone or rock-cut reservoirs (the largest 73 m long) linked by underground drains.</li>\n<li>○ <a href=\"#science-vi-ch11\" class=\"wl\">Science · Ch 11 Nature's Treasures</a> — Rainwater harvesting is an age-old Indian practice, seen in traditional stepwells — the Bawadi of Rajasthan and the Vav of Gujarat — that store rainwater and water seeping from nearby ponds and lakes.</li>\n<li>○ <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a> — From earliest times people have used seas and oceans to migrate, trade, wage military campaigns and fish, coastal cultures built tales and legends around the sea, and ocean-born tsunamis such as the 2004 Indian Ocean tsunami are now met with early warning systems and the National Disaster Management Authority.</li>\n<li>○ <a href=\"#social_sciences-vi-ch03\" class=\"wl\">Social Sciences · Ch 3 Landforms and Life</a> — The first civilisations grew up around rivers in fertile plains, river sources and confluences are held sacred with festivals and rituals in India, rivers carry navigation and trade, and the Sangam tiṇai Neydal ties coastal life to fishing and seafaring.</li>\n</ul>\n<p><strong>Class 7</strong></p>\n<ul>\n<li>○ <a href=\"#english-vii-ch01\" class=\"wl\">English · Ch 1 The Day the River Spoke (Learning Together)</a> — The River is a living character who listens to a village girl and counsels her to go to school, and children go on to discuss why India's rivers are held sacred and mostly addressed as female (the Brahmaputra and Sone being male) and to name the country's boats — canoe, catamaran, coracle, shikara — and other water-transport words (boats placed here as the nearest fit in the vocabulary).</li>\n</ul>\n<p><strong>Class 8</strong></p>\n<ul>\n<li>◐ <a href=\"#social_sciences-viii-ch10\" class=\"wl\">Social Sciences · Ch 10 A Journey Through Indian Architecture</a> — Water structures are a distinct strand of Indian architecture: from Harappan drainage, Dholavira's reservoirs and interlocking trapezoid-brick wells, through Shringaverpur's Ganga-fed chain of reservoirs with silt-settling tanks, to the stepwells (vāvs, bāorīs such as Rani ki Vav) of Gujarat and Rajasthan that stored rainwater and gave a cool social space, temple tanks (puṣhkariṇīs) for harvesting and ritual, the Grand Anicut, and Agra Fort's Persian wheels lifting Yamuna water to fountains that cooled the palace.</li>\n<li>◐ <a href=\"#social_sciences-viii-ch14\" class=\"wl\">Social Sciences · Ch 14 India's Urban Landscape</a> — Cities have always depended on water — places near rivers grew into trade centres, Harappan Dholavira had complex water structures, and Jaipur was laid out in 1727 with reservoirs and canals for a steady supply in a dry climate — and today water supply and sewerage are core problems of urban planning, eased in Delhi by spreading growth across the National Capital Region and built into Singapore's master plans and Ahmedabad's Sabarmati Riverfront.</li>\n<li>○ <a href=\"#social_sciences-viii-ch01\" class=\"wl\">Social Sciences · Ch 1 Natural Resources and Their Use</a> — Water resources that cross political boundaries generate inter-state and international tensions, as with the Kaveri River shared among Karnataka, Tamil Nadu, Kerala and Puducherry.</li>\n<li>○ <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> — River valleys nurtured some of the world's earliest civilisations — the Nile was the cradle of ancient Egypt — and waterways carry trade: the Persian Gulf linked India and Europe for millennia, bays shelter ports and dockyards, and the Suez Canal (1869) made the shortest sea route from India to Europe.</li>\n</ul>\n<p><strong>Class 9</strong></p>\n<ul>\n<li>○ <a href=\"#social_sciences-ix-ch02\" class=\"wl\">Social Sciences · Ch 2 Shaping of the Earth's Surface</a> — The river plains of the Ganga, Nile, Brahmaputra and Indus gave rise to agricultural societies and early cities, coasts and harbours supported trade and cultural contact, ancient water management is documented in the Vedas, Kṛiṣhiparāśhara and Kauṭilya's Arthaśhāstra, and waterfalls and karst caves carry cultural or religious significance.</li>\n</ul>\n<p><em>Not touched in: Class 4.</em></p>"}, "joint-classes": {"title": "Joint-class candidates", "crumb": "view", "html": "<h1>Joint-class candidates</h1>\n<p><em>A cell where the same idea is taught in the same class by two or more subjects. Each is a candidate for a combined lesson, or at least for the two teachers to know what the other is doing that term.</em></p>\n<p>Part of the <a href=\"#Water\" class=\"wl\">Water</a> thread.</p>\n<h2>Class 3</h2>\n<h3><a href=\"#water-and-life\" class=\"wl\">Water and life</a></h3>\n<ul>\n<li>○ <a href=\"#english-iii-ch13\" class=\"wl\">English · Ch 13 Madhu's Wish</a> — When hiccups strike, sharbat, kheer and badam milk cannot stop them and only a jug of water can, so children talk about why the body needs water above all other food.</li>\n<li>○ <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a> — Water is essential for the survival of people, birds and animals, so students build and maintain a birdbath, note which birds and insects come to drink, and ask whether the water near them is fit for drinking.</li>\n</ul>\n<h3><a href=\"#measuring-water\" class=\"wl\">Measuring water</a></h3>\n<ul>\n<li>● <a href=\"#mathematics-iii-ch11\" class=\"wl\">Mathematics · Ch 11 Filling and Lifting</a> — How much a vessel holds cannot be judged by its shape, so water or milk is poured into same-sized glasses to compare fairly, and the litre (then half and quarter litre) is met as the standard unit by checking a bucket, mug and glass against a 1-litre bottle.</li>\n<li>○ <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a> — Students estimate how much water everyday tasks need in informal units (mugs of water to brush teeth, water used for a shower) to build a sense of quantity — placed under the nearest id, since no standard units such as litres are used.</li>\n</ul>\n<h3><a href=\"#water-in-society\" class=\"wl\">Water in society</a></h3>\n<ul>\n<li>● <a href=\"#the_world_around_us-iii-ch07\" class=\"wl\">The World Around Us · Ch 7 Water–A Precious Gift</a> — People have long stored water in clay, copper, brass and other traditional vessels, kept pots of water outside their homes for passers-by in the hot months, and celebrate rain and rivers in songs and poems.</li>\n<li>○ <a href=\"#english-iii-ch13\" class=\"wl\">English · Ch 13 Madhu's Wish</a> — In Sudha Murty's story a magical tree grants Madhu every kind of food but no water, and the tale's whole moral is that water is worth more than any feast.</li>\n</ul>\n<h2>Class 4</h2>\n<h3><a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a></h3>\n<ul>\n<li>○ <a href=\"#mathematics-iv-ch08\" class=\"wl\">Mathematics · Ch 8 Weigh It, Pour It</a> — Students count the litres of water they drink and use each day for showering, washing clothes and watering crops, and collect the drip from a leaking tap for an hour to work out how much water is wasted in a day and a week.</li>\n<li>○ <a href=\"#the_world_around_us-iv-ch09\" class=\"wl\">The World Around Us · Ch 9 Different Lands, Different Lives</a> — Water is scarce in the desert, so plants like cactus, khejri and babool survive by storing water and desert houses keep tankas (water tanks) for storage; students discuss why deserts are short of water.</li>\n</ul>\n<h2>Class 5</h2>\n<h3><a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a></h3>\n<ul>\n<li>● <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a> — Rainwater percolates through soil and rock to become groundwater drawn up by wells, borewells, tube wells and handpumps; paved city surfaces block recharge while open ground, soak pits, ponds and trees restore it, and students design a house or school that conserves water.</li>\n<li>◐ <a href=\"#the_world_around_us-v-ch02\" class=\"wl\">The World Around Us · Ch 2 Journey of a River</a> — A river supplies water for drinking, cooking, washing, irrigation and industry through pipes and canals; India's 900-plus dams store river water for dry seasons, irrigation and electricity at the cost of flooding land and displacing people; and drought (Chennai 2019) forces migration and calls for conservation habits, the National Water Mission and water ATMs.</li>\n<li>◐ <a href=\"#the_world_around_us-v-ch04\" class=\"wl\">The World Around Us · Ch 4 Our School—A Happy Place</a> — A dripping tap wastes far more water than it seems — students time how long a drip takes to fill a glass and scale it up to a day — and a green school fixes leaks, prevents wastage and collects rainwater, in the spirit of the Jal Shakti Abhiyan.</li>\n<li>○ <a href=\"#english-v-ch06\" class=\"wl\">English · Ch 6 What a Tank!</a> — Water has been stored for centuries in structures like Tamil Nadu's ooranis for rainwater harvesting, Kerala's year-round Panam Keni wells and Rajasthan's underground tankas, and today in household overhead tanks — and children list how water is wasted daily, how to stop it, and hear how a day without supply led a family to set up rainwater harvesting at home.</li>\n<li>○ <a href=\"#english-v-ch08\" class=\"wl\">English · Ch 8 The Decision of the Panchayat</a> — A farmer buys the well beside his new field because the well is the field's source of water, and the chapter states outright that water is priceless — so valuable that no price can be put on it.</li>\n<li>○ <a href=\"#the_world_around_us-v-ch07\" class=\"wl\">The World Around Us · Ch 7 Energy—How Things Work</a> — Flowing water is a clean energy source: fast-moving rivers generate electricity and traditional gharaats (watermills) in hilly areas grind grain, modelled with a paper-cup water wheel that turns when water is poured on it — placed under the nearest id, since hydropower is not in the vocabulary.</li>\n</ul>\n<h3><a href=\"#water-and-life\" class=\"wl\">Water and life</a></h3>\n<ul>\n<li>● <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a> — All living beings depend on freshwater, and freshwater habitats hold specially adapted plants and animals (fins and gills, waxy leaves; dragonfly, pond heron, freshwater turtle, lotus, water hyacinth) linked in a food chain, which students observe on a visit to a pond, lake or aquarium.</li>\n<li>◐ <a href=\"#the_world_around_us-v-ch02\" class=\"wl\">The World Around Us · Ch 2 Journey of a River</a> — Waste, plastic, untreated sewage and fertiliser runoff make river water unsafe for people and wildlife — algal 'green blankets' choke aquatic life and make water undrinkable — and floods spread disease and cut off safe drinking water.</li>\n<li>○ <a href=\"#english-v-ch05\" class=\"wl\">English · Ch 5 The Frog</a> — A frog lives in water and on land alike — sitting in ponds and muddy drains, swimming first as a tadpole and later with webbed feet — and children compare this amphibious life with a fish's and draw the frog's pond home.</li>\n</ul>\n<h3><a href=\"#measuring-water\" class=\"wl\">Measuring water</a></h3>\n<ul>\n<li>◐ <a href=\"#mathematics-v-ch08\" class=\"wl\">Mathematics · Ch 8 Weight and Capacity</a> — Litres and millilitres are tied by 1,000 ml = 1 l on a double number line, so 1 l 400 ml is 1,400 ml (not 1,040 ml), and amounts of water, milk, fuel and oil in compound l-and-ml form are compared, added, subtracted, multiplied and divided with regrouping across the 1,000.</li>\n<li>○ <a href=\"#the_world_around_us-v-ch04\" class=\"wl\">The World Around Us · Ch 4 Our School—A Happy Place</a> — Water is measured two ways: the time a drip takes to fill a glass (scaled to glasses per day), and water temperature read with a thermometer before and after an hour under a tree versus in the Sun.</li>\n</ul>\n<h3><a href=\"#water-in-society\" class=\"wl\">Water in society</a></h3>\n<ul>\n<li>◐ <a href=\"#the_world_around_us-v-ch02\" class=\"wl\">The World Around Us · Ch 2 Journey of a River</a> — Since ancient times settlements have grown beside rivers for reliable water; the Godavari is sacred (Dakshina Ganga, the Pushkaram festival at Nashik), families carry river stories and festivals, and students role-play as Sarpanch or plan a riverside city that stays clean, flood-safe and supplied through summer.</li>\n<li>○ <a href=\"#english-v-ch06\" class=\"wl\">English · Ch 6 What a Tank!</a> — Rural Punjab's rooftop water tanks are sculpted from cement and steel into flowers, footballs, roosters, tractors and aeroplanes that announce the owner's occupation or passion, and children design a community poster to preserve and clean old water tanks.</li>\n<li>○ <a href=\"#english-v-ch08\" class=\"wl\">English · Ch 8 The Decision of the Panchayat</a> — A village Panchayat under the banyan tree settles a dispute in which a neighbour who sold a well claims he did not sell the water in it, ruling that water kept in another's well belongs to the well's owner, and children judge whether the decision was fair.</li>\n<li>○ <a href=\"#the_world_around_us-v-ch01\" class=\"wl\">The World Around Us · Ch 1 Water — The Essence of Life</a> — Communities have built traditional rainwater-harvesting structures such as the johads of Rajasthan (small dams that collect rain and recharge groundwater), and Hiware Bazar in Maharashtra became water-positive through community-led watershed management.</li>\n</ul>\n<h2>Class 6</h2>\n<h3><a href=\"#water-cycle\" class=\"wl\">The water cycle</a></h3>\n<ul>\n<li>● <a href=\"#science-vi-ch08\" class=\"wl\">Science · Ch 8 A Journey through States of Water</a> — Water vapour rising from oceans, lakes and rivers cools and condenses around dust particles to form clouds, the droplets merge into drops heavy enough to fall as rain (or hail or snow), and the water collects again in oceans, lakes, rivers and groundwater — the water cycle.</li>\n<li>○ <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a> — Oceans drive the water cycle by generating the rainfall that keeps continents from being deserts, which is why clouds forming over the ocean are the source of India's summer monsoon.</li>\n</ul>\n<h3><a href=\"#rain-and-monsoon\" class=\"wl\">Rain and the monsoon</a></h3>\n<ul>\n<li>● <a href=\"#science-vi-ch07\" class=\"wl\">Science · Ch 7 Temperature and its Measurement</a> — Air temperature is a weather measurement: weather services record each day's maximum and minimum air temperature, which rises towards summer and falls in winter and is used in forecasting (this node is weather measurement only, with no water content — recorded because the vocabulary lists weather measurement here).</li>\n<li>● <a href=\"#science-vi-ch08\" class=\"wl\">Science · Ch 8 A Journey through States of Water</a> — Humidity is the measure of water vapour in the air; on rainy, humid days evaporation is slower and clothes dry slowly, and rain is what falls when cloud droplets grow heavy.</li>\n<li>○ <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a> — India's summer monsoon rains originate over the ocean, and the same oceans generate cyclones — violent storms with extreme rainfall and strong winds that damage coastal regions.</li>\n<li>○ <a href=\"#social_sciences-vi-ch03\" class=\"wl\">Social Sciences · Ch 3 Landforms and Life</a> — Precipitation is defined as water reaching the ground as rain, snow or hail, deserts are the landform that receives very little of it, and cloudbursts, flash floods and heavy snowfall are among the hazards of mountain life.</li>\n<li>○ <a href=\"#social_sciences-vi-ch06\" class=\"wl\">Social Sciences · Ch 6 The Beginnings of Indian Civilisation</a> — A global climatic change from about 2200 BCE reduced rainfall and made farming harder, which together with the drying of the Sarasvatī in its central basin led to the abandonment of cities such as Kalibangan and Banawali.</li>\n</ul>\n<h3><a href=\"#oceans-and-water-bodies\" class=\"wl\">Oceans and water bodies</a></h3>\n<ul>\n<li>● <a href=\"#science-vi-ch11\" class=\"wl\">Science · Ch 11 Nature's Treasures</a> — Water covers about two-thirds of the Earth's surface, but most of it lies in oceans and seas as saline water, with freshwater held in ice sheets and snow, rivers, lakes, ponds, wells and underground sources.</li>\n<li>● <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a> — Water covers almost three-fourths of the Earth, mostly as five named but continuously connected oceans (Pacific the largest, Arctic the smallest) whose seas, bays and gulfs are parts of one global body, the Southern Hemisphere is mostly water, and freshwater is only a small share found in glaciers, rivers, lakes, the atmosphere and underground.</li>\n</ul>\n<h3><a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a></h3>\n<ul>\n<li>● <a href=\"#science-vi-ch11\" class=\"wl\">Science · Ch 11 Nature's Treasures</a> — Water is a precious resource because most of it is saline and only a very small fraction of freshwater is easily accessible, so wastage in hand washing, cooking and gardening should be cut by turning off taps, fixing leaks, recycling water and harvesting rainwater — access is unequal across India, and water counts as a renewable resource only when used judiciously.</li>\n<li>○ <a href=\"#science-vi-ch08\" class=\"wl\">Science · Ch 8 A Journey through States of Water</a> — Only a small fraction of Earth's water is available to living things, the rest lying in the oceans, so water must be used wisely and water bodies kept free of pollution; an Atmospheric Water Generator can even harvest water by condensing humid air.</li>\n<li>○ <a href=\"#social_sciences-vi-ch03\" class=\"wl\">Social Sciences · Ch 3 Landforms and Life</a> — Farming on the Ganga plain, once rainfed, now depends heavily on irrigation from canals and groundwater, which has raised production but depleted groundwater — a challenge for the future.</li>\n<li>○ <a href=\"#social_sciences-vi-ch06\" class=\"wl\">Social Sciences · Ch 6 The Beginnings of Indian Civilisation</a> — Harappans drew water from brick-lined wells, ponds and streams, and where these were lacking built human-made reservoirs that harvested and distributed water — an infrastructure that needed organised administration to build and maintain.</li>\n</ul>\n<h3><a href=\"#water-and-life\" class=\"wl\">Water and life</a></h3>\n<ul>\n<li>● <a href=\"#science-vi-ch10\" class=\"wl\">Science · Ch 10 Living Creatures: Exploring their Characteristics</a> — A seed needs water and air (not light) to germinate — water softens the seed coat so the embryo can grow — while mosquitoes lay eggs on stagnant water where larvae and pupae surface to breathe, and frogs begin life as spawn and tadpoles swimming in ponds before living on both land and water.</li>\n<li>● <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a> — Every layer of the ocean from sunlit surface to dark depths hosts marine flora (algae, seaweeds) and marine fauna (fish, dolphins, whales), the ocean's plant life makes more than half the world's oxygen, and salty seawater is unfit for land animals to drink.</li>\n<li>○ <a href=\"#social_sciences-vi-ch06\" class=\"wl\">Social Sciences · Ch 6 The Beginnings of Indian Civilisation</a> — Harappan homes had bathing areas connected to a city-wide drainage network beneath the streets that carried waste water away — an early system of sanitation.</li>\n</ul>\n<h3><a href=\"#water-in-society\" class=\"wl\">Water in society</a></h3>\n<ul>\n<li>● <a href=\"#social_sciences-vi-ch06\" class=\"wl\">Social Sciences · Ch 6 The Beginnings of Indian Civilisation</a> — India's first civilisation grew on the plains watered by the Indus and the Sarasvatī, and its planned cities counted water and drainage management as a mark of urbanism — the waterproofed Great Bath of Mohenjo-daro, hundreds of brick-lined wells, and Dholavira's six stone or rock-cut reservoirs (the largest 73 m long) linked by underground drains.</li>\n<li>○ <a href=\"#science-vi-ch11\" class=\"wl\">Science · Ch 11 Nature's Treasures</a> — Rainwater harvesting is an age-old Indian practice, seen in traditional stepwells — the Bawadi of Rajasthan and the Vav of Gujarat — that store rainwater and water seeping from nearby ponds and lakes.</li>\n<li>○ <a href=\"#social_sciences-vi-ch02\" class=\"wl\">Social Sciences · Ch 2 Oceans and Continents</a> — From earliest times people have used seas and oceans to migrate, trade, wage military campaigns and fish, coastal cultures built tales and legends around the sea, and ocean-born tsunamis such as the 2004 Indian Ocean tsunami are now met with early warning systems and the National Disaster Management Authority.</li>\n<li>○ <a href=\"#social_sciences-vi-ch03\" class=\"wl\">Social Sciences · Ch 3 Landforms and Life</a> — The first civilisations grew up around rivers in fertile plains, river sources and confluences are held sacred with festivals and rituals in India, rivers carry navigation and trade, and the Sangam tiṇai Neydal ties coastal life to fishing and seafaring.</li>\n</ul>\n<h2>Class 7</h2>\n<h3><a href=\"#water-cycle\" class=\"wl\">The water cycle</a></h3>\n<ul>\n<li>◐ <a href=\"#science-vii-ch07\" class=\"wl\">Science · Ch 7 Heat Transfer in Nature</a> — Solar radiation drives evaporation from oceans, rivers and lakes and transpiration from plants, the rising vapour cools and condenses into clouds, and precipitation as rain, snow or hail returns water through soil, rocks and plants to the water bodies — with water present in nature as liquid, as snow, ice sheets and glaciers, and as vapour.</li>\n<li>○ <a href=\"#social_sciences-vii-ch02\" class=\"wl\">Social Sciences · Ch 2 Understanding the Weather</a> — The IMD's motto 'From the sun arises rain', taken from the Manusmṛiti's 'from the sun arises rain, from rain comes food, and from food, living beings originate', is presented as the ancient understanding of the sun's role in the water cycle.</li>\n<li>○ <a href=\"#social_sciences-vii-ch03\" class=\"wl\">Social Sciences · Ch 3 Climates of India</a> — Cooler, moisture-laden winds drawn in from the ocean condense their moisture over the heated land and drop it as heavy monsoon rain, and winds crossing the Bay of Bengal collect moisture again for east and south India — the ocean-to-rain leg of the water cycle.</li>\n</ul>\n<h3><a href=\"#rivers-and-landforms\" class=\"wl\">Rivers and landforms</a></h3>\n<ul>\n<li>● <a href=\"#science-vii-ch05\" class=\"wl\">Science · Ch 5 Changes Around Us: Physical and Chemical</a> — Rocks break into sediments by weathering — water freezing in cracks, temperature swings, growing roots, and water with dissolved chemicals reacting with rock surfaces — and flowing water and wind then carry the sediments away (erosion) to settle in water bodies where, over thousands of years, they harden into new rock.</li>\n<li>◐ <a href=\"#social_sciences-vii-ch01\" class=\"wl\">Social Sciences · Ch 1 Geographical Diversity of India</a> — Summer snow-melt from the Himalayas — the Bhagirathi rising at Gaumukh from the Gangotri Glacier — feeds the Ganga, Indus and Brahmaputra whose mineral-laden waters build the fertile Gangetic plains, the eastward tilt of the peninsular plateau sends the Godavari, Krishna, Kaveri and Mahanadi to the Bay of Bengal as wide fertile deltas while the Narmada and Tapti flow west into estuaries, and the Ganga–Brahmaputra delta forms the mangrove Sundarbans.</li>\n<li>○ <a href=\"#social_sciences-vii-ch03\" class=\"wl\">Social Sciences · Ch 3 Climates of India</a> — Floods occur when heavy rain, river-bank breaches or bursting glacial lakes send water over normally dry land — as in the 2013 Kedarnath disaster — and urban flooding is worsened by poor drainage, encroached waterways and impermeable concrete.</li>\n</ul>\n<h3><a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a></h3>\n<ul>\n<li>◐ <a href=\"#science-vii-ch07\" class=\"wl\">Science · Ch 7 Heat Transfer in Nature</a> — Rain seeps into the ground fastest through gravel and slowest through clay (infiltration) to become groundwater held in aquifers that wells and bore wells tap, and since over-extraction and urban concrete are depleting it, rainwater harvesting and recharge pits are needed — Ladakh's ice stupas store winter stream water as ice to release for farming in summer.</li>\n<li>◐ <a href=\"#social_sciences-vii-ch01\" class=\"wl\">Social Sciences · Ch 1 Geographical Diversity of India</a> — The Himalayas are the 'Water Tower of Asia' whose rivers supply drinking, farming and industrial water to hundreds of millions, while in the water-scarce Thar people conserve rain with traditional taanka or kund rainwater-harvesting systems.</li>\n<li>○ <a href=\"#social_sciences-vii-ch03\" class=\"wl\">Social Sciences · Ch 3 Climates of India</a> — The arid Thar demands unique water conservation practices, and a failed monsoon brings water scarcity that hurts farming and the industries that depend on predictable water availability.</li>\n</ul>\n<h3><a href=\"#water-and-heat\" class=\"wl\">Water and heat</a></h3>\n<ul>\n<li>● <a href=\"#social_sciences-vii-ch03\" class=\"wl\">Social Sciences · Ch 3 Climates of India</a> — Because the sea absorbs and releases heat more slowly than land, coastal Mumbai has a yearly temperature range of about 14°C against inland Nagpur's 34°C, and this same land–ocean heating difference creates the pressure contrasts that drive the monsoon winds.</li>\n<li>◐ <a href=\"#science-vii-ch07\" class=\"wl\">Science · Ch 7 Heat Transfer in Nature</a> — Water heats by convection — warmed water at the base expands, rises and is replaced by cooler water, as a potassium permanganate trace shows — and because land heats and cools faster than water, air flows from sea to land by day (sea breeze) and from land to sea at night (land breeze), while a pan of water on a flame uses conduction, convection and radiation at once.</li>\n</ul>\n<h2>Class 8</h2>\n<h3><a href=\"#water-cycle\" class=\"wl\">The water cycle</a></h3>\n<ul>\n<li>○ <a href=\"#science-viii-ch13\" class=\"wl\">Science · Ch 13 Our Home: Earth, a Unique Life Sustaining Planet</a> — Water vapour forms clouds that bring rain and snow, refilling rivers and lakes and deciding which plants and animals can live in a region — and cutting down a forest can change the rainfall.</li>\n<li>○ <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> — Oceans add moisture to the air that forms clouds and rainfall, which is how the distant Southern Indian Ocean influences the monsoon in the Gangetic Plains.</li>\n</ul>\n<h3><a href=\"#oceans-and-water-bodies\" class=\"wl\">Oceans and water bodies</a></h3>\n<ul>\n<li>◐ <a href=\"#science-viii-ch13\" class=\"wl\">Science · Ch 13 Our Home: Earth, a Unique Life Sustaining Planet</a> — Water covering about 70 per cent of Earth's surface — ponds, rivers, seas, oceans and groundwater — forms the hydrosphere, which is why Earth looks like the Blue Planet from space, and melting ice caps now raise sea levels that flood coastal areas.</li>\n<li>◐ <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> — The ocean covers about 71 per cent of the Earth and holds 97 per cent of its water over a floor of mountains, valleys and trenches (the Mariana's Challenger Deep over 11,000 m down); the five oceans are revisited with their distinct features, ocean currents run like giant rivers carrying warm water poleward and cold water toward the equator, seas, gulfs, bays, straits and canals are classified by shape and trade role, and the Great Lakes are a chain of five massive freshwater lakes.</li>\n<li>○ <a href=\"#science-viii-ch06\" class=\"wl\">Science · Ch 6 Pressure, Winds, Storms, and Cyclones</a> — A cyclone is powered by warm ocean water — rising moist air condenses and releases latent heat that deepens the low pressure — weakens once it reaches land and loses its moist air, and drives storm surges of 3–12 metres that flood coasts and contaminate drinking water with seawater.</li>\n</ul>\n<h3><a href=\"#water-as-resource\" class=\"wl\">Water as a resource</a></h3>\n<ul>\n<li>◐ <a href=\"#social_sciences-viii-ch01\" class=\"wl\">Social Sciences · Ch 1 Natural Resources and Their Use</a> — Water is a renewable resource only while Nature's rhythm of restoration is not disturbed: farmers across India pump groundwater for irrigation faster than it recharges so water tables fall, Punjab's Green Revolution crops and free electricity have left almost 80 per cent of its area 'overexploited' with groundwater beyond about 30 metres, Himalayan glaciers melt faster than precipitation replaces them, and the remedies are water harvesting, pond rejuvenation and reduced consumption.</li>\n<li>◐ <a href=\"#social_sciences-viii-ch14\" class=\"wl\">Social Sciences · Ch 14 India's Urban Landscape</a> — Bengaluru suffers summer water shortages and monsoon flooding because of poor planning, groundwater overuse, no rainwater harvesting and encroached lake beds — its roughly 1,000 lakes reduced to about 200 — and non-profits, resident associations and communities have revived lakes such as Yelahanka by desilting, repairing bunds, clearing drainage channels and replanting, increasing water availability.</li>\n<li>○ <a href=\"#science-viii-ch06\" class=\"wl\">Science · Ch 6 Pressure, Winds, Storms, and Cyclones</a> — Overhead water tanks are placed high to supply good pressure and dam bases are built broader than their tops to withstand the large sideways water pressure near the bottom, because liquid pressure depends on the height of the water column and acts in all directions (liquid pressure itself has no id; placed under the nearest).</li>\n<li>○ <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> — Rivers, mountains and lakes are freshwater suppliers — the Nile's irrigation, drinking water and hydropower, the Alps' drinking water, irrigation and hydroelectricity, the Andes as a source for millions, the Great Lakes' city water now facing chemical contamination — while desert life clusters at Sahara oases and Gobi pastures fed by underground water.</li>\n<li>○ <a href=\"#social_sciences-viii-ch10\" class=\"wl\">Social Sciences · Ch 10 A Journey Through Indian Architecture</a> — Because India's monsoon delivers water seasonally, people over millennia built structures to harvest, store and distribute it — from the village pond to the Grand Anicut — suited to each region's geology and climate, and many now suffer from depleted sources, poor maintenance, pollution and waste dumping that environmentalists, locals and NGOs work to reverse.</li>\n</ul>\n<h3><a href=\"#water-and-life\" class=\"wl\">Water and life</a></h3>\n<ul>\n<li>◐ <a href=\"#science-viii-ch13\" class=\"wl\">Science · Ch 13 Our Home: Earth, a Unique Life Sustaining Planet</a> — Liquid water is essential for life to evolve and be sustained: it acts as a solvent, transports nutrients in plants, regulates body temperature in animals, aids digestion and supports aquatic life from plankton to whales, while water pollution from industrial, agricultural and plastic waste harms that life.</li>\n<li>◐ <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> — Oceans support life from plankton to the blue whale and supply almost half the oxygen we breathe, trench organisms live in total darkness on chemical energy instead of photosynthesis, and coral reefs — 'rainforests of the sea' sheltering a quarter of all ocean species — are bleaching as human actions change ocean chemistry.</li>\n<li>○ <a href=\"#science-viii-ch09\" class=\"wl\">Science · Ch 9 The Amazing World of Solutes, Solvents, and Solutions</a> — Colder water holds more dissolved oxygen, so warming water leaves fish short of oxygen, and because ice is less dense than water it floats and insulates the water beneath, keeping aquatic life alive in cold climates.</li>\n<li>○ <a href=\"#social_sciences-viii-ch01\" class=\"wl\">Social Sciences · Ch 1 Natural Resources and Their Use</a> — Water, with air and food, is a resource life cannot exist without and humans cannot manufacture, yet chemical contamination of over-pumped groundwater in Punjab and cement-industry pollution now pose health hazards, and access to water is inequitably distributed with the poor bearing the burden.</li>\n<li>○ <a href=\"#social_sciences-viii-ch14\" class=\"wl\">Social Sciences · Ch 14 India's Urban Landscape</a> — Unplanned urban growth and slums leave residents with poor access to water and sanitation, while sewage- and chemical-polluted lakes such as Bellandur and Varthur foam, release toxic gases and even catch fire.</li>\n</ul>\n<h3><a href=\"#water-and-heat\" class=\"wl\">Water and heat</a></h3>\n<ul>\n<li>◐ <a href=\"#science-viii-ch06\" class=\"wl\">Science · Ch 6 Pressure, Winds, Storms, and Cyclones</a> — Sea and land breezes are re-explained through pressure: by day the faster-heating land warms the air above it into a low-pressure area that cooler sea air flows into, and at night the warmer sea reverses the flow.</li>\n<li>◐ <a href=\"#social_sciences-viii-ch08\" class=\"wl\">Social Sciences · Ch 8 World Geography: Some Glimpses</a> — Oceans regulate climate by absorbing heat and releasing it slowly, and warm currents such as the Gulf Stream carry equatorial heat north through the Atlantic so that the United Kingdom is warmer than other places at the same latitude.</li>\n</ul>\n<h2>Class 9</h2>\n<h3><a href=\"#states-of-water\" class=\"wl\">States of water</a></h3>\n<ul>\n<li>○ <a href=\"#science-ix-ch05\" class=\"wl\">Science · Ch 5 Exploring Mixtures and their Separation</a> — Distillation exploits water's 100 °C boiling point — a lower-boiling liquid like acetone (56 °C) is boiled off first and condensed in a water-cooled condenser — and clouds of water droplets or ice crystals in air are posed as a colloid puzzle, with snowflakes and frost cited as natural crystals.</li>\n<li>○ <a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a> — Water vapour makes up only about 0.1 to 0.4 per cent of the atmosphere yet drives cloud formation, warmer air holds more of it, and precipitation is that vapour condensing out of saturated air as drizzle, rain, snow, sleet or hail.</li>\n</ul>\n<h3><a href=\"#water-cycle\" class=\"wl\">The water cycle</a></h3>\n<ul>\n<li>◐ <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> — The water cycle now includes surface runoff back to the ocean and infiltration into soil and rock, where water dissolves and carries minerals, and it links all five spheres — so a warmer atmosphere holding more moisture brings heavier rains in some places and droughts in others, while intense rainfall erodes soil and cuts groundwater recharge.</li>\n<li>○ <a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a> — Most water vapour and clouds sit in the troposphere, and the monsoon winds carry moisture gathered over the Indian Ocean, Arabian Sea and Bay of Bengal onto the land as rain.</li>\n</ul>\n<h3><a href=\"#rain-and-monsoon\" class=\"wl\">Rain and the monsoon</a></h3>\n<ul>\n<li>◐ <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> — Nearly all weather happens in the troposphere, and the monsoon is now treated as climate-sensitive: warmer Arabian Sea water intensifies the southwest monsoon, deforestation lowers local rainfall, and IITM Pune's coupled atmosphere–ocean–land–ice models forecast how warming may alter monsoon rainfall.</li>\n<li>◐ <a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a> — Precipitation falls when saturated air condenses, shaped by prevailing winds, mountains and seasons; India's tropical monsoon climate has four IMD seasons, and the monsoon is a wind reversal — the south-west monsoon (June–September), drawn in by a low over the fast-heating landmass, brings most of India's rain, while the north-east monsoon (October–February) blows seaward and rains mainly on the south-east coast after crossing the Bay of Bengal — mapped by normal dates of advance and retreat, vital to farming, water supply and festivals, and studied by the National Monsoon Mission.</li>\n<li>○ <a href=\"#social_sciences-ix-ch02\" class=\"wl\">Social Sciences · Ch 2 Shaping of the Earth's Surface</a> — Heavy continuous rainfall adds weight and reduces friction on slopes to trigger landslides and fills glacial lakes before outbursts, while prolonged drought and low rainfall leave loose dry soil for dust storms.</li>\n</ul>\n<h3><a href=\"#rivers-and-landforms\" class=\"wl\">Rivers and landforms</a></h3>\n<ul>\n<li>◐ <a href=\"#social_sciences-ix-ch02\" class=\"wl\">Social Sciences · Ch 2 Shaping of the Earth's Surface</a> — A river shapes land differently along its course — V-shaped valleys, waterfalls and rapids where hard rock resists in the upper course, meanders and oxbow lakes from outer-bank erosion and inner-bank deposition in the middle, deltas, levees and alluvial fans where it meets the sea — while glaciers carve U-shaped valleys, cirques and fjords, leave moraines that dam lakes, and can unleash Glacial Lake Outburst Floods when their ice or moraine dams fail.</li>\n<li>○ <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> — Melting glaciers add water to rivers and raise sea levels that threaten coastal cities such as Mumbai and Chennai, and intense rainfall runoff erodes soil.</li>\n<li>○ <a href=\"#social_sciences-ix-ch03\" class=\"wl\">Social Sciences · Ch 3 Atmosphere and Climate</a> — The 2025 Punjab floods came from heavy monsoon rain swelling the Satluj, Beas, Ravi and Ghaggar in succession, made worse by weak old embankments (dhūsī bāndh), building too close to rivers, silt reducing river and dam capacity and late warnings — and climate change is making floods, droughts, glacier melt and sea-level rise more frequent.</li>\n</ul>\n<h3><a href=\"#oceans-and-water-bodies\" class=\"wl\">Oceans and water bodies</a></h3>\n<ul>\n<li>◐ <a href=\"#science-ix-ch13\" class=\"wl\">Science · Ch 13 Earth as a System: Energy, Matter, and Life</a> — Surface water and groundwater form the hydrosphere and ice and snow the cryosphere; ocean currents driven by planetary winds, temperature and salinity differences, Earth's rotation and the continents form gyres that carry heat poleward (the North Atlantic Drift keeps European ports ice-free) and nutrients to marine life, and the ocean holds 71% of global carbon, acidifying as it warms.</li>\n<li>○ <a href=\"#social_sciences-ix-ch02\" class=\"wl\">Social Sciences · Ch 2 Shaping of the Earth's Surface</a> — Sea waves and currents are agents of gradation that undercut headlands into cliffs, wave-cut platforms, caves, arches and stacks and deposit bea
